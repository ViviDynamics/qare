# The repository's own target profile (#122): qare checks a site that is
# already running, so there is no compose file, seed, login, stubs or
# fixtures. The health check may be a path on the target. Every host a
# flow's browser reaches must be the target's own or listed in hosts;
# anything else refuses the run.
#
# The flow checks need the browser driver family, so the run executes in the
# published web image (#88): the profile names its flavour, and the
# pipeline's execute step pulls the image the flavour names.
target:
  url: https://en.wikipedia.org
  health: { http: /wiki/Main_Page, timeout: 30s }
  hosts: ["*.wikipedia.org", "*.wikimedia.org", "wikipedia.org", "wikimedia.org"]
flavour: web

# The commands a command check can genuinely run in the published image
# (#158): the image carries node, grep, test, python3 and nothing that runs
# the repository's test suites. QA.md says what is out of reach, so the
# planner uses the declared source checks where they apply and marks other
# suite-driven criteria unplannable instead of guessing an invocation.
commands:
  source:
    run: grep -n -- {{pattern}} {{path}}
    about: Asserts that the file {{path}} in the checkout carries {{pattern}}, printing the matching lines; empty output means the pattern is absent, so the check fails.
  script:
    run: node -- {{path}}
    about: Runs an existing plain JavaScript check script at {{path}} in the checkout; a missing path is not a runnable check, so fill {{path}} with a file the repository carries.

  mail-self-check:
    run: node -- .qa/checks/mail-evidence.mjs {{check}}
    about: Exercises the checkout's actual mail parser (check=quoted-auth) or missing-code delivery evidence writer (check=missing-code), asserting its result and printing the observed evidence; needs no build, test runner, mailbox or network.
    scratch: [.qa/checks/scratch]
  pipeline-defaults-check:
    run: node -- .qa/checks/pipeline-defaults.mjs {{check}}
    about: Exercises the checkout's pipeline defaults (#380) without a build, printing what it observed; its step stubs are bash functions, so a noexec scratch is fine. check=flake runs the execute step script with docker and git stubbed (one retry and the base revision's quarantine store reach qare run) and the checkout's runJob (a check that fails then passes is quarantined and unverified, one that always fails is failed); check=exclude applies collect's default planner diff pathspecs to lockfiles, generated paths and source, and prints the Planner diff section the checkout's post-evidence writes for what was left out; check=blocked posts a blocked verdict through the checkout's post-evidence (neutral by default, failure on opt-in) and runs the publish step script to show the opt-in reaching post-evidence and a typo refused.
    scratch: [.qa/checks/scratch]
  http-check:
    run: node -- .qa/checks/http-check.mjs {{check}}
    about: Exercises the checkout's http check kind (#378) without a build, with the app standing in for fetch in the same process, so it needs no network, and prints what it observed. check=plan loads an http check (method, path, headers, body, status, header and JSON path matchers) through the plan loader and shows a host URL, an unknown method, a missing status, a client header and an unread matcher refused; check=record runs one http check and prints the http.json evidence it writes, the request and the response status, headers and body, with the credential and cookie redacted; check=judge runs the checkout's runJob against a target with no model, proving one criterion and failing two on the same answer by their matchers alone; check=planner runs the checkout's planRun on a profile with no browser flavour (core) and prints the http kind it is offered, the prompt lines that describe it, and the http check it keeps.
    scratch: [.qa/checks/scratch]
  command-boot-check:
    run: node -- .qa/checks/command-boot.mjs {{check}}
    about: "Exercises the checkout's command boot (#379) without a build, with compose standing in for docker (recording each call and reading the project file the run wrote), so it needs no daemon or network, and prints what it observed. check=boot loads app.boot command, image and port through the profile loader, shows a mix with compose, a bad port, a multi-line image and a stub refused, and boots it with bootApp, printing the one-service project (the image built on a copy of the checkout, the command, PORT, the port published on the run's allocated QARE_APP_PORT) and the health probe on the run's port; check=run runs the checkout's runJob on a command-booted profile against a live app, with compose doing what the written project says (the checkout copied for COPY . /app, the command started with sh -c and PORT on the run's port) and a docker stand-in that answers only the run's project: the health check and a command check reach the app over loopback, and the profile's own seed and suite lines, docker compose -p qare-{{run.id}} exec -T app ..., run inside the service's copy, so the page shows the seeded data, the suite sees the seed, the checkout is untouched and another project is refused; check=isolation boots two command apps at once and shows distinct projects, ports and files, then qare reap downing both by name and removing their files; check=init runs the checkout's planInit on a repository with no compose file and a package.json start script, printing the command-form profile, and shows a compose file still winning and a repository with neither refused."
    scratch: [.qa/checks/scratch]
  faster-runs-check:
    run: node -- .qa/checks/faster-runs.mjs {{check}}
    about: "Exercises the checkout's faster booted runs (#381) without a build, with curl, docker and compose standing in as recorders, so it needs no daemon, network, model or credentials, and prints what it observed. check=jobs runs publish's own step, which asks the Actions API for this run attempt's jobs and adds each completed job's wall clock to the metrics record, and shows the standing report's job wall clock lines read from that record and, over twelve runs, the median over the latest ten beside the ones before; check=collect runs collect's own pull step (the version's tag resolved to its registry digest, and that digest pulled) and its inputs step (qare linked-issues run in that image with no network and no token), and lists collect's and main_collect's steps, which install and build nothing; check=base-image runs the checkout's runJob with base.image and shows the docker pull and inspect the base side makes, its build reset by the override while the head builds as before, the base side running the image whose revision label is the base commit (and building when it names another commit), result.json naming the image, and both boot forms (compose override, command boot project); check=ledger-default runs runJob with no base.criteria and shows a ledger-carried criterion compared, a new one not compared with the reason naming the default, and visual criteria kept at the base; check=build-cache shows the build-cache input off by default, only main_execute saving the cache on the default branch, execute and main_execute referencing no secret or token and handing the run's container no credential, a pull request's execute step reading and never writing it, and the boot's override adding only cache locations (no build args or secrets) for the services compose says build."
    scratch: [.qa/checks/scratch]
  explore-check:
    run: node -- .qa/checks/explore.mjs {{check}}
    about: "Exercises the checkout's exploration in the pipeline (#377) without a build, with docker stubbed and a stand-in page, needing no daemon, network, model or credentials, and prints what it observed. check=pipeline runs the plan job's own steps: the profile switch, each exploration step's condition, environment and place before the plan step (none names a secret, token or key file), serve handed no docker access, and the plan step's docker arguments off and on (on adds only --network host and --explore); check=plan shows the pages a snapshot recorded, a flow element read from that page kept with its page, and unseen elements refused by planRun. The real boot, browser and nare hand-off run in CI (scripts/explore-boot.sh)."
    scratch: [.qa/checks/scratch]
  prompt-file-check:
    run: node -- .qa/checks/prompt-file.mjs {{check}}
    about: "Exercises how the checkout's nare runner hands over its prompt (#401) without a build, and prints what it observed. check=runner runs the checkout's NareAgentRunner on a prompt of 216004 bytes (past the 131071 one argument carries on Linux) against a stand-in nare that records what it was given: the argv (run --prompt-file <file> and the flags, no prompt text in any argument), the prompt file's text equal to the prompt byte for byte, the file's mode 600 and its directory's 700, and the file gone after the run, and after a failed run too. check=nare runs the same runner against the nare the image installs, first printing the image's own record (/opt/qare/config/IMAGE.json, its flavour and nare version), the nare on PATH and the version images/core/Dockerfile pins, and requiring them to match (the web image is built FROM the core image, so its nare is the core image's), then, with a model fixture on loopback and no credentials: with a window of 1000000 the model receives the large prompt byte for byte; with no window set the same prompt stops with stop reason context before any model call, showing the context window, not the argument size, bounds a prompt. check=ci prints CI's images job steps that build the core image from the checkout (docker build -f images/core/Dockerfile -t qare-core:ci .) and then run scripts/nare-compat.mjs inside it, and the nare-compat lines that send a prompt over 131071 bytes, require it byte for byte and require stop reason context without a window. check=citations is the proof that no comment or doc (runner.ts, the workflows, docs/ or anywhere else in the tree) still cites the closed nare issue 29 as a current limit: it searches every file under packages, .github, docs, scripts, images and .qa (and README.md, AGENTS.md, CONSTITUTION.md) for that citation and for the old argument cap's wording, the terms its source lists, prints the number of files searched and each hit, fails on any hit, and prints the lines in runner.ts, pipeline.yml, docs/pipeline.md and docs/images.md that now say the prompt reaches nare by file. check=bounds is the proof that what still bounds a prompt is stated as the model's context window (nare-context-window, NARE_CONTEXT_WINDOW, #391) and not the argument size: it prints, with file and line, the statement of the bound in packages/core/src/runner.ts, docs/images.md, docs/pipeline.md, .github/workflows/pipeline.yml and .github/workflows/qare.yml, and fails if any is missing."
    scratch: [.qa/checks/scratch]

# The suites the main lane runs for the ledger's active criteria (#363): the
# lane reads no plan, it runs what each entry's `suite:<name>` check names.
# These run the same mail self-checks as the declared command above, so the
# three mail criteria (#290) are proven on the default branch every day.
suites:
  - { name: mail-quoted-auth, command: "node -- .qa/checks/mail-evidence.mjs quoted-auth", kind: command }
  - { name: mail-missing-code, command: "node -- .qa/checks/mail-evidence.mjs missing-code", kind: command }

# Who hears of a finding on main that no change can be blamed for (#154).
findings:
  fallback: Jason733i
