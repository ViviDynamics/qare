# The repository's own target profile (#122): qare checks a site that is
# already running, so there is no compose file, seed, login, stubs or
# fixtures. The health check may be a path on the target. Every host a
# flow's browser reaches must be the target's own or listed in hosts;
# anything else refuses the run.
#
# The flow checks need the browser driver family, so the run executes in the
# published web image (#88): the profile names its flavour, and the
# pipeline's execute step pulls the image the flavour names.
target:
  url: https://en.wikipedia.org
  health: { http: /wiki/Main_Page, timeout: 30s }
  hosts: ["*.wikipedia.org", "*.wikimedia.org", "wikipedia.org", "wikimedia.org"]
flavour: web

# The commands a command check can genuinely run in the published image
# (#158): the image carries node, grep, test, python3 and nothing that runs
# the repository's test suites. QA.md says what is out of reach, so the
# planner uses the declared source checks where they apply and marks other
# suite-driven criteria unplannable instead of guessing an invocation.
commands:
  source:
    run: grep -n -- {{pattern}} {{path}}
    about: Asserts that the file {{path}} in the checkout carries {{pattern}}, printing the matching lines; empty output means the pattern is absent, so the check fails.
  script:
    run: node -- {{path}}
    about: Runs an existing plain JavaScript check script at {{path}} in the checkout; a missing path is not a runnable check, so fill {{path}} with a file the repository carries.

  mail-self-check:
    run: node -- .qa/checks/mail-evidence.mjs {{check}}
    about: Exercises the checkout's actual mail parser (check=quoted-auth) or missing-code delivery evidence writer (check=missing-code), asserting its result and printing the observed evidence; needs no build, test runner, mailbox or network.
    scratch: [.qa/checks/scratch]

# The suites the main lane runs for the ledger's active criteria (#363): the
# lane reads no plan, it runs what each entry's `suite:<name>` check names.
# These run the same mail self-checks as the declared command above, so the
# three mail criteria (#290) are proven on the default branch every day.
suites:
  - { name: mail-quoted-auth, command: "node -- .qa/checks/mail-evidence.mjs quoted-auth", kind: command }
  - { name: mail-missing-code, command: "node -- .qa/checks/mail-evidence.mjs missing-code", kind: command }

# Who hears of a finding on main that no change can be blamed for (#154).
findings:
  fallback: Jason733i
