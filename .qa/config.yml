# The repository's own target profile (#122): qare checks a site that is
# already running, so there is no compose file, seed, login, stubs or
# fixtures. The health check may be a path on the target. Every host a
# flow's browser reaches must be the target's own or listed in hosts;
# anything else refuses the run.
#
# The flow checks need the browser driver family, so the run executes in the
# published web image (#88): the profile names its flavour, and the
# pipeline's execute step pulls the image the flavour names.
target:
  url: https://en.wikipedia.org
  health: { http: /wiki/Main_Page, timeout: 30s }
  hosts: ["*.wikipedia.org", "*.wikimedia.org", "wikipedia.org", "wikimedia.org"]
flavour: web

# The commands a command check can genuinely run in the published image
# (#158): the image carries node, grep, test, python3 and nothing that runs
# the repository's test suites. QA.md says what is out of reach, so the
# planner uses the declared source checks where they apply and marks other
# suite-driven criteria unplannable instead of guessing an invocation.
commands:
  source:
    run: grep -n -- {{pattern}} {{path}}
    about: Asserts that the file {{path}} in the checkout carries {{pattern}}, printing the matching lines; empty output means the pattern is absent, so the check fails.
  script:
    run: node -- {{path}}
    about: Runs an existing plain JavaScript check script at {{path}} in the checkout; a missing path is not a runnable check, so fill {{path}} with a file the repository carries.

  mail-self-check:
    run: node -- .qa/checks/mail-evidence.mjs {{check}}
    about: Exercises the checkout's actual mail parser (check=quoted-auth) or missing-code delivery evidence writer (check=missing-code), asserting its result and printing the observed evidence; needs no build, test runner, mailbox or network.
    scratch: [.qa/checks/scratch]
  pipeline-defaults-check:
    run: node -- .qa/checks/pipeline-defaults.mjs {{check}}
    about: Exercises the checkout's pipeline defaults (#380) without a build, printing what it observed; its step stubs are bash functions, so a noexec scratch is fine. check=flake runs the execute step script with docker and git stubbed (one retry and the base revision's quarantine store reach qare run) and the checkout's runJob (a check that fails then passes is quarantined and unverified, one that always fails is failed); check=exclude applies collect's default planner diff pathspecs to lockfiles, generated paths and source, and prints the Planner diff section the checkout's post-evidence writes for what was left out; check=blocked posts a blocked verdict through the checkout's post-evidence (neutral by default, failure on opt-in) and runs the publish step script to show the opt-in reaching post-evidence and a typo refused.
    scratch: [.qa/checks/scratch]
  http-check:
    run: node -- .qa/checks/http-check.mjs {{check}}
    about: Exercises the checkout's http check kind (#378) without a build, with the app standing in for fetch in the same process, so it needs no network, and prints what it observed. check=plan loads an http check (method, path, headers, body, status, header and JSON path matchers) through the plan loader and shows a host URL, an unknown method, a missing status, a client header and an unread matcher refused; check=record runs one http check and prints the http.json evidence it writes, the request and the response status, headers and body, with the credential and cookie redacted; check=judge runs the checkout's runJob against a target with no model, proving one criterion and failing two on the same answer by their matchers alone; check=planner runs the checkout's planRun on a profile with no browser flavour (core) and prints the http kind it is offered, the prompt lines that describe it, and the http check it keeps.
    scratch: [.qa/checks/scratch]
  command-boot-check:
    run: node -- .qa/checks/command-boot.mjs {{check}}
    about: "Exercises the checkout's command boot (#379) without a build, with compose standing in for docker (recording each call and reading the project file the run wrote), so it needs no daemon or network, and prints what it observed. check=boot loads app.boot command, image and port through the profile loader, shows a mix with compose, a bad port, a multi-line image and a stub refused, and boots it with bootApp, printing the one-service project (the image built on a copy of the checkout, the command, PORT, the port published on the run's allocated QARE_APP_PORT) and the health probe on the run's port; check=run runs the checkout's runJob on a command-booted profile against a live app, with compose doing what the written project says (the checkout copied for COPY . /app, the command started with sh -c and PORT on the run's port) and a docker stand-in that answers only the run's project: the health check and a command check reach the app over loopback, and the profile's own seed and suite lines, docker compose -p qare-{{run.id}} exec -T app ..., run inside the service's copy, so the page shows the seeded data, the suite sees the seed, the checkout is untouched and another project is refused; check=isolation boots two command apps at once and shows distinct projects, ports and files, then qare reap downing both by name and removing their files; check=init runs the checkout's planInit on a repository with no compose file and a package.json start script, printing the command-form profile, and shows a compose file still winning and a repository with neither refused."
    scratch: [.qa/checks/scratch]
  faster-runs-check:
    run: node -- .qa/checks/faster-runs.mjs {{check}}
    about: "Exercises the checkout's faster booted runs (#381) without a build, with curl, docker and compose standing in as recorders, so it needs no daemon, network, model or credentials, and prints what it observed. check=jobs runs publish's own step, which asks the Actions API for this run attempt's jobs and adds each completed job's wall clock to the metrics record, and shows the standing report's job wall clock lines read from that record and, over twelve runs, the median over the latest ten beside the ones before; check=collect runs collect's own pull step (the version's tag resolved to its registry digest, and that digest pulled) and its inputs step (qare linked-issues run in that image with no network and no token), and lists collect's and main_collect's steps, which install and build nothing; check=base-image runs the checkout's runJob with base.image and shows the docker pull and inspect the base side makes, its build reset by the override while the head builds as before, the base side running the image whose revision label is the base commit (and building when it names another commit), result.json naming the image, and both boot forms (compose override, command boot project); check=ledger-default runs runJob with no base.criteria and shows a ledger-carried criterion compared, a new one not compared with the reason naming the default, and visual criteria kept at the base; check=build-cache shows the build-cache input off by default, only main_execute saving the cache on the default branch, execute and main_execute referencing no secret or token and handing the run's container no credential, a pull request's execute step reading and never writing it, and the boot's override adding only cache locations (no build args or secrets) for the services compose says build."
    scratch: [.qa/checks/scratch]
  explore-check:
    run: node -- .qa/checks/explore.mjs {{check}}
    about: "Exercises the checkout's exploration in the pipeline (#377) without a build, with docker stubbed and a stand-in page, needing no daemon, network, model or credentials, and prints what it observed. check=pipeline runs the plan job's own steps: the profile switch, each exploration step's condition, environment and place before the plan step (none names a secret, token or key file), serve handed no docker access, and the plan step's docker arguments off and on (on adds only --network host and --explore); check=plan shows the pages a snapshot recorded, a flow element read from that page kept with its page, and unseen elements refused by planRun. The real boot, browser and nare hand-off run in CI (scripts/explore-boot.sh)."
    scratch: [.qa/checks/scratch]
  prompt-file-check:
    run: node -- .qa/checks/prompt-file.mjs {{check}}
    about: "Exercises how the checkout's nare runner hands over its prompt (#401) without a build, and prints what it observed. check=runner runs the checkout's NareAgentRunner on a prompt of 216004 bytes (past the 131071 one argument carries on Linux) against a stand-in nare that records what it was given: the argv (run --prompt-file <file> and the flags, no prompt text in any argument), the prompt file's text equal to the prompt byte for byte, the file's mode 600 and its directory's 700, and the file gone after the run, and after a failed run too. check=nare runs the same runner against the nare the image installs, first printing the image's own record (/opt/qare/config/IMAGE.json, its flavour and nare version), the nare on PATH and the version images/core/Dockerfile pins, and requiring them to match (the web image is built FROM the core image, so its nare is the core image's), then, with a model fixture on loopback and no credentials: with a window of 1000000 the model receives the large prompt byte for byte; with no window set the same prompt stops with stop reason context before any model call, showing the context window, not the argument size, bounds a prompt. check=ci prints CI's images job steps that build the core image from the checkout (docker build -f images/core/Dockerfile -t qare-core:ci .) and then run scripts/nare-compat.mjs inside it, and the nare-compat lines that send a prompt over 131071 bytes, require it byte for byte and require stop reason context without a window. check=citations is the proof that no comment or doc (runner.ts, the workflows, docs/ or anywhere else in the tree) still cites the closed nare issue 29 as a current limit: it searches every file under packages, .github, docs, scripts, images and .qa (and README.md, AGENTS.md, CONSTITUTION.md) for that citation and for the old argument cap's wording, the terms its source lists, prints the number of files searched and each hit, fails on any hit, and prints the lines in runner.ts, pipeline.yml, docs/pipeline.md and docs/images.md that now say the prompt reaches nare by file. check=bounds is the proof that what still bounds a prompt is stated as the model's context window (nare-context-window, NARE_CONTEXT_WINDOW, #391) and not the argument size: it prints, with file and line, the statement of the bound in packages/core/src/runner.ts, docs/images.md, docs/pipeline.md, .github/workflows/pipeline.yml and .github/workflows/qare.yml, and fails if any is missing."
    scratch: [.qa/checks/scratch]
  stack-egress-check:
    run: node -- .qa/checks/stack-egress.mjs {{check}}
    about: "Exercises the checkout's containment of a booted stack's egress (#382) without a build, with compose standing in as a recorder that answers config with a stack and logs with what the stack's resolver recorded, so it needs no daemon, network, model or credentials, and prints what it observed. check=sink runs the checkout's real DNS resolver (qare cell egress-dns) on loopback: a declared stub host and a wildcard stub host are answered with the address of the compose service that provides the stub, an undeclared host is answered NXDOMAIN and recorded once however often it is asked, and the record is read back by the run's own parser. check=boot runs bootApp with an image to start the resolver from, and docker standing in as a daemon that describes each container with its address, and prints the compose calls in order (the resolver started alone, the stub services, the stack, then the relay), the containment override (every network internal, every service on the internal qare-contained network beside the networks it had, published ports moved to the relay), the resolver override (every service resolving through the resolver with no search domain) and the down naming both overrides; a stack with network_mode host and a run with no image boot uncontained and say why. check=run runs the checkout's runJob: a stack that looked up api.undeclared-vendor.example is refused while its check is proven, result.json carries egress with the undeclared host, the evidence comment lists it as refused: missing stub: api.undeclared-vendor.example:unknown (dns), and the stub issue step reads it; an uncontained stack's evidence comment states its egress was not contained, and so does a target run's. check=example loads examples/crash-app/.qa with the checkout's profile loader, runs the web service's own command from examples/crash-app/compose.yaml for real with sh (it exits 1 after printing the known line crash-app: cannot reach db.crash-app.example, giving up), and runs the checkout's runJob on the example's profile with compose answering ps and logs from what that command printed and exited with: blocked, evidence/services/web.log holding the known line with the password redacted, and the posted comment naming web exited with code 1 and showing the known line. check=ci prints the CI step that boots examples/egress-app for real on docker (scripts/egress-boot.sh) and the lines of that script that hold the run to contained, refused, the undeclared vendor listed in the result and the comment, and no container or network left behind."
    scratch: [.qa/checks/scratch]
  pinned-stack-check:
    run: node -- .qa/checks/pinned-stack.mjs {{check}}
    about: "Exercises the checkout's containment of a stack that pins its addresses (#408) without a build, with compose standing in as a recorder and docker standing in as a daemon that describes each container with its address on the contained network and resolves no service name, so it needs no daemon, network, model or credentials, and prints what it observed. check=merge runs containmentOf on the compose config of examples/pinned-app (a default network with subnet 198.18.89.0/24, db pinned at ipv4_address 198.18.89.10 and billing-stub at 198.18.89.20, and web declaring no network, listed by compose as default null, with extra_hosts naming both) and prints, per service, its declared networks, the override's networks and the two merged by key as compose merges them: every service keeps default beside qare-contained, web keeps its implicit default, and db keeps ipv4_address 198.18.89.10; it also prints the override's top-level networks (default internal) and the stub services the resolver is handed. check=boot runs bootApp and prints every compose call in order (the resolver alone, its log, the stub service billing-stub started, compose exec of qare cell egress-dns-map in the resolver handing it billing-stub=<address>, the stack with --wait, then the relay alone with --no-deps), every docker call (ps by the project's label, then inspect), the resolver command with --map /run/qare-egress/services.json, the relay command forwarding 20000=198.18.0.4:3000 to an address and not a service name, and the down naming the three containment overrides. check=uncontained boots with a stub that has no address, an app that has no address, and a stub with no address whose down fails: the first two come up uncontained with the reason naming the service and the address it lacks, after a compose down and a plain compose up, with no relay started; the third is blocked with the reason and the failed down. check=sink runs the checkout's real DNS resolver on loopback with a map file and a service lookup that always fails, as on a daemon that answers no embedded DNS (no real DNS query is made): the stub host api.billing-vendor.example is answered rcode 2 before the map, the checkout's real qare cell egress-dns-map writes billing-stub=198.18.0.3, the same host is then answered rcode 0 with 198.18.0.3, and the only name lookup attempted is the one before the map existed; and the checkout's real qare cell egress-relay carries a connection to a forward that names an address. check=unit prints, with file and line, the unit test in packages/core/test/stack-egress.test.ts that covers a service with no declared networks beside one with ipv4_address on a custom subnet, then runs that test's own fixture through the checkout's containmentOf and holds every assertion of the test: web (no declared networks), db (ipv4_address 198.18.89.10 on subnet 198.18.89.0/24), billing-stub and worker each keep default beside qare-contained. check=example loads examples/crash-app/.qa with the checkout's profile loader, runs the web service's own command from examples/crash-app/compose.yaml for real with sh (it exits 1 after printing the known line crash-app: cannot reach db.crash-app.example, giving up), and runs the checkout's runJob on the example's profile with compose answering ps and logs from what that command printed and exited with: blocked, evidence/services/web.log holding the known line with the password redacted, and the posted comment naming web exited with code 1 and showing the known line. check=ci prints the CI step that boots examples/pinned-app for real on docker (scripts/pinned-boot.sh), the example's subnet, ipv4_address, extra_hosts and seed lines, and the lines of that script that hold the run to passed, contained, every criterion proven, the relay's forwards each naming an address, the resolver handed the stub's address, web on both the default and the contained network, and nothing left behind."
    scratch: [.qa/checks/scratch]
  boot-failure-check:
    run: node -- .qa/checks/boot-failure.mjs {{check}}
    about: "Exercises what a boot that failed leaves in the evidence (#407) without a build, with compose standing in as a recorder for a stack whose web service printed 26 lines (the last two a DATABASE_URL with a password and crash-app: cannot reach db.crash-app.example, giving up) and exited 1, beside a healthy db, and whose run resolver recorded db.crash-app.example as a name no stub declares, so it needs no daemon, network, model or credentials, and prints what it observed. check=boot runs the checkout's bootApp on that stack contained: blocked with compose up exited 1, and every compose call after the up in order (ps -a --format json, logs --tail 200 for web and for db, the resolver's log), with no down among them, each service's state, exit code and health, and the resolver's record read before the down. check=health runs bootApp on a stack whose up succeeds and whose health check never passes, and on one whose up never settles so the watchdog fires: both blocked, each with the services read (web exited with exit code 1 and its line) before any down, and runJob on the health path writing evidence/services/web.log and db.log redacted and a comment naming web exited with code 1. check=run runs the checkout's runJob one-sided: evidence/services/web.log and db.log written with the password redacted, result.json boot naming web exited with exit code 1 and its last 20 lines (db, which came up, carries none), result.json egress listing db.crash-app.example, and the posted comment naming web exited with code 1, its last 20 lines in a code fence with the line it printed, and the lookup as refused: missing stub: db.crash-app.example:unknown (dns), with no password anywhere. check=base runs the same two-sided, the base booting the same stack: evidence/head/services/web.log and evidence/base/services/web.log, result.json boot and base.boot, egress and base.egress, and a comment naming the failure at the head and at the base with head/ and base/ paths. check=seed runs runJob on a stack that came up whose seed exited 1: the services are read before the teardown and result.json carries boot. check=example loads examples/crash-app/.qa with the checkout's profile loader, runs the web service's own command from examples/crash-app/compose.yaml for real with sh (it exits 1 after printing the known line crash-app: cannot reach db.crash-app.example, giving up), and runs the checkout's runJob on the example's profile with compose answering ps and logs from what that command printed and exited with: blocked, evidence/services/web.log holding the known line with the password redacted, and the posted comment naming web exited with code 1 and showing the known line. check=ci prints the CI step that boots examples/crash-app for real on docker (scripts/crash-boot.sh), the example's lines that look up the name, print the known line and exit 1, and the lines of that script that hold the run to blocked, web exited 1 with the known line in its tail, the lookup recorded, the line in services/web.log, the password nowhere in the evidence, the comment showing web exited with code 1, the known line and the lookup, and nothing left behind."
    scratch: [.qa/checks/scratch]
  host-mcp-check:
    run: node -- .qa/checks/host-mcp.mjs {{check}}
    about: "Exercises how the checkout hands the host MCP channel (#93) to nare (#399) without a build, and prints what it observed. check=runner runs the checkout's NareAgentRunner against a stand-in nare that records what it was given: with two host servers it prints the --mcp-config (one alias per server, rig and sim, each its own URL) and --tools rig__power_on,sim__tick named once, and QARE_MCP_TOOLS and QARE_MCP_ENDPOINT unset even when the ambient environment carries stale ones; exploring too, one config holding explore, rig and sim and --tools explore__observe,rig__power_on,sim__tick; with no host server and no exploration, no --mcp-config and --tools none. check=nare runs against the nare the image installs, with a model fixture on loopback and no credentials: a stdio host server publishes power_on, read_led and wipe, the profile allows power_on and read_led, and the run names power_on; the plan step's tool server lists power_on and read_led, the model is offered rig__power_on alone with the schema the host published, its call returns the host's answer fenced as untrusted, a call to rig__read_led is refused by nare as not allowed in this session, a call to rig__wipe is an unknown tool, and mcp-calls.jsonl as the plan step writes it holds the one power_on call. check=profile loads profiles through the checkout's validateProfileConfig: a plan-step server named device rig and a plan-step tool named page.text are refused naming the nare rule, while an execute-step server with both names and a plan-step rig with power_on load. check=record runs the checkout's own qare plan command (packages/cli/src/index.ts, loaded from source with no build) on a profile that registers the rig server for the plan step, with a stand-in nare that reads the --mcp-config it is handed and calls rig's power_on through it over MCP: qare plan exits 0, the stand-in was handed --tools rig__power_on,rig__read_led and a config naming rig, and the check prints the files beside the plan (plan.json and mcp-calls.jsonl, in the same directory as the --out plan) and the mcp-calls.jsonl the plan command wrote there, holding the one power_on call with its arguments and result, and the command's own line recorded 1 host tool calls naming that path. check=docs prints, with file and line, the statements in ADR-0012, runner.ts and scripts/nare-compat.mjs that record the hand-off, and counts the lines in runner.ts that set a QARE_MCP variable (zero)."
    scratch: [.qa/checks/scratch]

# The suites the main lane runs for the ledger's active criteria (#363): the
# lane reads no plan, it runs what each entry's `suite:<name>` check names.
# These run the same mail self-checks as the declared command above, so the
# three mail criteria (#290) are proven on the default branch every day.
suites:
  - { name: mail-quoted-auth, command: "node -- .qa/checks/mail-evidence.mjs quoted-auth", kind: command }
  - { name: mail-missing-code, command: "node -- .qa/checks/mail-evidence.mjs missing-code", kind: command }

# Who hears of a finding on main that no change can be blamed for (#154).
findings:
  fallback: Jason733i
