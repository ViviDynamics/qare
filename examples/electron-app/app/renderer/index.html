<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Greeter</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
      label { display: block; margin-top: 0.75rem; }
      button { margin-top: 1rem; margin-right: 0.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Greeter</h1>
      <form id="greeter">
        <label>Name <input id="name" name="name" autocomplete="off" /></label>
        <label>Access code <input id="code" name="code" autocomplete="off" /></label>
        <label
          >Greeting
          <select id="greeting" name="greeting">
            <option>Hello</option>
            <option>Good evening</option>
          </select>
        </label>
        <button type="submit">Greet</button>
        <button type="button" id="details">Open details</button>
      </form>
      <p role="status" aria-label="Greeting shown" id="shown"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
