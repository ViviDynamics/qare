# The compose-app profile (../.qa/config.yml), with exploration turned on
# (#377): the plan job boots the base app and the planner explores it. qare's
# CI runs the plan job's own exploration steps against it
# (scripts/explore-boot.sh) and holds the planner to elements read from the
# page the app really served. Everything else is the profile next door.
flavour: web
explore: base
app:
  boot: { compose: examples/compose-app/compose.yaml, service: web }
  health: { http: "http://localhost:{{run.app_port}}/up", timeout: 180s }
  seed: { command: "true" }
  login: { fixture: fixtures/users.yml, role: reader }
stubs: []
visual:
  widths: [1440]
  themes: [light]
suites: []
