name: Sweep

# The scheduled sweep (#49): on a schedule, classify the whole criteria
# ledger and keep the one standing status issue current, filing a finding per
# problem when the ledger or its configuration cannot be read.
#
# There is no pull request in this picture: the checkout is main, so the
# secret-hygiene map (constitution rule 7) holds trivially. The
# classification step holds no secrets at all; the publish step holds the
# GitHub identity (#61) and runs nothing but code from main.
#
# A sweep failure is a finding, not a broken build: the classification step
# exits clean even when the ledger is unreadable, and the publish step files
# or updates one issue per problem, mentioning the person whose change last
# touched the ledger.

on:
  workflow_dispatch:
  schedule:
    # 04:17 UTC, daily: after the qa-assets pushes the pull request pipeline
    # makes, before the working day reaches UTC.
    - cron: '17 4 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: qare-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep (GitHub token only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # What the runs amount to over time (#51): every run's metrics record
      # rides to the orphan qa-assets branch as one JSON file, and the sweep
      # joins them into the store beside the ledger, so the standing report
      # reads the whole pilot period. A branch that is not there yet, or a
      # record in it that cannot be read, is not a finding: metrics describe
      # runs, they do not gate the sweep.
      - name: Assemble the metrics store from the runs' records
        run: |
          set -euo pipefail
          mkdir -p .qa/metrics
          if ! git fetch origin qa-assets --depth 1; then
            echo "no qa-assets branch: no run has pushed metrics yet"
            exit 0
          fi
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            git show "FETCH_HEAD:$file" | jq -c . >> .qa/metrics/runs.jsonl || {
              echo "skipped $file: not valid JSON"
            }
          done < <(git ls-tree -r --name-only FETCH_HEAD -- metrics)
      - name: Classify the ledger
        run: node packages/cli/dist/index.js sweep --ledger .qa --out sweep-payload.json
      - name: Publish the standing report and file findings
        # The identity the pull request pipeline posts as (#61): the App,
        # else a personal access token, else the workflow run. An unset
        # secret is empty, and qare then posts with the Actions token.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_ID: ${{ secrets.QARE_APP_ID }}
          QARE_APP_PRIVATE_KEY: ${{ secrets.QARE_APP_PRIVATE_KEY }}
          QARE_GITHUB_TOKEN: ${{ secrets.QARE_GITHUB_TOKEN }}
        run: |
          node packages/action/dist/index.js sweep-report --from sweep-payload.json \
            --repository "${{ github.repository }}"
