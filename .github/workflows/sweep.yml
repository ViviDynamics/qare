name: Sweep

# The scheduled sweep (#49): on a schedule, classify the whole criteria
# ledger and keep the one standing status issue current, filing a finding per
# problem when the ledger or its configuration cannot be read.
#
# There is no pull request in this picture: the checkout is main, so the
# secret-hygiene map (constitution rule 7) holds trivially. The
# classification step holds no secrets at all; the publish step holds the
# GitHub identity (#61) and runs nothing but code from main. The App's
# private key is used in one step alone, which mints a token for this
# repository with this job's permissions before anything is installed
# (#305); the publish step is handed that token. No dependency cache is
# restored.
#
# A sweep failure is a finding, not a broken build: the classification step
# exits clean even when the ledger is unreadable, and the publish step files
# or updates one issue per problem, mentioning the person whose change last
# touched the ledger.

on:
  workflow_dispatch:
  schedule:
    # 04:17 UTC, daily: after the qa-assets pushes the pull request pipeline
    # makes, before the working day reaches UTC.
    - cron: '17 4 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: qare-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep (GitHub token only)
    # Its schedule, which only ever runs the default branch's copy of this
    # file, and otherwise the default branch alone (#305): a manual run from
    # another branch would hand the identity to that branch's copy of the
    # code. This stops the accident. It is a line of this file, so it does
    # not stop a branch that removes it: whoever can push a branch here can
    # already change what a workflow does with the secrets it is handed.
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The App's private key is used here and nowhere else in this job (#305):
      # a script of this checkout that imports node's own modules alone, run
      # on the runner before any dependency is installed. It mints a token
      # for this repository alone, with the permissions this job declares,
      # that expires within the hour, and the publishing step is handed that
      # token. With no App stored it mints nothing and qare posts with the
      # personal access token or the Actions token; with half an App it
      # stops by name.
      - name: Mint the App token for this job
        id: app
        shell: bash
        env:
          QARE_APP_ID: ${{ secrets.QARE_APP_ID }}
          QARE_APP_PRIVATE_KEY: ${{ secrets.QARE_APP_PRIVATE_KEY }}
          QARE_APP_PERMISSIONS: '{"contents":"read","issues":"write"}'
        run: node scripts/mint-app-token.mjs
      # No dependency cache (#305): this job holds the identity, so what it
      # installs comes from the registry by the lockfile, never from a cache
      # another workflow could have written.
      # pnpm as package.json names it (#310): corepack, which ships with node,
      # reads `packageManager`, which carries the version and the hash the
      # download is checked against. No action installs it. The version that
      # resolved is then held to the one named, so a runner that answers with
      # another pnpm stops here.
      - name: Enable the pnpm package.json names
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          wanted="$(jq -r '.packageManager // empty' package.json)"
          wanted="${wanted%%+*}"
          found="pnpm@$(pnpm --version)"
          if [ "$found" != "$wanted" ]; then
            echo "::error::corepack resolved $found, and package.json names ${wanted:-no package manager}"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # What the runs amount to over time (#51): every run's metrics record
      # rides to the orphan qa-assets branch as one JSON file, and the sweep
      # joins them into the store beside the ledger, so the standing report
      # reads the whole pilot period. A branch that is not there yet, or a
      # record in it that cannot be read, is not a finding: metrics describe
      # runs, they do not gate the sweep.
      - name: Assemble the metrics store from the runs' records
        run: |
          set -euo pipefail
          mkdir -p .qa/metrics
          if ! git fetch origin qa-assets --depth 1; then
            echo "no qa-assets branch: no run has pushed metrics yet"
            exit 0
          fi
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            git show "FETCH_HEAD:$file" | jq -c . >> .qa/metrics/runs.jsonl || {
              echo "skipped $file: not valid JSON"
            }
          done < <(git ls-tree -r --name-only FETCH_HEAD -- metrics)
      - name: Classify the ledger
        run: node packages/cli/dist/index.js sweep --ledger .qa --out sweep-payload.json
      - name: Publish the standing report and file findings
        # The identity the pull request pipeline posts as (#61): the App,
        # by the token minted above, else a personal access token, else the
        # workflow run. An unset secret is empty, and qare then posts with
        # the Actions token.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.QARE_GITHUB_TOKEN }}
        run: |
          node packages/action/dist/index.js sweep-report --from sweep-payload.json \
            --repository "${{ github.repository }}"
      # The job tries to give the token back when it ends, however it ends,
      # so it does not outlive the work it was minted for. It expires within
      # the hour regardless, so a revocation that fails is a warning.
      - name: Revoke the App token this job minted
        if: always() && steps.app.outputs.token != ''
        shell: bash
        env:
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # On curl's standard input, never its command line.
          curl --fail --silent --show-error -X DELETE \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/installation/token" \
            -H @- <<< "Authorization: Bearer $QARE_APP_TOKEN" || echo "::warning::the App token this job minted could not be revoked; it expires within the hour"
