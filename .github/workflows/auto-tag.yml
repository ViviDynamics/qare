name: Auto-tag

# The release tag, created by the build that earns it (#188): once CI has
# passed on a push to main, the version package.json carries is tagged on the
# commit that was validated, and the release workflow is dispatched on that
# tag, so the images publish without a human step. The org precedent is nare's
# release workflow, which tags from a workflow_run of CI for the same reason:
# an event a workflow triggers with the workflow's own token creates no
# workflow runs, so the release is started explicitly rather than left to the
# tag push.
#
# A green merge to main tags and releases. When package.json's version is
# already tagged, the automation computes the next CalVer from the newest
# tag and the build's month: the patch climbs while the month does not, and
# a new month starts a new line.
#
# Two honest limits. GitHub Actions keeps one running and one pending run per
# concurrency group, so a burst of green builds can supersede a queued run,
# and a superseded merge ships in the release that follows it rather than in
# a tag of its own. And a computed tag cannot stamp the pipeline's qare-ref
# default, because the automation never pushes commits, so a caller pinning a
# computed tag names its qare-ref explicitly to avoid running one release
# behind.
#
# Idempotent per commit: a commit that already carries any tag, by a rerun or
# by a tag a person pushed first, is a no-op, so the release runs exactly once
# per commit and nothing loops.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag the release version
    # workflow_run fires for pull requests and failures too: the job accepts
    # nothing but a successful push to this repository's main.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      # contents: write pushes the tag; actions: write dispatches the release.
      # The workflow's own token is the only credential: no secret is stored.
      contents: write
      actions: write
    steps:
      # The commit CI validated, with full history: with a shallow clone,
      # GitHub has intermittently treated the tag's commit objects as new and
      # rejected the push from a workflow token (steward's create-tag job
      # documents the same lesson).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Read the version package.json carries
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Decide the version to tag
        run: |
          set -euo pipefail
          # A rerun of this job, or a tag a person pushed first, must not
          # release the same commit twice. Every tag ls-remote lists names
          # its object sha first, and an annotated tag's peeled line carries
          # the commit sha, so one of them naming the validated commit ends
          # the run here, before anything is computed.
          head="$(git rev-parse HEAD)"
          if git ls-remote --tags origin | awk '{print $1}' | grep -qx "$head"; then
            echo "the validated commit is already tagged: nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "tagged=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/$version")" ]; then
            echo "tagged=true" >> "$GITHUB_ENV"
            echo "the version package.json carries ($version) is untagged: tagging it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The packaged version is already released: a merge that did not bump
          # it still releases. A bump that names a version a computed release
          # already consumed lands here too, and ships under the next version,
          # which the summary says. The next CalVer comes from the newest tag
          # and the build's month: the patch climbs while the month does not,
          # and a new month starts a new line.
          latest="$(git ls-remote --tags origin 'refs/tags/*.*.*' | cut -d/ -f3 | sed 's/\^{}$//' | sort -V | tail -1)"
          line="$(date -u +%Y.%-m)"
          case "$latest" in
            "$line".*) patch="$((${latest#"$line."} + 1))" ;;
            *) patch=0 ;;
          esac
          next="$line.$patch"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$next")" ]; then
            echo "tag $next already exists on origin: nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "tagged=false" >> "$GITHUB_ENV"
          else
            echo "tagged=true" >> "$GITHUB_ENV"
            echo "version=$next" >> "$GITHUB_ENV"
            echo "package.json's version is already tagged: computing $next from the newest tag ($latest)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tag the validated commit and push it
        if: env.tagged == 'true'
        run: |
          set -euo pipefail
          # An annotated tag needs a committer identity, which the runner does
          # not carry: without one the tag fails with empty ident name.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sha="$(git rev-parse HEAD)"
          git tag "$version" "$sha" --message "qare $version"
          git push origin "refs/tags/$version"
      - name: Start the release on the tag
        if: env.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          export version sha
          gh workflow run release.yml --ref "$version"
          # The dispatch is asynchronous: a release run for the tag must
          # actually appear, or this job fails, so a release that never
          # started is a visible red on main rather than a quiet one.
          for _ in $(seq 1 30); do
            started="$(gh run list --workflow=release.yml --limit 20 --json headBranch,headSha \
              --jq '.[] | select(.headBranch == env.version) or select(.headSha == env.sha)')"
            if [ -n "$started" ]; then
              echo "release workflow run started for the tag $version" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "no release workflow run appeared for the tag $version" >&2
          exit 1
