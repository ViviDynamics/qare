name: Auto-tag

# The release tag, created by the build that earns it (#188): once CI has
# passed on a push to main, the version package.json carries is tagged on the
# commit that was validated, and the release workflow is dispatched on that
# tag, so the images publish without a human step. The org precedent is nare's
# release workflow, which tags from a workflow_run of CI for the same reason:
# an event a workflow triggers with the workflow's own token creates no
# workflow runs, so the release is started explicitly rather than left to the
# tag push.
#
# A green merge to main tags and releases. When package.json's version is
# already tagged, the automation computes the next CalVer from the newest
# tag and the build's month: the patch climbs while the month does not, and
# a new month starts a new line.
#
# Three honest limits. GitHub Actions keeps one running and one pending run
# per concurrency group, so a burst of green builds can supersede a queued
# run, and a superseded merge ships in the release that follows it rather
# than in a tag of its own. The release workflow serializes behind the same
# rule, so a pending release can be superseded by a newer one and its tag
# ships nothing until a rerun re-dispatches it. And a computed tag cannot
# stamp the pipeline's qare-ref default, because the automation never pushes
# commits, so a caller pinning a computed tag names its qare-ref explicitly
# to avoid running one release behind.
#
# The release runs exactly once per commit, and a failed dispatch is
# recoverable: when the validated commit already carries a release tag and a
# release run for it exists, the run is a no-op, and when the tag exists but
# its release run never started, the release is re-dispatched. Tags that are
# not releases do not count in either direction: they trigger no release and
# suppress none.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag the release version
    # workflow_run fires for pull requests and failures too: the job accepts
    # nothing but a successful push to this repository's main.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      # contents: write pushes the tag; actions: write dispatches the release.
      # The workflow's own token is the only credential: no secret is stored.
      contents: write
      actions: write
    steps:
      # The commit CI validated, with full history: with a shallow clone,
      # GitHub has intermittently treated the tag's commit objects as new and
      # rejected the push from a workflow token (steward's create-tag job
      # documents the same lesson).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Read the version package.json carries
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Decide the version to tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every tag ls-remote lists names its object sha first, and an
          # annotated tag's peeled line carries the commit sha, so one of
          # them naming the validated commit ends the run here, before
          # anything is computed. Only release tags count: the release
          # workflow's trigger and its own CalVer check accept nothing else,
          # so an unrelated tag on the commit must not suppress a release
          # either. The peeled commit sha is what ancestry is checked
          # against, and an annotated tag's ^{} line carries it, which the
          # awk's last-line-wins keeps.
          head="$(git rev-parse HEAD)"
          # Nothing local needs updating: the walk reads ls-remote against
          # origin and ancestry against this full checkout, and a quiet
          # fetch whose tags git refuses to update exits 1 printing nothing,
          # which would end the whole workflow without a word of why.
          latest=""
          tagged_at=""
          while IFS=$'\t' read -r name sha; do
            if [ "$sha" = "$head" ]; then
              tagged_at="$name"
            elif git merge-base --is-ancestor "$sha" HEAD; then
              latest="$name"
            fi
          done < <(git ls-remote --tags origin 'refs/tags/*.*.*' | grep -E 'refs/tags/20[0-9]{2}\.[0-9]+\.[0-9]+(\^\{\})?$' | awk '{ref=$2; sub(/\^\{\}$/, "", ref); sub(/^refs\/tags\//, "", ref); shas[ref]=$1} END{for (r in shas) print r "\t" shas[r]}' | sort -V)
          if [ -n "$tagged_at" ]; then
            # A rerun of this job, or a tag a person pushed first, must not
            # release the same commit twice: a release run for the tag ends
            # the run here. But a tag created by a run whose dispatch failed
            # must not leave the commit tagged and unreleased, so the
            # release is re-dispatched when no run for the tag exists.
            export T="$tagged_at" S="$head"
            # The lookup filters server side: a limit applied before the
            # filter would hide the run behind newer releases and dispatch
            # the tag again on a rerun of an older commit. A run that
            # concurrency replaced, recorded cancelled, or superseded, never
            # started building, so it does not count as started.
            started="$(gh run list --workflow=release.yml --branch "$tagged_at" --limit 1 --json conclusion \
              --jq 'any(.[]; .conclusion != "superseded" and .conclusion != "cancelled")')"
            if [ "$started" = "false" ]; then
              started="$(gh run list --workflow=release.yml --commit "$head" --limit 1 --json conclusion \
                --jq 'any(.[]; .conclusion != "superseded" and .conclusion != "cancelled")')"
            fi
            if [ "$started" != "true" ]; then
              echo "version=$tagged_at" >> "$GITHUB_ENV"
              echo "tag_exists=true" >> "$GITHUB_ENV"
              echo "tagged=true" >> "$GITHUB_ENV"
              echo "the validated commit is already tagged $tagged_at and no release run exists for it: re-dispatching the release" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "the validated commit is already tagged: nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "tagged=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/$version")" ]; then
            echo "tagged=true" >> "$GITHUB_ENV"
            echo "the version package.json carries ($version) is untagged: tagging it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The packaged version is already released: a merge that did not bump
          # it still releases. A bump that names a version a computed release
          # already consumed lands here too, and ships under the next version,
          # which the summary says. The next CalVer comes from the newest
          # release on the default branch (computed with the tagged-commit
          # check above) and the build's month: the patch climbs while the
          # month does not, and a new month starts a new line. release.yml
          # releases tags whose commits are on the default branch only, so
          # the newest release is drawn from exactly those tags: a stray
          # CalVer tag on a pull-request commit sorts ahead of the real
          # releases and would reset or claim the line without counting.
          line="$(date -u +%Y.%-m)"
          case "$latest" in
            "$line".*) patch="$((10#${latest#"$line."} + 1))" ;;
            *) patch=0 ;;
          esac
          # A computed name origin already carries cannot be pushed: climb
          # the patch until the name is free, so a stray tag on a
          # pull-request commit cannot consume the computed name either.
          while [ -n "$(git ls-remote --tags origin "refs/tags/$line.$patch")" ]; do
            patch=$((patch + 1))
          done
          next="$line.$patch"
          echo "tagged=true" >> "$GITHUB_ENV"
          echo "version=$next" >> "$GITHUB_ENV"
          echo "package.json's version is already tagged: computing $next (newest release on main: ${latest:-none})" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag the validated commit and push it
        if: env.tagged == 'true' && env.tag_exists != 'true'
        run: |
          set -euo pipefail
          # An annotated tag needs a committer identity, which the runner does
          # not carry: without one the tag fails with empty ident name.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sha="$(git rev-parse HEAD)"
          git tag "$version" "$sha" --message "qare $version"
          git push origin "refs/tags/$version"
      - name: Start the release on the tag
        if: env.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          export version sha
          gh workflow run release.yml --ref "$version"
          # The dispatch is asynchronous: a release run for the tag must
          # actually appear, or this job fails, so a release that never
          # started is a visible red on main rather than a quiet one.
          for _ in $(seq 1 30); do
            started="$(gh run list --workflow=release.yml --limit 20 --json headBranch,headSha \
              --jq '.[] | select(.headBranch == env.version) or select(.headSha == env.sha)')"
            if [ -n "$started" ]; then
              echo "release workflow run started for the tag $version" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "no release workflow run appeared for the tag $version" >&2
          exit 1
