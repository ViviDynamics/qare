name: CI

# Pushes are filtered to main, so pushes to the orphan qa-assets branch (the
# screenshot store of ADR-0002) never run this workflow, and the branch's
# append-only history stays quiet.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: workspace types (@qare/core etc.) resolve to dist/, so a
      # fresh checkout cannot typecheck or test until packages are built
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
