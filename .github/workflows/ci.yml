name: CI

# Pushes are filtered to main, so pushes to the orphan qa-assets branch (the
# screenshot store of ADR-0002) never run this workflow, and the branch's
# append-only history stays quiet.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: workspace types (@qare/core etc.) resolve to dist/, so a
      # fresh checkout cannot typecheck or test until packages are built
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # A real compose boot (#209): qare's own profile names a running target, so
  # its own QARE pipeline never boots anything. This job does: it runs the
  # pipeline's execute steps, read out of pipeline.yml as the scripts they
  # are, against examples/compose-app, a profile whose app is built and
  # booted with compose. The run happens in the core image built from this
  # tree, with the runner's docker handed to it exactly as a caller's
  # pipeline hands it. The checkout is two commits deep, like execute's, so
  # the base side has a commit to boot, and it leaves no token behind, since
  # the workspace is handed to a container that runs the tree's code.
  compose-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The step reader parses the workflow with the workspace's yaml.
      - run: pnpm install --frozen-lockfile
      - name: Build the core image
        run: docker build -f images/core/Dockerfile -t qare-core:ci .
      - name: Boot the example compose app through the pipeline's execute steps
        run: scripts/compose-boot.sh qare-core:ci
      - name: Upload the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-boot-evidence
          path: evidence/
          if-no-files-found: ignore

  # A real mail catcher (#65): the pipeline's execute steps run against
  # examples/mail-app, whose stack carries an app that sends over SMTP and a
  # Mailpit that receives it. The job fails unless a mail check read the
  # message from the catcher, a later check followed the link in it, the
  # evidence was swept, and the run deleted what it was sent. It then runs
  # two waits at once on one catcher and holds them to no crosstalk. Same
  # checkout as compose-boot, for the same reasons. The workspace is built
  # because the second part runs qare's mail adapter from it.
  mail-sink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the core image
        run: docker build -f images/core/Dockerfile -t qare-core:ci .
      - name: Prove mail checks against a real mail catcher
        run: scripts/mail-sink.sh qare-core:ci
      - name: Upload the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-sink-evidence
          path: evidence/
          if-no-files-found: ignore

  # The image family (#88): CI builds the flavours it can, holds the core
  # image to its size budget, and checks that a derived image reinstalls
  # nothing the base already ships. Publication is the release workflow's
  # job: CI builds and measures, it does not push.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        # The core image: the workspace builds inside it, so the build needs
        # the whole tree, not a workspace already built on the runner.
      - name: Build the core image
        run: docker build -f images/core/Dockerfile -t qare-core:ci .
      - name: Hold the core image to its size budget
        run: |
          set -euo pipefail
          budget="$(cat images/core/size-budget)"
          size="$(docker image inspect -f '{{.Size}}' qare-core:ci)"
          if [ "$size" -gt "$budget" ]; then
            echo "the core image is $size bytes, over its budget of $budget (images/core/size-budget): the base image is the smallest thing that runs qare, so a change that grows it past the budget must shrink it again or argue a new budget in the PR (#88)" >&2
            exit 1
          fi
          echo "core image $size bytes, under budget $budget" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the web flavour from it
        run: docker build -f images/web/Dockerfile --build-arg QARE_IMAGE=qare-core:ci -t qare-web:ci .
      - name: Build the android flavour from it
        run: docker build -f images/android/Dockerfile --build-arg QARE_IMAGE=qare-core:ci -t qare-android:ci .
      - name: Build the desktop-linux flavour from it
        run: docker build -f images/desktop-linux/Dockerfile --build-arg QARE_IMAGE=qare-core:ci -t qare-desktop-linux:ci .
      - name: Check the derived images reinstall nothing
        run: sh images/check-derived.sh qare-core:ci qare-web:ci qare-android:ci qare-desktop-linux:ci
