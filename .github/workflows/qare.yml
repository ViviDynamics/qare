name: QARE

# Four-job qare pipeline: collect -> plan -> execute -> judge (+ requeue on
# push), with artifact handoff.
#
# Secret-hygiene map (constitution rule 7: secrets never share a machine with
# pull request code):
#   - collect: holds the GitHub token only    (reads the linked issue; no model key)
#   - plan:    holds the model key only       (QARE_PLANNER_KEY)
#   - execute: holds no secrets at all        (stub containers only)
#   - judge:   holds the model key + GitHub token only, in separate steps
#     (QARE_PLANNER_KEY for the verifier, which reads evidence but runs
#     nothing; GITHUB_TOKEN for the steps that write to GitHub)
#   - requeue: holds the GitHub token only    (posts /qa on refused PRs)
# No secret values are written here; only names, resolved at runtime.
#
# What runs what: collect, plan and judge hold secrets, so they build and run
# qare from the base commit, a revision the pull request cannot change, and
# no secret-holding job installs or runs the pull request's tree. The pull
# request contributes data only: its body, the linked issues, the diff, its
# .qa/ profile read as YAML, and the artifacts execute uploaded. execute runs
# the pull request's own qare, and holds no secrets.
#
# Criteria come from the issue the pull request promises to close (#98). A
# change that promises none, or closes only issues that state none, has
# nothing to check: collect says so, every later job skips, and the pipeline
# stays green. A red pipeline on every chore would hide the failure that
# matters.
#
# collect reads the issue so the model-key job never needs a GitHub token,
# which keeps the secret-hygiene map above true rather than approximately true.
#
# Fork pull requests get no secrets, so the model-key jobs are guarded on the
# head repository being this one; they skip rather than failing on a fork.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ['.qa/**']

permissions:
  contents: read

concurrency:
  group: qare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # label: collect (GitHub token only)
  collect:
    name: collect (GitHub token only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    outputs:
      criteria: ${{ steps.inputs.outputs.criteria }}
    steps:
      # The base commit: this job holds the GitHub token, so the qare it
      # installs and runs is a revision the pull request cannot change.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Say why a fork gets no QA
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "this pull request comes from a fork, which gets no model key, so qare cannot plan or check it here" >> "$GITHUB_STEP_SUMMARY"
      - name: Read the linked issue and the diff
        id: inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY:-}" > pr-body.md
          node packages/cli/dist/index.js linked-issues --body pr-body.md > linked.txt
          if [ ! -s linked.txt ]; then
            echo "this change promises to close no issue, so it states no acceptance criteria and there is nothing to check" >> "$GITHUB_STEP_SUMMARY"
            echo "criteria=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issues=()
          while read -r number; do
            gh issue view "$number" --json body --jq .body > "issue-${number}.md"
            issues+=("issue-${number}.md")
          done < linked.txt
          # Read here, without a model: an issue that states no criteria (a bug
          # report closed by a one-line fix) has nothing to check, the same
          # neutral outcome as closing no issue at all.
          node packages/cli/dist/index.js issue-criteria --out criteria.json "${issues[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -f criteria.json ]; then
            echo "criteria=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The head is fetched as an object, not checked out: the base
          # revision's qare produces the diff, and the pull request's tree is
          # never installed or run in this job.
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git diff "${BASE_SHA}...${HEAD_SHA}" > change.diff
          echo "criteria=present" >> "$GITHUB_OUTPUT"
          {
            echo "criteria read from: $(tr '\n' ' ' < linked.txt)"
            echo "diff bytes: $(wc -c < change.diff)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the QA inputs
        if: steps.inputs.outputs.criteria == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: qa-inputs
          path: |
            criteria.json
            change.diff
          if-no-files-found: error

  # label: plan (model key only)
  plan:
    name: plan (model key only)
    needs: collect
    runs-on: ubuntu-latest
    # A fork pull request gets no secrets, so this would fail for a reason that
    # has nothing to do with the change. It skips instead.
    if: >-
      needs.collect.outputs.criteria == 'present' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The base revision's qare: the pull request contributes data only, and
      # this job holds the model key.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the pinned nare
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user "$NARE_WHEEL"
          "$HOME/.local/bin/nare" --version
        env:
          NARE_WHEEL: https://github.com/ViviDynamics/nare/releases/download/2026.9.10/nare-2026.9.10-py3-none-any.whl
      - name: Download the QA inputs
        uses: actions/download-artifact@v4
        with:
          name: qa-inputs
          path: .
      - name: Plan the QA run
        shell: bash
        env:
          # nare's openai rail: the planner key is scoped to a model that
          # answers inside the proxy's edge timeout (see nare#27).
          OPENAI_API_KEY: ${{ secrets.QARE_PLANNER_KEY }}
          NARE_PROVIDER: openai
          NARE_BASE_URL: https://llm.vividynamics.com/v1
          NARE_MODEL: claude-haiku
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js plan \
            --criteria criteria.json --diff change.diff --out plan.json \
            --nare "$HOME/.local/bin/nare"
      - name: Upload plan.json
        uses: actions/upload-artifact@v4
        with:
          name: plan.json
          path: plan.json
          if-no-files-found: error

  # label: execute (no secrets)
  execute:
    name: execute (no secrets)
    needs: [collect, plan]
    if: needs.collect.outputs.criteria == 'present' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      # Where the evidence was uploaded, the one place the posted comment may
      # link to (CONSTITUTION rule 4). Empty when nothing was uploaded.
      evidence-url: ${{ steps.evidence.outputs.artifact-url }}
    steps:
      # actions/checkout checks out the PR merge ref on pull_request events
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Flow checks need a browser (#121). The version tracks playwright-core
      # in packages/core/package.json: the runner drives that chromium.
      - name: Install the flow browser
        run: npx --yes playwright@1.63.0 install --with-deps chromium
      - name: Download plan.json
        uses: actions/download-artifact@v4
        with:
          name: plan.json
          path: .
      - name: Run the plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # The run's own facts come from here rather than from the plan: a
          # plan is the same wherever it runs (#105).
          code=0
          node packages/cli/dist/index.js run --plan plan.json \
            --id "pr-${PR_NUMBER}" \
            --repo "$PWD" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --profile .qa \
            --evidence evidence || code=$?
          # 3 is refused: this repository has no .qa profile or no stubs, so
          # qare will not pretend to have checked it. That is an outcome about
          # the repository rather than a fault in the change, judge still
          # reports it, and stub issues are filed. Anything else is a failure.
          if [ "$code" -eq 3 ]; then
            # A refusal writes result.json like any other run; without it,
            # exit 3 means something else went wrong and judge has nothing.
            if [ ! -f evidence/result.json ]; then
              echo "exit 3 but no evidence/result.json: not a refusal qare recorded" >&2
              exit 1
            fi
            echo "qare refused this run (no profile or stubs yet); judge will report it and file stub issues" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      # Evidence is published, so it is redacted before it leaves this
      # machine, and a redaction that fails uploads nothing (#52). The run
      # already redacts what it writes; this also covers files a crashed run
      # left behind and anything else that landed in the directory.
      - name: Redact the evidence
        id: redact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d evidence ]; then
            echo "no evidence directory: nothing to redact or upload"
            exit 0
          fi
          node packages/cli/dist/index.js redact --evidence evidence --profile .qa
      - name: Upload evidence (raw results + result.json)
        id: evidence
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: execute-evidence
          path: evidence/
          if-no-files-found: ignore
      # The profile is pull-request data (rule 7): execute reads it as YAML,
      # and judge reads it from this artifact rather than from a checkout of
      # the pull request's tree. A run refused for want of a profile has none
      # to upload, and judge skips the verifier for it anyway.
      - name: Upload the profile the run used
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-profile
          path: .qa
          if-no-files-found: ignore

  # label: judge (model key + GitHub token only)
  judge:
    name: judge (model key + GitHub token only)
    # collect and plan for the diff and the criteria text the verifier reads;
    # execute for the evidence it checks them against.
    needs: [collect, plan, execute]
    if: always() && needs.execute.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write
      pull-requests: write
    steps:
      # No token left in .git/config: the verifier step holds the model key
      # and reads files, and must not find a token that can write a check run.
      # The base commit again: judge holds secrets, so it never installs or
      # runs the pull request's tree.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Download the QA inputs
        uses: actions/download-artifact@v4
        with:
          name: qa-inputs
          path: .
      - name: Download plan.json
        uses: actions/download-artifact@v4
        with:
          name: plan.json
          path: .
      # Evidence gets a directory of its own: it is the verifier's file root,
      # so its read tool reaches the evidence and nothing else.
      - name: Download execute evidence
        uses: actions/download-artifact@v4
        with:
          name: execute-evidence
          path: evidence
      # The profile arrives as an artifact: it is pull-request data, and this
      # job must not check out the pull request tree. Only a run that actually
      # executed has one; a refused run skipped the verifier.
      - name: Download the profile the run used
        if: steps.executed.outputs.verdict != 'refused'
        uses: actions/download-artifact@v4
        with:
          name: qa-profile
          path: profile
      # A refused run executed nothing, so judge will not call the verifier,
      # and a failed install must not stop its stub issues being filed.
      - name: Read the executed verdict
        id: executed
        shell: bash
        run: echo "verdict=$(jq -r '.verdict' evidence/result.json)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned nare
        if: steps.executed.outputs.verdict != 'refused'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user "$NARE_WHEEL"
          "$HOME/.local/bin/nare" --version
        env:
          # The same pin as the plan job; a test holds the two together.
          NARE_WHEEL: https://github.com/ViviDynamics/nare/releases/download/2026.9.10/nare-2026.9.10-py3-none-any.whl
      - name: Judge the result
        shell: bash
        env:
          # The planner's key and model: the verifier's prompt is planning
          # size, and the model QARE_MODEL_KEY is scoped to does not answer
          # one inside the proxy's edge timeout (nare#27).
          OPENAI_API_KEY: ${{ secrets.QARE_PLANNER_KEY }}
          NARE_PROVIDER: openai
          NARE_BASE_URL: https://llm.vividynamics.com/v1
          NARE_MODEL: claude-haiku
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js judge \
            --result evidence/result.json --outDir . \
            --plan plan.json --diff change.diff \
            --nare "$HOME/.local/bin/nare" --profile profile
      - name: File stub issues (refused runs only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f judged-result.json ]; then
            echo "judged-result.json missing: judge did not produce an artifact, no stub issues to file"
          elif jq -e '.verdict == "refused"' judged-result.json > /dev/null; then
            node packages/action/dist/index.js stub-issues --result judged-result.json --pr "${{ github.event.pull_request.number }}"
          else
            echo "verdict $(jq -r '.verdict' judged-result.json): not refused, no stub issues to file"
          fi
      # One sticky comment, updated on every run, and a check run on the head
      # commit. The comment names evidence files and links only to the
      # uploaded artifact. Last, so a posting failure cannot stop stub issues.
      - name: Post the evidence on the pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_URL: ${{ needs.execute.outputs.evidence-url }}
        run: |
          set -euo pipefail
          node packages/action/dist/index.js post-evidence --result judged-result.json \
            --pr "$PR_NUMBER" --sha "$HEAD_SHA" --artifact-url "$EVIDENCE_URL"
      - name: Upload judge artifacts (comment.md, checkrun.json, judged-result.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-artifacts
          path: |
            comment.md
            checkrun.json
            judged-result.json
          if-no-files-found: ignore

  # label: requeue (GitHub token only)
  requeue:
    name: requeue (GitHub token only)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Re-queue refused PRs unblocked by the merged stubs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git hash-object -t tree /dev/null)"
            echo "first push to main: diffing from the empty tree"
          fi
          node packages/action/dist/index.js requeue --keys-from-diff "$before...${{ github.sha }}"
