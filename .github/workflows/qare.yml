name: QARE

# qare checks its own pull requests with the pipeline it ships (#145): this
# workflow is a caller of the reusable pipeline in pipeline.yml, the same way
# any repository calls it, and holds only what a caller holds: the triggers,
# the concurrency group, the permission ceiling, the profile's model, and the
# model key and the GitHub identity (#61) passed by name. The jobs, and the secret-hygiene map that says
# which of them holds what (constitution rule 7), live in pipeline.yml.
#
# Two things differ from a repository that calls a release. The pipeline is
# this tree's own file, so a change to it is checked by its own pull request.
# And the qare the token-holding jobs run is the base commit, a revision the
# pull request cannot change, where another repository pins a release; on a
# push it is the pushed revision.
#
# qare is a public repository, so its jobs run on GitHub-hosted runners: the
# pipeline's default, which this caller never overrides.
#
# Pushes are filtered to main, so the qa-assets pushes the judge step makes
# (ADR-0002) never re-trigger this pipeline, which is what keeps those pushes
# from being pull request completions.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ['.qa/**']

permissions:
  contents: read

concurrency:
  group: qare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qare:
    # The ceiling for the called jobs, each of which declares only what it
    # needs: judge writes the qa-assets branch, the check run and the comment,
    # report reads the run's jobs, and execute holds contents: read alone.
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pipeline.yml
    with:
      qare-ref: ${{ github.event.pull_request.base.sha || github.sha }}
      nare-base-url: https://llm.vividynamics.com/v1
      nare-model: claude-haiku
      # The planner's prompt travels as one argument (nare#29): its copy of
      # the diff keeps the change's source and spec and leaves these out.
      planner-diff-exclude: packages/*/test/* .agents .claude
    secrets:
      model-key: ${{ secrets.QARE_PLANNER_KEY }}
      # Who qare posts as (#61): the App once #155 has stored its id and key,
      # else a personal access token, else the workflow run. A secret that is
      # not set is empty, so this caller is the same before and after.
      app-id: ${{ secrets.QARE_APP_ID }}
      app-private-key: ${{ secrets.QARE_APP_PRIVATE_KEY }}
      personal-access-token: ${{ secrets.QARE_GITHUB_TOKEN }}
