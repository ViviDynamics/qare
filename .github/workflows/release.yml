name: Release

on:
  push:
    tags:
      - '*.*.*'
  # The auto-tag workflow dispatches the release on the tag it created (#188):
  # an event a workflow triggers with the workflow's own token creates no
  # workflow runs, so the release is started explicitly for the automated
  # path, while a tag a person pushes still arrives through the trigger above.
  workflow_dispatch:

# Read by default (#310): a job holds a write permission only where it
# writes. images pushes packages, release creates the GitHub release, and the
# two guards between them only read.
permissions:
  contents: read

concurrency:
  # A global group orders releases through completion: the image steps push
  # version tags before the final image step updates shared aliases (latest and
  # the month line), and per-ref groups would let
  # two close releases build concurrently and let the older one finish last,
  # rolling the aliases backward. One running and one pending run survive,
  # so a burst supersedes a pending release; rerunning the release's
  # auto-tag run re-dispatches it.
  group: release
  cancel-in-progress: false

jobs:
  # The image family's publication (#88): a release tag is what the registry
  # sees. The core image builds first; web, android and desktop-linux build
  # FROM it. Each is published under the version tag, for amd64 and arm64
  # where supported. The final image step checks default-branch ancestry and
  # version order before updating latest and the month line. The pipeline
  # pulls version tags, so a missing release image fails by name.
  images:
    name: images (the family)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # No token is left in .git/config: nothing in this job pushes with git,
      # and the tags are read from a public remote.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag that is not on the default branch
        run: |
          set -euo pipefail
          # A release publishes from the default branch's history (#188): a
          # tag a human pushed from a pull request head dangles after the
          # squash merge and would publish images from a commit main never
          # carried. The ancestor check turns that into a refusal naming the
          # flow that tags the commit CI validated instead (#194).
          if ! git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"; then
            echo "tag '$GITHUB_REF_NAME' points at a commit that is not on ${{ github.event.repository.default_branch }}: merge the change first, and the auto-tag workflow tags the commit CI validated (#188)" >&2
            exit 1
          fi
      - name: Validate the tag is CalVer (YYYY.M.PATCH)
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$GITHUB_REF_NAME' is not CalVer YYYY.M.PATCH (e.g. 2026.9.0)" >&2
            exit 1
          fi
          # The line tag the contract documents: the release without its patch.
          echo "CALVER_LINE=$(cut -d. -f1,2 <<< "$GITHUB_REF_NAME")" >> "$GITHUB_ENV"
      - name: Stamp the version from the tag
        run: node scripts/sync-version.mjs "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the core image
        id: core
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vividynamics/qare-core:${{ github.ref_name }}
      - name: Build and push the web flavour from it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            QARE_IMAGE=ghcr.io/vividynamics/qare-core@${{ steps.core.outputs.digest }}
          tags: |
            ghcr.io/vividynamics/qare-web:${{ github.ref_name }}
      - name: Build and push the android flavour from it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/android/Dockerfile
          # The emulator's system image is an x86_64 build, so the android
          # flavour publishes for amd64 only (#89).
          platforms: linux/amd64
          push: true
          build-args: |
            QARE_IMAGE=ghcr.io/vividynamics/qare-core@${{ steps.core.outputs.digest }}
          tags: |
            ghcr.io/vividynamics/qare-android:${{ github.ref_name }}
      - name: Build and push the desktop-linux flavour from it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: images/desktop-linux/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            QARE_IMAGE=ghcr.io/vividynamics/qare-core@${{ steps.core.outputs.digest }}
          tags: |
            ghcr.io/vividynamics/qare-desktop-linux:${{ github.ref_name }}
      - name: Promote the shared aliases
        run: |
          set -euo pipefail
          # The builds push the version tag only: latest and the month line
          # are shared, and the concurrency group orders by dispatch time, so
          # a recovery rerun of an older release builds last and must not
          # finish by rolling the aliases back to it. latest follows the
          # newest release on the default branch, and the month line follows
          # the newest release on its own line: a recovered September release
          # still publishes 2026.9 after October's release exists. The
          # promotion copies the built manifest without rebuilding it.
          # Nothing local needs updating: the walk reads ls-remote against
          # origin and ancestry against the full checkout. A quiet fetch of
          # the tags whose updates git rejects would exit 1 printing nothing,
          # so the release would fail without a word of why.
          newest=""
          newest_on_line=""
          while IFS=$'\t' read -r name sha; do
            if git merge-base --is-ancestor "$sha" "origin/${{ github.event.repository.default_branch }}"; then
              newest="$name"
              case "$name" in
                "$CALVER_LINE".*) newest_on_line="$name" ;;
              esac
            fi
          done < <(git ls-remote --tags origin 'refs/tags/*.*.*' | grep -E 'refs/tags/20[0-9]{2}\.[0-9]+\.[0-9]+(\^\{\})?$' | awk '{ref=$2; sub(/\^\{\}$/, "", ref); sub(/^refs\/tags\//, "", ref); shas[ref]=$1} END{for (r in shas) print r "\t" shas[r]}' | sort -V)
          promote_latest=false
          promote_line=false
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then
            promote_latest=true
          fi
          if [ "$GITHUB_REF_NAME" = "$newest_on_line" ]; then
            promote_line=true
          fi
          if [ "$promote_latest" = "false" ] && [ "$promote_line" = "false" ]; then
            echo "the newest release is $newest: leaving the shared aliases there" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for image in qare-core qare-web qare-android qare-desktop-linux; do
            args=()
            if [ "$promote_line" = "true" ]; then
              args+=(--tag "ghcr.io/vividynamics/$image:$CALVER_LINE")
            fi
            if [ "$promote_latest" = "true" ]; then
              args+=(--tag "ghcr.io/vividynamics/$image:latest")
            fi
            docker buildx imagetools create "${args[@]}" "ghcr.io/vividynamics/$image:$GITHUB_REF_NAME"
          done
          echo "promoted the aliases earned by $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  # The android flavour's release guard (#89): the published image's preboot
  # check must pass on a hosted runner that has hardware virtualisation, and
  # the same image must refuse before booting on a host that does not, naming
  # the requirement it misses. Publication is from the images job; this runs
  # what the images job published.
  android-check:
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: The check passes on a runner with hardware virtualisation
        run: |
          docker run --rm --device /dev/kvm --user 0 \
            "ghcr.io/vividynamics/qare-android:${{ github.ref_name }}" \
            /opt/qare/drivers/android/check
      - name: The same image refuses without virtualisation, naming the requirement
        run: |
          set -euo pipefail
          if output="$(docker run --rm \
            "ghcr.io/vividynamics/qare-android:${{ github.ref_name }}" \
            /opt/qare/drivers/android/check 2>&1)"; then
            echo "the check passed without --device /dev/kvm; it must refuse before booting" >&2
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q /dev/kvm; then
            echo "the refusal must name /dev/kvm, the requirement it misses" >&2
            exit 1
          fi

  release:
    needs: [derived-image, android-check]
    runs-on: ubuntu-latest
    # The one job that writes the repository: it creates the GitHub release,
    # through the API with the token its last step is handed. It restores no
    # dependency cache, and its checkout leaves no token behind.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate the tag is CalVer (YYYY.M.PATCH)
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$GITHUB_REF_NAME' is not CalVer YYYY.M.PATCH (e.g. 2026.9.0)" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # pnpm as package.json names it (#310): corepack, which ships with node,
      # reads `packageManager`, which carries the version and the hash the
      # download is checked against. No action installs it. The version that
      # resolved is then held to the one named, so a runner that answers with
      # another pnpm stops here.
      - name: Enable the pnpm package.json names
        shell: bash
        run: |
          set -euo pipefail
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/qare-corepack.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          wanted="$(jq -r '.packageManager // empty' package.json)"
          wanted="${wanted%%+*}"
          found="pnpm@$(pnpm --version)"
          if [ "$found" != "$wanted" ]; then
            echo "::error::corepack resolved $found, and package.json names ${wanted:-no package manager}"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version from the tag
        run: node scripts/sync-version.mjs "$GITHUB_REF_NAME"
      - run: pnpm build
      - name: Verify the CLI --version matches the tag
        run: |
          version="$(node packages/cli/dist/index.js --version)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "cli --version printed '$version', expected '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The image extension contract's release guard (docs/images.md): the worked
  # example derived image builds and runs on every release, so a release cannot
  # break derived images silently. The base is the published core image for
  # the release (#88, built by the images job before this one); the
  # contract-conformant fixture in the example's test directory is the
  # fallback, stamped with the release version, for the first release whose
  # images job has not published yet or a registry that is unreachable.
  derived-image:
    name: derived-image contract guard
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Stamp the fixture base with the release version
        run: echo "$GITHUB_REF_NAME" > examples/derived-image/test/VERSION
      - name: Build the contract-conformant base fixture
        run: |
          docker build -f examples/derived-image/test/base-fixture.Dockerfile \
            -t qare-contract-base:"$GITHUB_REF_NAME" examples/derived-image/test
      - name: Build the worked example against it
        run: |
          docker build --build-arg QARE_IMAGE=qare-contract-base:"$GITHUB_REF_NAME" \
            -t qare-derived:"$GITHUB_REF_NAME" examples/derived-image
      - name: Run the contract smoke check as the qare user
        run: |
          set -euo pipefail
          version="$(docker run --rm qare-derived:"$GITHUB_REF_NAME" qare --version)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "the entry point printed '$version', expected '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          docker run --rm qare-derived:"$GITHUB_REF_NAME" /opt/qare/drivers/scale-driver/probe
          docker run --rm qare-derived:"$GITHUB_REF_NAME" /opt/qare/tools/measure
          user="$(docker run --rm qare-derived:"$GITHUB_REF_NAME" id -un)"
          uid="$(docker run --rm qare-derived:"$GITHUB_REF_NAME" id -u)"
          gid="$(docker run --rm qare-derived:"$GITHUB_REF_NAME" id -g)"
          if [[ "$user" != qare || "$uid" != 1000 || "$gid" != 1000 ]]; then
            echo "the container runs as '$user' (uid $uid, gid $gid), expected qare with uid and gid 1000" >&2
            exit 1
          fi
      - name: Build the example against the published base when it exists
        run: |
          if docker pull ghcr.io/vividynamics/qare-core:"$GITHUB_REF_NAME" 2>pull.log; then
            docker build --build-arg QARE_IMAGE=ghcr.io/vividynamics/qare-core:"$GITHUB_REF_NAME" \
              -t qare-derived-published:"$GITHUB_REF_NAME" examples/derived-image
            version="$(docker run --rm qare-derived-published:"$GITHUB_REF_NAME" qare --version)"
            if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
              echo "the entry point printed '$version', expected '$GITHUB_REF_NAME'" >&2
              exit 1
            fi
            docker run --rm qare-derived-published:"$GITHUB_REF_NAME" /opt/qare/drivers/scale-driver/probe
            docker run --rm qare-derived-published:"$GITHUB_REF_NAME" /opt/qare/tools/measure
            user="$(docker run --rm qare-derived-published:"$GITHUB_REF_NAME" id -un)"
            uid="$(docker run --rm qare-derived-published:"$GITHUB_REF_NAME" id -u)"
            gid="$(docker run --rm qare-derived-published:"$GITHUB_REF_NAME" id -g)"
            if [[ "$user" != qare || "$uid" != 1000 || "$gid" != 1000 ]]; then
              echo "the container runs as '$user' (uid $uid, gid $gid), expected qare with uid and gid 1000" >&2
              exit 1
            fi
          elif grep -qE "manifest unknown|name unknown" pull.log; then
            echo "the published base for this release does not exist yet; only the fixture guard ran"
          else
            echo "the published base pull failed for a reason other than absence:" >&2
            cat pull.log >&2
            exit 1
          fi
