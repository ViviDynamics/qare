name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    needs: [derived-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the tag is CalVer (YYYY.M.PATCH)
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$GITHUB_REF_NAME' is not CalVer YYYY.M.PATCH (e.g. 2026.9.0)" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version from the tag
        run: node scripts/sync-version.mjs "$GITHUB_REF_NAME"
      - run: pnpm build
      - name: Verify the CLI --version matches the tag
        run: |
          version="$(node packages/cli/dist/index.js --version)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "cli --version printed '$version', expected '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The image extension contract's release guard (docs/images.md): the worked
  # example derived image builds and runs on every release, so a release cannot
  # break derived images silently. Until the layered image family (#88) starts
  # publishing the real base images, the base is the contract-conformant
  # fixture in the example's test directory, stamped with the release version;
  # the example builds against it through the same ARG the contract documents.
  derived-image:
    name: derived-image contract guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the fixture base with the release version
        run: echo "$GITHUB_REF_NAME" > examples/derived-image/test/VERSION
      - name: Build the contract-conformant base fixture
        run: |
          docker build -f examples/derived-image/test/base-fixture.Dockerfile \
            -t qare-contract-base:"$GITHUB_REF_NAME" examples/derived-image/test
      - name: Build the worked example against it
        run: |
          docker build --build-arg QARE_IMAGE=qare-contract-base:"$GITHUB_REF_NAME" \
            -t qare-derived:"$GITHUB_REF_NAME" examples/derived-image
      - name: Run the contract smoke check as the qare user
        run: |
          set -euo pipefail
          version="$(docker run --rm qare-derived:"$GITHUB_REF_NAME" qare --version)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "the entry point printed '$version', expected '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          docker run --rm qare-derived:"$GITHUB_REF_NAME" /opt/qare/drivers/scale-driver/probe
          docker run --rm qare-derived:"$GITHUB_REF_NAME" /opt/qare/tools/measure
          user="$(docker run --rm qare-derived:"$GITHUB_REF_NAME" id -un)"
          uid="$(docker run --rm qare-derived:"$GITHUB_REF_NAME" id -u)"
          gid="$(docker run --rm qare-derived:"$GITHUB_REF_NAME" id -g)"
          if [[ "$user" != qare || "$uid" != 1000 || "$gid" != 1000 ]]; then
            echo "the container runs as '$user' (uid $uid, gid $gid), expected qare with uid and gid 1000" >&2
            exit 1
          fi
      - name: Build the example against the published base when it exists
        run: |
          if docker pull ghcr.io/vividynamics/qare-core:"$GITHUB_REF_NAME" 2>pull.log; then
            docker build --build-arg QARE_IMAGE=ghcr.io/vividynamics/qare-core:"$GITHUB_REF_NAME" \
              -t qare-derived-published:"$GITHUB_REF_NAME" examples/derived-image
            version="$(docker run --rm qare-derived-published:"$GITHUB_REF_NAME" qare --version)"
            if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
              echo "the entry point printed '$version', expected '$GITHUB_REF_NAME'" >&2
              exit 1
            fi
            docker run --rm qare-derived-published:"$GITHUB_REF_NAME" /opt/qare/drivers/scale-driver/probe
            docker run --rm qare-derived-published:"$GITHUB_REF_NAME" /opt/qare/tools/measure
            user="$(docker run --rm qare-derived-published:"$GITHUB_REF_NAME" id -un)"
            uid="$(docker run --rm qare-derived-published:"$GITHUB_REF_NAME" id -u)"
            gid="$(docker run --rm qare-derived-published:"$GITHUB_REF_NAME" id -g)"
            if [[ "$user" != qare || "$uid" != 1000 || "$gid" != 1000 ]]; then
              echo "the container runs as '$user' (uid $uid, gid $gid), expected qare with uid and gid 1000" >&2
              exit 1
            fi
          elif grep -qE "manifest unknown|not found|not exist|name unknown" pull.log; then
            echo "the published base for this release does not exist yet; only the fixture guard ran"
          else
            echo "the published base pull failed for a reason other than absence:" >&2
            cat pull.log >&2
            exit 1
          fi
