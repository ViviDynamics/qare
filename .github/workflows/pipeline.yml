name: QARE pipeline

# The qare pipeline as a reusable workflow (#145): a repository calls it from
# a workflow of about ten lines, naming its profile path, its model and the
# secret that holds its model key, and pins a qare release tag in `uses:`.
# qare's own QARE workflow (qare.yml) is such a caller, so qare runs the
# pipeline it ships. docs/pipeline.md is the caller's guide.
#
# Five-job qare pipeline: collect -> plan -> execute -> judge -> publish (+ report when
# no verdict was published, + requeue on push), with artifact handoff.
#
# Secret-hygiene map (constitution rule 7: secrets never share a machine with
# pull request code):
#   - collect: holds the GitHub token only    (reads the linked issue; no model key)
#   - plan:    holds the model key only       (the model-key secret)
#   - execute: holds no secrets at all        (stub containers only)
#   - judge:   holds the model key only (reads evidence, executes no PR code)
#   - publish: holds a fresh GitHub identity token after judging (#306)
#   - report:  holds the GitHub identity only (says why no verdict was posted)
#   - advisory: holds the GitHub identity only (carries out a reply to an
#     advisory finding: /qa-dismiss records it, /qa-promote files an issue)
#   - requeue: holds the GitHub identity only (posts /qa on refused PRs)
#   - main_collect, main_execute, main_judge, main_publish: the main lane (#294), a run
#     against the default branch that a caller turns on. The same map:
#     main_collect holds the GitHub token only, main_execute holds no secrets
#     at all, main_judge holds the model key, and main_publish mints a fresh
#     identity after judging. They are at the end of this file, with their own notes.
#
# The advisory UX review (#150) adds no holder of the model key: it is the
# second thing `qare judge` asks the model, in the step that already holds
# the key, after the verdict is computed. Its findings never reach the
# verdict, and nothing it needs can fail a run.
# No secret values are written here; only names, resolved at runtime. The
# caller passes its model key and its identity by name, as the secrets this
# workflow declares, and never inherits its secrets into it: a called
# workflow sees only what it is handed.
#
# The GitHub identity (#61, ADR-0003) is who qare posts as, and it is the
# caller's choice, made by which secrets it passes: a GitHub App (app-id and
# app-private-key), else a personal access token (personal-access-token),
# else the Actions token of the run, which every job already has. qare picks
# in that order, so switching is a change of secrets and of nothing in this
# file. collect reads completed advisory records with a scoped read-only App
# token. Its mint step still receives the full private key; a PAT fallback
# retains the caller's PAT capabilities. plan and execute hold none of it: the identity exists
# where qare posts, never beside the planner and never where pull request
# code runs. The Actions token stays beside the identity because GitHub lets
# only an App write a check run, so a personal access token leaves that one
# write to it, and because a pinned qare older than the identity reads
# nothing else.
#
# The App's private key is the credential of the whole App, so it is used in
# one step of collect and each job that posts (#305): "Mint the App
# token for this job" runs scripts/mint-app-token.mjs of the pinned qare with
# node on the runner, before any dependency is installed, any artifact
# downloaded or any container run, and mints a token for the calling
# repository alone, with the permissions that job declares, that expires
# within the hour. The steps that post are handed that token and the App's
# slug. The key never enters a container and never shares a step with
# anything the run produced. A job tries to give its token back when it
# ends. The token cannot be renewed without the key, so the steps of a job
# that post must all run within an hour of its first step; one that runs
# later is told so by name and posts nothing.
#
# What this does not change: the key is still a secret of the job. GitHub
# hands a job's runner every secret the job's steps name, so the steps that
# run on the runner after the minting step (the build of the pinned qare in
# report, advisory and requeue, the step that enables pnpm with corepack, and
# the image pull in collect and publish) run on a machine that was given it,
# though never in their own environment. A container is not that machine. And "before anything else of the run" is a
# statement about one job: a runner that outlives its jobs keeps what
# earlier jobs left on it, which is what execute-runs-on is for.
#
# No job here restores a dependency cache (#305): the jobs that build qare
# from the pinned revision hold a token, and install by the lockfile from
# the registry, never from a cache another job could have written.
#
# Which qare runs: the revision `qare-ref` names. It defaults to the release
# this file ships in (a called workflow cannot learn its own ref, so the
# release is written here and stamped by scripts/sync-version.mjs), which is
# what lets a caller pin one tag and upgrade by changing it. qare's own
# caller passes the base commit instead, a revision the pull request cannot
# change.
#
# What runs what: plan, execute and judge run qare inside the published image
# family (#88), pulled for that revision's version so a run of the pipeline
# is a pull of the image, not a build of the tree. collect runs that image
# too (#381): it reads the version from a checkout of the pinned revision
# beside the caller's tree, which needs no build, and hands it on, so no
# image job reads a version from any tree. report and requeue hold the
# GitHub token only, and build and run qare from a checkout of that
# revision. No secret-holding job installs or runs the pull request's tree. The pull request contributes data only: its body, the linked
# issues, the diff, its profile read as YAML, and the artifacts execute
# uploaded. execute runs the flavour its profile targets (core by default,
# web for browser checks), and holds no secrets. Until a release publishes
# the images, the image pull fails with a message naming exactly that (#88):
# the pipeline stays red rather than quietly building qare from source,
# because a source build is the failure mode this family exists to remove.
#
# What the caller keeps: its triggers, its concurrency group, and the
# permission ceiling. A called job can hold no permission the calling job
# does not grant, so the caller grants the union (actions: read, checks:
# write, contents: write, issues: write, pull-requests: write) and each job
# below still declares only what it needs. Nothing of the caller's `env`
# arrives here; everything it chooses is an input.
#
# Nothing here is allowed to fail quietly: no step or job continues on
# error, so a failed plan can never read as a pass (rule 6).
#
# Criteria come from the issue the pull request promises to close (#98). A
# change that promises none, or closes only issues that state none, has
# nothing to check: collect says so, every later job skips, and the pipeline
# stays green. A red pipeline on every chore would hide the failure that
# matters.
#
# collect reads the issue so the model-key job never needs a GitHub token,
# which keeps the secret-hygiene map above true rather than approximately true.
#
# Fork pull requests get no secrets, so the model-key jobs are guarded on the
# head repository being this one; they skip rather than failing on a fork.
#
# The caller filters its pushes to its default branch, so the qa-assets
# pushes the judge step makes (ADR-0002) never re-trigger this pipeline,
# which is what keeps those pushes from being pull request completions.

on:
  workflow_call:
    inputs:
      profile:
        description: The directory that holds the repository's QA profile (config.yml, QA.md, stubs).
        type: string
        default: .qa
      nare-model:
        description: The model the planner and the verifier ask, as the provider names it.
        type: string
        required: true
      nare-provider:
        description: The nare provider that reaches the model. openai is any OpenAI-compatible endpoint.
        type: string
        default: openai
      nare-base-url:
        description: The endpoint of an OpenAI-compatible model service. Empty means the provider's own.
        type: string
        default: ''
      nare-context-window:
        description: >-
          The context window of nare-model, in tokens. nare measures every
          planner and verifier turn against it, and without it asks the
          backend, which an OpenAI-compatible proxy does not answer, so it
          falls back to 32000. Empty keeps nare's own choice.
        type: string
        default: ''
      nare-stream:
        description: >-
          Set to true to stream the planner's and the verifier's model turns,
          so an edge proxy sees bytes flowing and no idle timeout cuts the
          turn short. Empty or false keeps the default, non-streaming.
        type: string
        default: ''
      nare-image-input:
        description: >-
          Set to true when nare-model takes PNG and JPEG input, so the
          verifier reads a flow's screenshots as images. nare does not guess
          a model's capability, and a text-only model declared capable
          errors, so leave it empty or false for one. Off, the verifier is
          told it cannot see screenshots and judges from the text evidence.
        type: string
        default: ''
      max-output-tokens:
        description: >-
          The most the planner, the verifier and the UX review may write in
          one model turn, in tokens. A reasoning model spends this budget thinking before it
          answers; raise it when a turn is cut off at max_tokens, lower it for
          a model that allows less. Empty keeps qare's default.
        type: string
        default: ''
      plan-batch-size:
        description: >-
          How many criteria the planner is asked to plan in one model turn.
          Each batch is its own turn with its own output budget, and a turn
          that is cut off, errors or is refused costs only its own criteria.
          Raise it for a fast model, to send the diff fewer times. Empty keeps
          qare's default of one criterion a turn.
        type: string
        default: ''
      plan-concurrency:
        description: >-
          How many plan batches may be with the model at the same time. The
          batches are independent, so an endpoint that serves several
          requests side by side plans in less wall clock; one that serves
          them one at a time gains nothing. Empty keeps qare's default of one
          batch at a time.
        type: string
        default: ''
      verify-batch-size:
        description: >-
          How many proven criteria the verifier is asked about in one model
          turn. Each batch is its own turn with its own output budget, and a
          turn that is cut off, errors or cannot be read leaves only its own
          criteria unverified. Raise it for a fast model, to send the diff
          fewer times. Empty keeps qare's default of one criterion a turn.
        type: string
        default: ''
      model-key-env:
        description: The environment variable the provider reads its key from. The model-key secret is exported under this name.
        type: string
        default: OPENAI_API_KEY
      runs-on:
        description: >-
          Where every job runs, as JSON: one label ('"ubuntu-latest"') or a
          list ('["self-hosted", "linux", "x64"]'). A runner needs docker,
          git, jq and the gh CLI.
        type: string
        default: '"ubuntu-latest"'
      execute-runs-on:
        description: >-
          Where execute and main_execute run, in the same JSON form as
          runs-on. On self-hosted runners this must name a different pool
          unless ephemeral-runners is 'true'. Empty means runs-on on hosted
          runners. The execute pool must never run jobs holding secrets.
        type: string
        default: ''
      ephemeral-runners:
        description: >-
          Set to 'true' to declare that every job gets a fresh machine that
          is destroyed afterwards, with no docker daemon, volume or cache
          shared between jobs. Recorded as a caller declaration in evidence.
          Self-hosted execute otherwise requires a separate execute-runs-on.
        type: string
        default: ''
      self-hosted:
        description: >-
          A public repository keeps its runs on GitHub-hosted runners: on a
          self-hosted runner, collect, plan and execute stop by name before
          any checkout, because a runner that outlives its job keeps whatever
          a pull request left on it. Set this to 'allow' to use your own
          capacity anyway. It changes
          nothing for a private repository, or on hosted runners.
        type: string
        default: ''
      planner-diff-exclude:
        description: >-
          Paths left out of the planner's copy of the diff, as space-separated
          git pathspecs (a test suite, generated files). The full diff still
          reaches execute and judge.
        type: string
        default: ''
      planner-diff-default-exclude:
        description: >-
          Whether the planner's copy of the diff also leaves out lockfiles
          and common generated paths (minified bundles, source maps, dist,
          node_modules, vendor), on top of planner-diff-exclude. Anything but
          'false' leaves them out, and the evidence comment lists every path
          that was left out. The full diff still reaches execute and judge.
        type: string
        default: 'true'
      flake-attempts:
        description: >-
          How many times execute runs a failing check before it judges it.
          The default, 2, is one retry. A check that fails and then passes is
          quarantined and its criterion reported unverified, never proven; a
          check that fails every attempt fails. '1' turns retries off.
        type: string
        default: '2'
      quarantine:
        description: >-
          The directory, relative to the repository root, that holds the
          quarantine store (quarantine.json). A pull request run reads the
          base revision's store, never the pull request's, and the store the
          run wrote is uploaded with the evidence as quarantine.json, for a
          person to commit. Empty turns quarantine off.
        type: string
        default: '.qa'
      blocked-check:
        description: >-
          How the QARE verdict check run reports a blocked verdict, one that
          disproved nothing but left a criterion unverified: 'neutral', the
          default, or 'failure', so that a run that verified less than it was
          asked to stops a merge that requires the check.
        type: string
        default: 'neutral'
      artefacts:
        description: >-
          The name of a workflow artifact that holds the builds a client
          profile installs (`client.artefact`), uploaded by an earlier job of
          the calling workflow. execute downloads it, before the run, into
          `qare-artefacts/` at the repository root, whatever the artifact is
          named, which is where the profile's paths find it; the checkout
          must not carry a path of that name. Empty means the profile
          installs nothing the pipeline has to fetch.
        type: string
        default: ''
      build-cache:
        description: >-
          Set to 'true' to give the images execute and main_execute build a
          buildx layer cache, kept with actions/cache. Only main_execute, on
          your default branch, writes it: a pull request's run only reads it,
          so no pull request reads anything another pull request wrote, and
          main never reads anything a pull request wrote. It holds image
          layers only, and the jobs that write and read it hold no secret.
          Empty, the default, builds with no cache.
        type: string
        default: ''
      main-lane:
        description: >-
          Set to 'true' to run the main lane: on a push to your default
          branch, on a schedule or on a manual run, the pipeline boots the
          app, runs the suites your ledger records for its active criteria,
          judges them, and hands the result to `qare-action main-findings`
          (findings on main become issues). Your workflow chooses the
          trigger. Empty, the default, runs none of it.
        type: string
        default: ''
      main-lane-dry-run:
        description: >-
          Whether the main lane only says what it would file. Anything but
          'false' is a dry run: it reads, prints the issues it would open,
          comment on, reopen or close and whom it would mention, and writes
          nothing. Set it to 'false' to file for real, once you have read a
          dry run and named `findings.fallback` in your profile.
        type: string
        default: 'true'
      main-lane-record-passes:
        description: >-
          Set to 'true' to have the main lane record what each run proved, so
          that a later failure is filed as a qa-regression against that pass
          and traced to the changes since. The record is one file on the
          orphan qa-assets branch (passes/main.json), written by the judge
          side; the ledger and the default branch are never written. Anything
          but 'true' records nothing, and so does a dry run.
        type: string
        default: ''
      qare-ref:
        description: >-
          The qare revision the pipeline runs: its source for the token-only
          jobs, its version for the images. It defaults to the release this
          workflow ships in, so pin the release in `uses:` and leave this
          alone.
        type: string
        default: '2026.10.53'
    secrets:
      model-key:
        description: >-
          The model key the planner and the verifier use. Not required at the
          interface, because a fork pull request has none; the plan and judge
          steps stop by name when it is empty.
        required: false
      app-id:
        description: >-
          The id (or client id) of the GitHub App qare posts as. A secret so
          that it can be handed over from a secret or a variable; with
          app-private-key it makes qare post as the App. Leave both out to
          post with a token.
        required: false
      app-private-key:
        description: >-
          A private key of that App, the whole .pem file. It reaches one step
          of collect and each job that posts, which runs on the runner and mints a token
          for this repository alone, with that job's permissions, that
          expires within the hour. The steps that post hold only that token.
        required: false
      personal-access-token:
        description: >-
          A personal access token qare posts with when no App is passed: what
          it writes is that user's. With neither, qare posts as the workflow
          run, with the Actions token.
        required: false

permissions:
  contents: read

jobs:
  # label: collect (GitHub token only)
  collect:
    name: collect (GitHub token only)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      criteria: ${{ steps.inputs.outputs.criteria }}
      # Which profile the planner reads (#431): base, head (the pull
      # request's, as data, because the base has none) or none.
      plan-profile: ${{ steps.plan-profile.outputs.plan-profile }}
      # The version of the qare this run uses, read from the revision the
      # caller pinned. plan, execute and judge pull the images it names.
      qare-version: ${{ steps.qare.outputs.version }}
    steps:
      # A public repository keeps its runs on GitHub-hosted runners (#76): a
      # runner that outlives its job keeps whatever a pull request left on
      # it, so this stops before anything of the pull request reaches the
      # machine, unless the caller opted in with `self-hosted: allow`. It is
      # the first step of collect, plan and execute, and collect gates the
      # rest. The same rule, in the same words, is `qare run`'s own
      # (placementProblem), which refuses a run started any other way.
      - name: Keep a public repository's run off a self-hosted runner
        shell: bash
        env:
          QARE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          QARE_SELF_HOSTED: ${{ inputs.self-hosted }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ "${QARE_REPOSITORY_VISIBILITY:-}" = "public" ] && [ "${QARE_SELF_HOSTED:-}" != "allow" ]; then
            reason="this repository is public and the run landed on a self-hosted runner: a public repository keeps its runs on GitHub-hosted runners, because a runner that outlives its job keeps whatever a pull request left on it; to use your own capacity anyway, opt in with the pipeline input self-hosted: allow"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi
      # The base commit: the pull request contributes data only, and the head
      # arrives below as an object, never as a working tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      # This job holds the GitHub token, so the qare whose script it runs and
      # whose version it reads is the revision the caller pinned, which the
      # pull request cannot change: a release for a repository that calls
      # this workflow, the base commit for qare itself. The qare it runs is
      # that version's published image (#381), pulled below.
      - name: Check out qare at the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ViviDynamics/qare
          ref: ${{ inputs.qare-ref }}
          path: .qare-pipeline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .qare-pipeline/.nvmrc
      - name: Mint the App token for this job
        id: app
        shell: bash
        env:
          QARE_APP_ID: ${{ secrets.app-id }}
          QARE_APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
          QARE_APP_PERMISSIONS: '{"contents":"read","issues":"read","pull_requests":"read"}'
        run: |
          set -euo pipefail
          script=.qare-pipeline/scripts/mint-app-token.mjs
          if [ ! -f "$script" ]; then
            if [ -z "$QARE_APP_ID" ] && [ -z "$QARE_APP_PRIVATE_KEY" ]; then
              echo "the qare this pipeline pinned is older than the minting step and carries no script for it; no GitHub App was passed, so there is nothing to mint"
              exit 0
            fi
            echo "::error::the qare this pipeline pinned is older than the minting step and carries no script for it, so it cannot post as the GitHub App that was passed: run a qare that carries the script, or pass no App"
            exit 1
          fi
          node "$script"
      - name: Read the version of the pinned qare
        id: qare
        shell: bash
        env:
          QARE_REF: ${{ inputs.qare-ref }}
          # The job's own read-only token, which its checkout already holds:
          # it reads qare's public releases, nothing of the repository.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A release tag names its own images (#242): a release the
          # automation computed carries the last stamped version in its
          # package.json, and reading that ran an older release's images.
          # Any other revision runs the images of the newest published
          # release it contains (#360): the automation tags releases without
          # committing their version back, so main's package.json keeps the
          # last version a person stamped. A release is published only after
          # its images are pushed, so a published release always has them.
          calver='^20[0-9]{2}\.[0-9]+\.[0-9]+$'
          # Read from the API with curl and jq, which every runner has (#238).
          qare_api() {
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/ViviDynamics/qare/$1"
          }
          newest_first() { grep -E "$calver" | sort -t. -k1,1nr -k2,2nr -k3,3nr || true; }
          if published="$(qare_api 'releases?per_page=100' | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name')"; then
            published="$(printf '%s\n' "$published" | newest_first)"
          else
            published=""
            echo "::warning::could not read the published releases of qare, so whether these images are the latest is not known"
            echo "qare could not read the published releases, so whether these images are the latest is not known" >> "$GITHUB_STEP_SUMMARY"
          fi
          latest="$(printf '%s\n' "$published" | head -n 1)"
          version=""
          if [[ "$QARE_REF" =~ $calver ]]; then
            version="$QARE_REF"
          else
            pinned="$(git -C .qare-pipeline rev-parse HEAD)"
            # At most the 20 newest: a revision that contains none of them is
            # far behind, and its manifest names it as before.
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              status="$(qare_api "compare/$tag...$pinned" | jq -r .status)" || break
              if [ "$status" = ahead ] || [ "$status" = identical ]; then
                version="$tag"
                break
              fi
            done < <(printf '%s\n' "$published" | head -n 20)
            if [ -z "$version" ]; then
              if ! version="$(jq -ser 'select(length == 1) | .[0].version | select(type == "string" and test("^20[0-9]{2}\\.[0-9]+\\.[0-9]+\\z"))' .qare-pipeline/package.json)"; then
                echo "::error::the pinned qare manifest has no readable CalVer version, so no version output or image is named" >&2
                exit 1
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$latest" ] && [ "$version" != "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | newest_first | head -n 1)" = "$latest" ]; then
            echo "::warning::this run uses the images of qare $version, older than the latest release $latest"
            echo "This run uses the images of qare $version, older than the latest release $latest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This run uses the images of qare $version." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The qare this job runs is the published core image of that version
      # (#381), the image plan, execute, judge and publish run, resolved to
      # its registry digest and pulled by it, so nothing here installs or
      # builds qare from source. The image is qare's own, never built from
      # anything the pull request carries, and the pull request's body,
      # issues and diff reach it as files. No cache is restored: this job
      # holds the GitHub token (#305).
      - name: Pull the core image
        id: image
        shell: bash
        env:
          QARE_VERSION: ${{ steps.qare.outputs.version }}
        run: |
          set -euo pipefail
          ref="ghcr.io/vividynamics/qare-core:$QARE_VERSION"
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::qare image inspection needs Docker buildx with imagetools: install the buildx plugin alongside this runner's Docker client"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"; then
            echo "::error::qare could not resolve the published image $ref to its registry digest; nothing was pulled"
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::qare registry inspection returned no valid SHA-256 digest for $ref; nothing was pulled"
            exit 1
          fi
          immutable="${ref%:*}@$digest"
          if ! docker pull "$immutable"; then
            echo "no published qare-core image for version $QARE_VERSION ($ref): the image family publishes when a release is tagged, so tag a release and the images job in qare's .github/workflows/release.yml publishes it; until then this pipeline stays red rather than building qare from source (#88)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "digest=$immutable" >> "$GITHUB_OUTPUT"
      - name: Say why a fork gets no QA
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "this pull request comes from a fork, which gets no model key, so qare cannot plan or check it here" >> "$GITHUB_STEP_SUMMARY"
      - name: Read the linked issue and the diff
        id: inputs
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLANNER_DIFF_EXCLUDE: ${{ inputs.planner-diff-exclude }}
          PLANNER_DIFF_DEFAULT_EXCLUDE: ${{ inputs.planner-diff-default-exclude }}
        run: |
          set -euo pipefail
          # The image's qare reads files of this workspace and nothing else:
          # no token and no network reach its container.
          qare() {
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp --network none \
              -v "$PWD:$PWD" -w "$PWD" "$IMAGE_REF" qare "$@"
          }
          printf '%s' "${PR_BODY:-}" > pr-body.md
          qare linked-issues --body pr-body.md > linked.txt
          if [ ! -s linked.txt ]; then
            echo "this change promises to close no issue, so it states no acceptance criteria and there is nothing to check" >> "$GITHUB_STEP_SUMMARY"
            echo "criteria=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issues=()
          while read -r number; do
            # Read from the API with curl and jq, which every runner has: a
            # repository's own runner need not carry the GitHub CLI (#238).
            if ! curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$number" > "issue-${number}.json"; then
              echo "::error::linked issue #$number could not be read"
              exit 1
            fi
            jq -r '.body // ""' "issue-${number}.json" > "issue-${number}.md"
            issues+=("issue-${number}.md")
          done < linked.txt
          # Read here, without a model: an issue that states no criteria (a bug
          # report closed by a one-line fix) has nothing to check, the same
          # neutral outcome as closing no issue at all.
          qare issue-criteria --out criteria.json "${issues[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -f criteria.json ]; then
            echo "criteria=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The head is fetched as an object, not checked out: the base
          # revision's qare produces the diff, and the pull request's tree is
          # never installed or run in this job.
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git diff "${BASE_SHA}...${HEAD_SHA}" > change.diff
          # The planner's prompt reaches nare by file (#401), so no argument
          # size bounds it: the model's context window does
          # (nare-context-window, #391), and a diff bigger than the window
          # cannot reach the planner whole. The planner's copy keeps the
          # change's source and spec and leaves out the paths the caller
          # names (a test suite, say); the full diff
          # stays the diff for execute and judge. The names are read as
          # words, never expanded by the shell: git matches them, as
          # pathspecs.
          #
          # Lockfiles and common generated paths are left out by default
          # (#380): they are large, and nothing a criterion says is planned
          # from them. Each name is listed at the root and below it, because
          # a pathspec's `*` matches across directories. `planner-diff-
          # default-exclude: 'false'` keeps them in.
          default_excludes=()
          if [ "${PLANNER_DIFF_DEFAULT_EXCLUDE:-}" != "false" ]; then
            default_excludes=(
              'pnpm-lock.yaml' '*/pnpm-lock.yaml'
              'package-lock.json' '*/package-lock.json'
              'npm-shrinkwrap.json' '*/npm-shrinkwrap.json'
              'yarn.lock' '*/yarn.lock'
              'bun.lock' '*/bun.lock'
              'bun.lockb' '*/bun.lockb'
              'Cargo.lock' '*/Cargo.lock'
              'Gemfile.lock' '*/Gemfile.lock'
              'poetry.lock' '*/poetry.lock'
              'Pipfile.lock' '*/Pipfile.lock'
              'uv.lock' '*/uv.lock'
              'composer.lock' '*/composer.lock'
              'go.sum' '*/go.sum'
              '*.min.js' '*.min.css' '*.js.map' '*.css.map'
              'dist/*' '*/dist/*'
              'node_modules/*' '*/node_modules/*'
              'vendor/*' '*/vendor/*'
            )
          fi
          excludes=()
          applied=()
          read -r -a patterns <<< "${PLANNER_DIFF_EXCLUDE:-}"
          for pattern in "${default_excludes[@]}" "${patterns[@]}"; do
            excludes+=(":(exclude)$pattern")
            applied+=("$pattern")
          done
          git diff "${BASE_SHA}...${HEAD_SHA}" -- . "${excludes[@]}" > change-planner.diff
          # What was left out is recorded for the evidence comment (#380):
          # the pathspecs, and the paths of this change they matched.
          git -c core.quotePath=false diff --name-only "${BASE_SHA}...${HEAD_SHA}" | sort > diff-paths.txt
          git -c core.quotePath=false diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- . "${excludes[@]}" | sort > planner-paths.txt
          comm -23 diff-paths.txt planner-paths.txt > excluded-paths.txt
          jq -n --rawfile paths excluded-paths.txt \
            '{patterns: $ARGS.positional, paths: ($paths | split("\n") | map(select(. != "")))}' \
            --args "${applied[@]}" > planner-diff-excluded.json
          # Both model-facing copies of the diff are scrubbed of the seeded
          # values the diff itself adds, wherever the profile that carries
          # them lives and however the mapping is written (a value inside an
          # inline `totp: { secret: ... }` is on the same line): no model sees
          # a secret the change promises to keep out of model-facing text (#64).
          sed -E '/^\+.*(secret[[:space:]]*:|value[[:space:]]*:)/ s/.*/+ [redacted]/' change-planner.diff > change-planner.scrubbed
          mv change-planner.scrubbed change-planner.diff
          echo "criteria=present" >> "$GITHUB_OUTPUT"
          {
            echo "criteria read from: $(tr '\n' ' ' < linked.txt)"
            echo "diff bytes: $(wc -c < change.diff)"
            echo "planner diff bytes: $(wc -c < change-planner.diff)"
            echo "paths left out of the planner diff: $(grep -c . excluded-paths.txt || true)"
          } >> "$GITHUB_STEP_SUMMARY"
      # The profile the planner reads (#431). The plan job holds the model key
      # and checks out the base, so it reads the base's profile. The pull
      # request that onboards a repository adds the profile, so its base has
      # none, and that plan was made blind: no suites, no app address, no
      # QA.md. The profile is pull-request data (rule 7), as judge already
      # reads it, so when the base has none the head's is exported here from
      # git objects, regular files only (a link could name anything on the
      # runner), and the plan job reads it with qare plan --pr-profile, which
      # starts nothing it names. ADR-0013 records the decision.
      - name: Choose the profile the planner reads
        id: plan-profile
        if: steps.inputs.outputs.criteria == 'present'
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The profile's path as git names it: no leading ./, no trailing /.
          path="${PROFILE#./}"
          path="${path%/}"
          if git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
            echo "plan-profile=base" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git cat-file -t "${HEAD_SHA}:${path}" 2>/dev/null || true)" != "tree" ]; then
            echo "plan-profile=none" >> "$GITHUB_OUTPUT"
            echo "neither the base revision nor this pull request has a profile at $path, so the planner reads none" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          out=.qare-pr-profile
          rm -rf "$out"
          mkdir -p "$out"
          copied=0
          skipped=0
          while IFS= read -r -d '' entry; do
            meta="${entry%%$'\t'*}"
            file="${entry#*$'\t'}"
            read -r mode _ object <<< "$meta"
            rel="${file#"$path"/}"
            case "$mode" in
              100644 | 100755) ;;
              *) skipped=$((skipped + 1)); continue ;;
            esac
            case "/$rel/" in
              */../* | */./*) skipped=$((skipped + 1)); continue ;;
            esac
            mkdir -p "$out/$(dirname "$rel")"
            git cat-file blob "$object" > "$out/$rel"
            copied=$((copied + 1))
          done < <(git ls-tree -r -z "$HEAD_SHA" -- "$path/")
          if [ "$copied" -eq 0 ]; then
            rm -rf "$out"
            echo "plan-profile=none" >> "$GITHUB_OUTPUT"
            echo "the base revision has no profile at $path, and this pull request's holds no regular file, so the planner reads none" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "plan-profile=head" >> "$GITHUB_OUTPUT"
          {
            echo "the base revision has no profile at $path, so the planner reads this pull request's, as data: $copied file(s), and nothing in it runs in the plan job"
            if [ "$skipped" -eq 1 ]; then
              echo "left out 1 entry that is not a regular file"
            elif [ "$skipped" -gt 1 ]; then
              echo "left out $skipped entries that are not regular files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the pull request's profile, as data
        if: steps.plan-profile.outputs.plan-profile == 'head'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-pr-profile
          path: .qare-pr-profile/
          # The directory is hidden, and so are files such as .gitkeep that
          # keep a profile's fixtures and stubs directories in git.
          include-hidden-files: true
          if-no-files-found: error
      - name: Read recorded advisory context
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.personal-access-token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The tokens reach the image's container by name, as publish hands
          # them to the same image.
          if ! docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -e GITHUB_TOKEN \
              -e QARE_APP_TOKEN \
              -e QARE_APP_SLUG \
              -e QARE_APP_TOKEN_EXPIRES_AT \
              -e QARE_GITHUB_TOKEN \
              -e GITHUB_REPOSITORY \
              -v "$PWD:$PWD" -w "$PWD" \
              --entrypoint node \
              "$IMAGE_REF" /opt/qare/lib/packages/action/dist/index.js advisory-context \
              --pr "$PR_NUMBER" --out advisory-dismissed.json; then
            rm -f advisory-dismissed.json
            echo "::warning::recorded advisory context could not be read; judging has no known dismissals, and no new reply was carried out"
          fi
      - name: Upload the QA inputs
        if: steps.inputs.outputs.criteria == 'present'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-inputs
          path: |
            criteria.json
            change.diff
            change-planner.diff
            planner-diff-excluded.json
            advisory-dismissed.json
          if-no-files-found: error

      - name: Revoke the App token this job minted
        if: always() && steps.app.outputs.token != ''
        shell: bash
        env:
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # On curl's standard input, never its command line.
          curl --fail --silent --show-error -X DELETE \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/installation/token" \
            -H @- <<< "Authorization: Bearer $QARE_APP_TOKEN" || echo "::warning::the App token this job minted could not be revoked; it expires within the hour"

  # label: plan (model key only)
  plan:
    name: plan (model key only)
    needs: collect
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # A fork pull request gets no secrets, so this would fail for a reason that
    # has nothing to do with the change. It skips instead.
    if: >-
      needs.collect.outputs.criteria == 'present' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The placement guard (#76), as in collect: before any checkout.
      - name: Keep a public repository's run off a self-hosted runner
        shell: bash
        env:
          QARE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          QARE_SELF_HOSTED: ${{ inputs.self-hosted }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ "${QARE_REPOSITORY_VISIBILITY:-}" = "public" ] && [ "${QARE_SELF_HOSTED:-}" != "allow" ]; then
            reason="this repository is public and the run landed on a self-hosted runner: a public repository keeps its runs on GitHub-hosted runners, because a runner that outlives its job keeps whatever a pull request left on it; to use your own capacity anyway, opt in with the pipeline input self-hosted: allow"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi
      # The base revision: the pull request contributes data only, and this
      # job holds the model key. The tree supplies the profile the planner
      # reads; the image is the published core for the pinned qare's version
      # (#88), so nothing here builds qare from source. No token is left in
      # .git/config: the planner's container is handed this workspace, and
      # the job that holds the model key must hold no GitHub token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Pull the core image
        id: image
        shell: bash
        env:
          QARE_VERSION: ${{ needs.collect.outputs.qare-version }}
        run: |
          set -euo pipefail
          ref="ghcr.io/vividynamics/qare-core:$QARE_VERSION"
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::qare image inspection needs Docker buildx with imagetools: install the buildx plugin alongside this runner's Docker client"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"; then
            echo "::error::qare could not resolve the published image $ref to its registry digest; nothing was pulled"
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::qare registry inspection returned no valid SHA-256 digest for $ref; nothing was pulled"
            exit 1
          fi
          immutable="${ref%:*}@$digest"
          if ! docker pull "$immutable"; then
            echo "no published qare-core image for version $QARE_VERSION ($ref): the image family publishes when a release is tagged, so tag a release and the images job in qare's .github/workflows/release.yml publishes it; until then this pipeline stays red rather than building qare from source (#88)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$immutable" >> "$GITHUB_OUTPUT"
      - name: Download the QA inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-inputs
          path: .
      # Exploration (#377): a profile that says `explore: base` has its flows
      # planned against the running base app instead of guessed from the
      # diff. The base revision is the tree this job checked out, and no pull
      # request code runs here (rule 7): the app is built from that tree,
      # never from the prebuilt base image, whose revision label is only what
      # its pusher wrote. The steps that boot and serve it name no secret and
      # run before the key is written anywhere; the boot is the only one
      # handed the runner's docker, and it exits once the app is up. The
      # browser and the exploration server run in a container with no docker
      # access, so nothing qare starts can read the planner's container while
      # it holds the key. ADR-0011 records the decision. Absent or off, every
      # one of these steps skips, and the plan step runs as before.
      - name: Read whether the profile explores
        id: explore
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          explore=""
          if [ -f "$PROFILE/config.yml" ]; then
            explore="$(awk -F'[: ]+' '$1=="explore"{print $2; exit}' "$PROFILE/config.yml")"
          fi
          # Only base turns it on. Anything else the profile loader reads for
          # itself in the plan step, and refuses there by name.
          if [ "$explore" = "base" ]; then
            echo "explore=base" >> "$GITHUB_OUTPUT"
            echo "the profile explores the base app: its flows are planned against the base revision, booted in this job" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "explore=off" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull the web image for exploration
        id: explore-image
        if: steps.explore.outputs.explore == 'base'
        shell: bash
        env:
          QARE_VERSION: ${{ needs.collect.outputs.qare-version }}
        run: |
          set -euo pipefail
          ref="ghcr.io/vividynamics/qare-web:$QARE_VERSION"
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::qare image inspection needs Docker buildx with imagetools: install the buildx plugin alongside this runner's Docker client"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"; then
            echo "::error::qare could not resolve the published image $ref to its registry digest; nothing was pulled"
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::qare registry inspection returned no valid SHA-256 digest for $ref; nothing was pulled"
            exit 1
          fi
          immutable="${ref%:*}@$digest"
          if ! docker pull "$immutable"; then
            echo "no published qare-web image for version $QARE_VERSION ($ref): exploring the base app needs the browser the web image carries (#88)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$immutable" >> "$GITHUB_OUTPUT"
      # The runner's docker, found as execute finds it (#209), for the boot
      # alone. ADR-0005 explains what docker access grants; here it is
      # granted to the base revision's compose file, which is code the
      # repository already merged, never to the pull request's.
      - name: Find the runner's docker for exploration
        if: steps.explore.outputs.explore == 'base'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/qare-explore-docker-client"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -L "$(command -v docker)" "$stage/docker"
          docker_access=(--network host -v "$stage/docker:/usr/bin/docker:ro")
          plugins=""
          while read -r plugin path; do
            case "$plugin" in compose | buildx) ;; *) continue ;; esac
            [ -f "$path" ] || continue
            cp -L "$path" "$stage/docker-$plugin"
            docker_access+=(-v "$stage/docker-$plugin:/usr/local/lib/docker/cli-plugins/docker-$plugin:ro")
            plugins="$plugins $plugin"
          done < <(docker info --format '{{range .ClientInfo.Plugins}}{{println .Name .Path}}{{end}}' 2>/dev/null || true)
          case "$plugins" in
            *compose*) ;;
            *) echo "this runner's docker has no compose plugin, so the base app cannot be booted for exploration: install docker compose v2 on the runner" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2>/dev/null || true)"
          case "$endpoint" in
            unix://*)
              socket="${endpoint#unix://}"
              docker_access+=(-v "$socket:/var/run/docker.sock" --group-add "$(stat -L -c %g "$socket")")
              ;;
            ?*) docker_access+=(-e "DOCKER_HOST=$endpoint") ;;
            *) echo "this runner's docker names no daemon endpoint, so the base app cannot be booted for exploration" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          printf '%s\n' "${docker_access[@]}" > "$RUNNER_TEMP/qare-explore-docker-access"
      # Boot and seed the base app, then exit, leaving it up. A boot or a
      # seed that fails stops the job by name (rule 6): the profile asked for
      # flows planned against the app, and a plan written blind is not that.
      - name: Boot the base app for the planner
        if: steps.explore.outputs.explore == 'base'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.explore-image.outputs.digest }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          mapfile -t docker_access < "$RUNNER_TEMP/qare-explore-docker-access"
          mkdir -p .qare-explore
          if ! docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:$PWD" -w "$PWD" \
              "${docker_access[@]}" \
              "$IMAGE_REF" qare explore boot --profile "$PROFILE" --repo "$PWD" --out .qare-explore; then
            echo "the base app did not come up for exploration, so nothing was planned; explore-boot.log in the exploration logs says why" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # The browser and the exploration channel (#87), in a container of
      # their own on the runner's network, with no docker access and nothing
      # mounted but the directory the ready file lands in. It runs while the
      # planner explores and is stopped after.
      - name: Serve the base app to the planner
        id: serve
        if: steps.explore.outputs.explore == 'base'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.explore-image.outputs.digest }}
        run: |
          set -euo pipefail
          dir="$PWD/.qare-explore"
          origin="$(jq -er '.origin' "$dir/app.json")"
          name="qare-explore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -f "$dir/serve.json"
          docker run -d --name "$name" --network host -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$dir:$dir" \
            "$IMAGE_REF" qare explore serve --app "$origin" --port 0 --ready "$dir/serve.json" > /dev/null
          echo "container=$name" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 120); do
            [ -s "$dir/serve.json" ] && break
            if [ "$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null || echo false)" != "true" ]; then break; fi
            sleep 1
          done
          if ! endpoint="$(jq -er '.endpoint' "$dir/serve.json" 2>/dev/null)"; then
            docker logs "$name" >&2 || true
            echo "the exploration channel did not start beside the base app, so nothing was planned" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
      # The pull request's profile, when the base has none (#431), laid where
      # the base has nothing. It arrives after exploring is decided and the
      # base app is served, because exploring boots the base, and it is read
      # by the plan step alone, as data.
      - name: Download the pull request's profile, as data
        if: needs.collect.outputs.plan-profile == 'head'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-pr-profile
          path: ${{ inputs.profile }}
      - name: Plan the QA run
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          MODEL_KEY: ${{ secrets.model-key }}
          MODEL_KEY_ENV: ${{ inputs.model-key-env }}
          NARE_PROVIDER: ${{ inputs.nare-provider }}
          NARE_BASE_URL: ${{ inputs.nare-base-url }}
          NARE_MODEL: ${{ inputs.nare-model }}
          NARE_CONTEXT_WINDOW: ${{ inputs.nare-context-window }}
          NARE_STREAM: ${{ inputs.nare-stream }}
          QARE_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
          QARE_PLAN_BATCH_SIZE: ${{ inputs.plan-batch-size }}
          QARE_PLAN_CONCURRENCY: ${{ inputs.plan-concurrency }}
          PROFILE: ${{ inputs.profile }}
          PLAN_PROFILE: ${{ needs.collect.outputs.plan-profile }}
          EXPLORE_ENDPOINT: ${{ steps.serve.outputs.endpoint }}
        run: |
          set -euo pipefail
          # Fail closed (rule 6): a planner without a key is stopped here, by
          # name, rather than left to fail somewhere inside the model call.
          if [ -z "$MODEL_KEY" ]; then
            echo "no model key: the calling workflow must pass the model-key secret (secrets: model-key), and the secret it names must be set in the repository" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          if [[ ! "$MODEL_KEY_ENV" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "model-key-env must be the name of an environment variable (got '$MODEL_KEY_ENV')" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          # The window nare measures each turn against (#391), checked before
          # any model call: nare would refuse it only once its container ran.
          if [ -n "$NARE_CONTEXT_WINDOW" ] && [[ ! "$NARE_CONTEXT_WINDOW" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "nare-context-window must be a whole number of tokens above zero, at most nine digits (got '$NARE_CONTEXT_WINDOW')" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          # The key travels to the container in a file only this step can
          # read, outside the workspace, under the variable the provider
          # reads: never as an argument, and never as a variable of this
          # shell, so a name that collides with one of the step's own
          # (IMAGE_REF, say) cannot put the key where an image name or a path
          # is expected. An endpoint is handed on only when the caller named
          # one.
          key_file="$(mktemp "$RUNNER_TEMP/model-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s=%s\n' "$MODEL_KEY_ENV" "$MODEL_KEY" > "$key_file"
          model_env=(--env-file "$key_file" -e NARE_PROVIDER -e NARE_MODEL)
          if [ -n "$NARE_STREAM" ]; then
            model_env+=(-e NARE_STREAM)
          fi
          if [ -n "$NARE_CONTEXT_WINDOW" ]; then
            model_env+=(-e NARE_CONTEXT_WINDOW)
          fi
          if [ -n "$QARE_MAX_OUTPUT_TOKENS" ]; then
            model_env+=(-e QARE_MAX_OUTPUT_TOKENS)
          fi
          if [ -n "$QARE_PLAN_BATCH_SIZE" ]; then
            model_env+=(-e QARE_PLAN_BATCH_SIZE)
          fi
          if [ -n "$QARE_PLAN_CONCURRENCY" ]; then
            model_env+=(-e QARE_PLAN_CONCURRENCY)
          fi
          if [ -n "$NARE_BASE_URL" ]; then
            model_env+=(-e NARE_BASE_URL)
          fi
          # The change may introduce flow action kinds the base planner's
          # vocabulary lacks (#64). They are read out of the diff as data and
          # handed to the planner's schema. A base revision whose qare has no
          # such flag yet never reads it; criteria that still cannot be planned
          # come out unplannable, and execute treats those as neutral.
          kinds=$(grep '^+.*FLOW_ACTION_KINDS' change.diff | grep -oE "'[A-Za-z][A-Za-z0-9]{0,30}'" | tr -d "'" | sort -u | head -12 | paste -sd, - || true)
          flow_actions=()
          if [ -n "$kinds" ]; then
            flow_actions=(--flow-actions "$kinds")
            echo "planning with the change's flow action kinds: $kinds" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The exploration channel served beside the base app (#377): the
          # planner reaches it on the runner's loopback, so it shares the
          # runner's network, and nothing else changes. Off, both are empty.
          explore_args=()
          network_args=()
          if [ -n "${EXPLORE_ENDPOINT:-}" ]; then
            explore_args=(--explore "$EXPLORE_ENDPOINT")
            network_args=(--network host)
          fi
          # The pull request's profile (#431) goes only by --pr-profile, which
          # starts nothing it names, and never by --profile: a pinned qare
          # older than the flag ignores it and plans with no profile, as it
          # did before, rather than reading the profile as its own.
          profile_args=(--profile "$PROFILE")
          if [ "${PLAN_PROFILE:-}" = "head" ]; then
            profile_args=(--pr-profile "$PROFILE")
          fi
          if ! docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            "${model_env[@]}" \
            "${network_args[@]}" \
            -v "$PWD:$PWD" -w "$PWD" \
            "$IMAGE_REF" qare plan \
            --criteria criteria.json --diff change-planner.diff --out plan.json \
            --nare /usr/local/bin/nare "${profile_args[@]}" "${flow_actions[@]}" "${explore_args[@]}" 2>plan.err; then
            # The planner's copy of the diff (scrubbed of the values the
            # change adds, with the paths the caller names left out) is what
            # the planner always reads. Any failure surfaces as it happened.
            cat plan.err >&2
            exit 4
          fi
          # Which profile the plan read, as qare recorded it in the plan (#431).
          case "$(jq -r '.profileSource // ""' plan.json 2>/dev/null || true)" in
            pull-request) echo "planned with this pull request's profile at $PROFILE, read as data, because the base revision has none: nothing in it ran in this job" ;;
            checkout) echo "planned with the base revision's profile at $PROFILE" ;;
            none) echo "planned with no usable profile at $PROFILE" ;;
            *)
              if [ "${PLAN_PROFILE:-}" = "head" ]; then
                echo "the pinned qare does not record which profile it planned with, so this pull request's profile may not have reached the planner"
              fi
              ;;
          esac >> "$GITHUB_STEP_SUMMARY"
          # A profile that asks to explore the base, on the pull request that
          # adds it (#413): the base has no profile, so no base app booted.
          if [ "$(jq -r '.exploreSkipped // false' plan.json 2>/dev/null || true)" = "true" ]; then
            echo "exploration did not run: the profile says explore: base, but the base revision has no profile, so there was no base app to explore; it starts with the first pull request after the profile lands on the base" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Where planning time went (#418): each batch's criteria, how long
          # its turns took and how many model turns they were, and the
          # slowest. Batches planned at once overlap, so the times add up
          # to more than the step took.
          if jq -e '(.timing // []) | length > 0' plan.json > /dev/null 2>&1; then
            {
              echo ""
              echo "| criteria | outcome | seconds | model turns |"
              echo "| --- | --- | --- | --- |"
              jq -r '.timing[] | "| \(.criteria | join(", ")) | \(.outcome) | \(.durationMs / 100 | round / 10) | \(.turns) |"' plan.json
              jq -r '.timing | max_by(.durationMs) | "slowest: \(.criteria | join(", ")), \(.durationMs / 100 | round / 10) s over \(.turns) model turns"' plan.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # The explored app goes with the job that booted it: the serve
      # container is stopped and the compose project the boot named is
      # reaped, whatever the plan did. A teardown that fails is said and
      # changes nothing about the plan.
      - name: Tear down the explored app
        if: always() && steps.explore.outputs.explore == 'base'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.explore-image.outputs.digest }}
          CONTAINER: ${{ steps.serve.outputs.container }}
        run: |
          set -euo pipefail
          if [ -n "${CONTAINER:-}" ]; then
            docker logs "$CONTAINER" > .qare-explore/serve.log 2>&1 || true
            docker rm -f "$CONTAINER" > /dev/null 2>&1 || echo "::warning::the exploration container $CONTAINER could not be removed"
          fi
          project="$(jq -r '.project // empty' .qare-explore/isolation.json 2>/dev/null || true)"
          if [ -z "$project" ] || [ -z "${IMAGE_REF:-}" ] || [ ! -f "$RUNNER_TEMP/qare-explore-docker-access" ]; then
            echo "nothing was booted for exploration, so there is nothing to reap"
            exit 0
          fi
          mapfile -t docker_access < "$RUNNER_TEMP/qare-explore-docker-access"
          if ! docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:$PWD" -w "$PWD" \
              "${docker_access[@]}" \
              "$IMAGE_REF" qare reap "$project"; then
            echo "::warning::qare reap failed: the base app booted for exploration may still be running on the runner ($project)"
          fi
      - name: Upload the exploration logs
        if: always() && steps.explore.outputs.explore == 'base'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # What the base app's boot and seed printed, swept by the profile's
          # redaction rules, and what the exploration server said.
          name: exploration-logs
          path: |
            .qare-explore/explore-boot.log
            .qare-explore/serve.log
          if-no-files-found: ignore
      - name: Upload plan.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan.json
          path: plan.json
          if-no-files-found: error
      - name: Upload mcp calls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The planner's look through the profile's registered host MCP
          # servers (#93), as the plan step served it. Written only when a
          # profile registered servers, so its absence is an ordinary no
          # rather than a fault.
          name: mcp-calls.jsonl
          path: mcp-calls.jsonl
          if-no-files-found: ignore

  # label: execute (no secrets)
  execute:
    name: execute (no secrets)
    needs: [collect, plan]
    if: needs.collect.outputs.criteria == 'present' && needs.plan.result == 'success'
    # Its own runners when the caller names them: this is the job that runs
    # pull request code, and rule 7 keeps that off a machine that holds, or
    # will later hold, a secret.
    runs-on: ${{ fromJSON(inputs.execute-runs-on || inputs.runs-on) }}
    # Where this run was placed (#76). The run decides, in code, whether it
    # may execute here: a public repository's run on a self-hosted runner is
    # refused by name unless the caller opted in. These two facts are the
    # workflow's to know, so they are the job's environment and nothing the
    # pull request writes; the runner's own kind is RUNNER_ENVIRONMENT, which
    # every runner sets. The run step hands all three into the run's
    # container, and the evidence names the kind of host that produced it.
    env:
      QARE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      QARE_SELF_HOSTED: ${{ inputs.self-hosted }}
      QARE_EPHEMERAL_RUNNERS: ${{ inputs.ephemeral-runners }}
    outputs:
      # Where the evidence was uploaded, the one place the posted comment may
      # link to (CONSTITUTION rule 4). Empty when nothing was uploaded.
      evidence-url: ${{ steps.evidence.outputs.artifact-url }}
      # The verdict the run recorded, whatever the plan step exited with
      # (#203). Empty when the run wrote no result.json: then nothing was
      # evaluated, judge is skipped, and the report job says why.
      verdict: ${{ steps.recorded.outputs.verdict }}
    steps:
      # The placement guard (#76), as in collect. This is the job that checks
      # the pull request's tree out and runs it, and it may be on a pool of
      # its own (execute-runs-on), so it holds the rule itself: nothing of
      # the pull request reaches a self-hosted runner a public repository did
      # not opt in to.
      - name: Keep a public repository's run off a self-hosted runner
        shell: bash
        env:
          QARE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          QARE_SELF_HOSTED: ${{ inputs.self-hosted }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ "${QARE_REPOSITORY_VISIBILITY:-}" = "public" ] && [ "${QARE_SELF_HOSTED:-}" != "allow" ]; then
            reason="this repository is public and the run landed on a self-hosted runner: a public repository keeps its runs on GitHub-hosted runners, because a runner that outlives its job keeps whatever a pull request left on it; to use your own capacity anyway, opt in with the pipeline input self-hosted: allow"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi
      # actions/checkout checks out the PR merge ref on pull_request events.
      # No token is left in .git/config (rule 7): the run's container is
      # handed this workspace and executes pull request code, so the job
      # reaches the repository once, here, and never again. Two commits
      # deep, so the merge commit's parents, the base and the head the run
      # names with --base and --head, are in the object store without it.
      # Require machine isolation before repository code reaches this host (#308).
      - name: Require a separate execute pool or ephemeral runners
        shell: bash
        env:
          QARE_RUNS_ON: ${{ inputs.runs-on }}
          QARE_EXECUTE_RUNS_ON: ${{ inputs.execute-runs-on }}
          QARE_EPHEMERAL_RUNNERS: ${{ inputs.ephemeral-runners }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ] || [ "${QARE_EPHEMERAL_RUNNERS:-}" = "true" ]; then
            exit 0
          fi
          # Labels are case-insensitive sets, not JSON text: reordering or
          # spelling one label as an array cannot declare a different pool.
          selector() {
            jq -ce 'if type == "string" then [.] else . end
              | if type == "array" and length > 0 and all(.[]; type == "string" and length > 0)
                then map(ascii_downcase) | unique
                else error("expected a runner label or a non-empty array of labels") end' <<< "$1"
          }
          reason="self-hosted execution requires execute-runs-on to name a pool different from runs-on, or ephemeral-runners: 'true' to declare a fresh machine and docker daemon for every job, with no shared volume or cache"
          if [ -z "${QARE_EXECUTE_RUNS_ON:-}" ] ||
             ! general=$(selector "${QARE_RUNS_ON:-}") ||
             ! execution=$(selector "$QARE_EXECUTE_RUNS_ON") ||
             [ "$general" = "$execution" ]; then
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi
      - name: Inspect self-hosted runner checklist
        shell: bash
        run: |
          set -euo pipefail
          [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] || exit 0
          # Inspect the runner before checkout, not the container that hides it.
          # Only variable names, known file labels and booleans are forwarded.
          variables='[]'
          files='[]'
          credential_name='^(AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN)|AZURE_(CLIENT_SECRET|CLIENT_CERTIFICATE_PASSWORD)|GOOGLE_(APPLICATION_CREDENTIALS|CREDENTIALS)|CLOUDSDK_AUTH_ACCESS_TOKEN|KUBE(CONFIG|_TOKEN)|(DOCKER|REGISTRY|GHCR|GITHUB|GH|OPENAI|ANTHROPIC)_(AUTH_CONFIG|PASSWORD|TOKEN|KEY|API_KEY))$'
          shopt -s nocasematch
          while read -r name; do
            if [[ "$name" =~ $credential_name ]] && [ -n "${!name:-}" ]; then
              variables="$(jq -c --arg name "$name" '. + [$name]' <<< "$variables")"
            fi
          done < <(compgen -e | sort -u)
          if [ -r /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
            files="$(jq -c '. + ["service-account-token"]' <<< "$files")"
          fi
          for name in AWS_WEB_IDENTITY_TOKEN_FILE GOOGLE_APPLICATION_CREDENTIALS KUBECONFIG; do
            if [ -n "${!name:-}" ] && [ -r "${!name}" ]; then
              files="$(jq -c --arg name "$name" '. + [$name]' <<< "$files")"
            fi
          done
          for path in .docker/config.json .aws/credentials .kube/config .config/gcloud/application_default_credentials.json; do
            if [ -n "${HOME:-}" ] && [ -r "$HOME/$path" ]; then
              files="$(jq -c --arg name "HOME/$path" '. + [$name]' <<< "$files")"
            fi
          done
          cluster=false
          port="${KUBERNETES_SERVICE_PORT:-443}"
          host="${KUBERNETES_SERVICE_HOST:-}"
          if [[ "$host" =~ ^[[:alnum:].:-]+$ ]] && [[ "$port" =~ ^[0-9]{1,5}$ ]] && [ "$port" -gt 0 ] && [ "$port" -le 65535 ]; then
            case "$host" in *:*) host="[$host]" ;; esac
            # No authentication, redirects, proxy or response body. Even 403
            # proves the internal cluster API was reachable from this job.
            if curl --disable --noproxy '*' --connect-timeout 1 --max-time 2 --insecure --silent --output /dev/null "https://$host:$port/"; then cluster=true; fi
          fi
          remote=false
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2>/dev/null || true)"
          case "${DOCKER_HOST:-$endpoint}" in
            tcp://*|http://*|https://*)
              if timeout 2 docker info --format '{{.ID}}' >/dev/null 2>&1; then remote=true; fi ;;
          esac
          jq -n --argjson variables "$variables" --argjson files "$files" --argjson cluster "$cluster" --argjson remote "$remote" \
            '{schemaVersion: "1", credentialVariables: $variables, credentialFiles: $files, clusterReachable: $cluster, remoteDocker: $remote}' > "$RUNNER_TEMP/qare-runner-safety.json"
          {
            echo '### Self-hosted runner checklist'
            echo 'From this job qare cannot observe one-job destruction, exclusive daemon ownership, runner pool membership, sandbox enforcement, the complete network boundary, all credentials, or the runner image pull. Verify the checklist in docs/pipeline.md.'
            jq -r '.credentialVariables[] | "- finding credentials: environment variable " + .' "$RUNNER_TEMP/qare-runner-safety.json"
            jq -r '.credentialFiles[] | "- finding credentials: readable " + .' "$RUNNER_TEMP/qare-runner-safety.json"
            if [ "$cluster" = true ]; then echo '- finding network: the cluster API is reachable'; fi
            if [ "$remote" = true ]; then echo '- finding docker: a remote daemon is reachable; verify exclusive ownership'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      # The flavour the profile targets (#88): the profile names it, and
      # execute pulls that image, not the runner's own stack. Absent means
      # the base image is enough, which a profile of command and mail
      # checks is.
      - name: Read the profile's flavour
        id: flavour
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [ ! -f "$PROFILE/config.yml" ]; then
            echo "flavour=core" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          flavour="$(awk -F'[: ]+' '$1=="flavour"{print $2; exit}' "$PROFILE/config.yml")"
          echo "flavour=${flavour:-core}" >> "$GITHUB_OUTPUT"
      - name: Pull the flavour image
        id: image
        shell: bash
        env:
          QARE_VERSION: ${{ needs.collect.outputs.qare-version }}
          FLAVOUR: ${{ steps.flavour.outputs.flavour }}
        run: |
          set -euo pipefail
          # The runtime is pipeline infrastructure, resolved exactly as plan
          # and judge resolve theirs (#88, rule 7): from the qare revision
          # the caller pinned, which collect read, and never from the pull
          # request's tree. For qare itself that revision is the base commit,
          # so a version-bumping pull request ships green before its release
          # exists, and the release lands after the merge, from the default
          # branch's history (#194).
          ref="ghcr.io/vividynamics/qare-$FLAVOUR:$QARE_VERSION"
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::qare image inspection needs Docker buildx with imagetools: install the buildx plugin alongside this runner's Docker client"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"; then
            echo "::error::qare could not resolve the published image $ref to its registry digest; nothing was pulled"
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::qare registry inspection returned no valid SHA-256 digest for $ref; nothing was pulled"
            exit 1
          fi
          immutable="${ref%:*}@$digest"
          if ! docker pull "$immutable"; then
            echo "no published qare-$FLAVOUR image for version $QARE_VERSION ($ref): the image family publishes when a release is tagged, so tag a release and the images job in qare's .github/workflows/release.yml publishes it; until then this pipeline stays red rather than building qare from source (#88)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$immutable" >> "$GITHUB_OUTPUT"
      # The builds a client profile installs (#75): a build of the head and,
      # for a comparison, a build of the base, produced by a job of the
      # calling workflow and uploaded as one artifact. They are pull request
      # code like the checkout they land in, and this job holds nothing. They
      # land in one reserved directory, whatever the artifact is named, which
      # the checkout must not already carry: nothing in the artifact can
      # replace the profile, the sources or the plan, which is downloaded
      # after it.
      - name: Reserve the client artefacts directory
        if: inputs.artefacts != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -e qare-artefacts ] || [ -L qare-artefacts ]; then
            echo "the checkout already carries qare-artefacts, which is where the pipeline puts the builds a client profile installs: remove it from the repository, so a downloaded build can never be laid over a file of the checkout (#75)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Download the client artefacts
        if: inputs.artefacts != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artefacts }}
          path: qare-artefacts
      - name: Download plan.json
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan.json
          path: .
      # The opt-in build cache (#381), restored before anything of the run
      # starts. A pull request's run only reads it: GitHub
      # lets it restore its own ref's caches and its base branch's, and this
      # job never saves one, so what it reads was written on the default
      # branch by main_execute, from merged code. This job holds no secret,
      # and neither did the one that wrote the cache.
      - name: Restore the build cache
        if: inputs.build-cache == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/qare-build-cache
          key: qare-build-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: qare-build-cache-${{ runner.os }}-
      # The runner's docker (#209): a profile that boots its app does it with
      # `docker compose` against the runner's daemon, so the run is handed the
      # runner's docker CLI, the compose and buildx plugins that CLI names,
      # and the daemon's endpoint, with the group that may open its socket.
      # The image ships none of them: the client that talks to a daemon is
      # the one installed beside it. The containers compose starts are
      # siblings of the run's container, publishing the app on the runner's
      # loopback, so the run shares the runner's network: the port it picks
      # is free on the runner, and its health check and its checks reach the
      # app at localhost.
      #
      # What that grants, and why it is granted
      # (docs/decisions/adr-0005-execute-docker-access.md): whoever can ask
      # the daemon for a container owns the runner, so the run's container is
      # not a sandbox and is not described as one. The boundary rule 7 draws
      # is the machine: this job holds no secret, and a runner that outlives
      # it must be one no secret-holding job ever lands on.
      - name: Find the runner's docker
        shell: bash
        run: |
          set -euo pipefail
          # The client and its plugins are copied under RUNNER_TEMP and
          # mounted from there (#256). A mount is resolved by the daemon, and
          # a runner in a pod has a daemon that does not see the runner's
          # /usr/bin: mounted by its installed path the client arrives as an
          # empty directory. RUNNER_TEMP is somewhere the daemon must already
          # see, or no workspace would mount either.
          stage="$RUNNER_TEMP/qare-docker-client"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -L "$(command -v docker)" "$stage/docker"
          docker_access=(--network host -v "$stage/docker:/usr/bin/docker:ro")
          # The plugins are named by the CLI that will run them, so they are
          # found wherever this runner keeps them. buildx travels with
          # compose because a compose file that builds its image builds
          # through it.
          plugins=""
          while read -r plugin path; do
            case "$plugin" in compose | buildx) ;; *) continue ;; esac
            [ -f "$path" ] || continue
            cp -L "$path" "$stage/docker-$plugin"
            docker_access+=(-v "$stage/docker-$plugin:/usr/local/lib/docker/cli-plugins/docker-$plugin:ro")
            plugins="$plugins $plugin"
          done < <(docker info --format '{{range .ClientInfo.Plugins}}{{println .Name .Path}}{{end}}' 2>/dev/null || true)
          case "$plugins" in
            *compose*) ;;
            *) echo "this runner's docker has no compose plugin, so a profile that boots its app with compose cannot boot it here: install docker compose v2 on the runner" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          # The daemon is the one this runner's docker talks to: its socket,
          # opened as the group that owns it, or the endpoint it is reached
          # at when that is not a socket.
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2>/dev/null || true)"
          case "$endpoint" in
            unix://*)
              socket="${endpoint#unix://}"
              docker_access+=(-v "$socket:/var/run/docker.sock" --group-add "$(stat -L -c %g "$socket")")
              ;;
            ?*) docker_access+=(-e "DOCKER_HOST=$endpoint") ;;
            *) echo "this runner's docker names no daemon endpoint, so a profile that boots its app cannot reach one" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          # One argument a line, for the steps that start the run's container.
          printf '%s\n' "${docker_access[@]}" > "$RUNNER_TEMP/qare-docker-access"
      # The opt-in build cache (#381): the images a boot builds read their
      # layers from the cache restored above. The runner's default docker
      # driver cannot use a local cache, so the builds run on a
      # docker-container builder this job makes for itself, handed to the
      # run's container with the docker access found above. A builder that
      # will not start leaves the images to build with no cache: the cache
      # only saves time, and never gates a run.
      - name: Make the build cache's builder
        if: inputs.build-cache == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/qare-buildx-builder"
          config="$RUNNER_TEMP/qare-buildx"
          builder="qare-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$config"
          mkdir -p "$config" "$RUNNER_TEMP/qare-build-cache" "$RUNNER_TEMP/qare-build-cache-new"
          if ! BUILDX_CONFIG="$config" docker buildx create --name "$builder" --driver docker-container --bootstrap > /dev/null; then
            echo "::warning::the build cache's builder could not be made, so the images build with no cache; the run is unaffected"
            exit 0
          fi
          printf '%s\n' "$builder" > "$RUNNER_TEMP/qare-buildx-builder"
          printf '%s\n' -e "BUILDX_CONFIG=$config" -e "BUILDX_BUILDER=$builder" -v "$config:$config" >> "$RUNNER_TEMP/qare-docker-access"
      - name: Run the plan
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          IMAGE_TAG_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROFILE: ${{ inputs.profile }}
          FLAKE_ATTEMPTS: ${{ inputs.flake-attempts }}
          QUARANTINE: ${{ inputs.quarantine }}
          BUILD_CACHE: ${{ inputs.build-cache }}
        run: |
          set -uo pipefail
          # The run's own facts come from here rather than from the plan: a
          # plan is the same wherever it runs (#105). The run executes inside
          # the flavour image, so the runner's own record names the image ref
          # and digest that produced the evidence (#88): the ref and digest
          # travel in the environment, the flavour and driver versions travel
          # in the image.
          #
          # The docker arguments are the ones the step above found (#209).
          # The workspace maps to itself, so the paths a compose file names
          # line up with the daemon's.
          #
          # The base side (#147): a profile that boots an app is checked at
          # the base commit too, so a criterion that worked there and fails
          # here is reported as a regression. The image carries no git, so
          # the base tree is checked out here, outside the head's checkout,
          # and mounted at its own path like the workspace. The checkout
          # brought the merge commit's parents, and the base is the first of
          # them. The base the pull request recorded can be an older commit
          # of the base branch than the one this merge was made against;
          # then the merge's own base is the base, because this job reaches
          # the repository once and holds no credential to ask for another
          # commit. Both sides run in this job, and it holds no secret.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            merge_base="$(git rev-parse --verify --quiet 'HEAD^1' || true)"
            if [ -n "$merge_base" ]; then
              echo "the base this pull request recorded ($BASE_SHA) is not the commit its merge was made against; the base side is that commit, $merge_base" >> "$GITHUB_STEP_SUMMARY"
              BASE_SHA="$merge_base"
            fi
          fi
          base_dir="$RUNNER_TEMP/qare-base"
          base_args=()
          base_mount=()
          if git worktree add --detach "$base_dir" "$BASE_SHA"; then
            base_args=(--base-repo "$base_dir")
            base_mount=(-v "$base_dir:$base_dir")
          else
            echo "the base commit could not be checked out, so qare checks the head alone and reports every criterion as not compared" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The flake policy (#380): how many attempts a failing check gets,
          # and the quarantine store a check that failed and then passed is
          # recorded in. A retry never turns a failure into a pass: such a
          # check is quarantined and its criterion reported unverified.
          if ! [[ "${FLAKE_ATTEMPTS:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::flake-attempts takes a whole number of attempts, one or more, not '${FLAKE_ATTEMPTS:-}'"
            exit 1
          fi
          quarantine_args=()
          quarantine_mount=()
          quarantine_dir="$RUNNER_TEMP/qare-quarantine"
          if [ -n "${QUARANTINE:-}" ]; then
            case "$QUARANTINE" in
              /*|..|../*|*/..|*/../*)
                echo "::error::quarantine names a directory inside the repository, not '$QUARANTINE'"
                exit 1
                ;;
            esac
            # Fresh every run: a store an earlier job left on a runner that
            # outlived it is never read.
            rm -rf "$quarantine_dir"
            mkdir -p "$quarantine_dir"
            # The store is the base revision's (#380): a pull request cannot
            # quarantine its own failing check. Without a base checkout the
            # run starts from an empty store.
            if [ -n "${base_args[*]}" ] && [ -f "$base_dir/$QUARANTINE/quarantine.json" ]; then
              cp "$base_dir/$QUARANTINE/quarantine.json" "$quarantine_dir/quarantine.json"
            fi
            quarantine_args=(--quarantine "$quarantine_dir")
            quarantine_mount=(-v "$quarantine_dir:$quarantine_dir")
          fi
          # The build cache (#381), read and never written: a pull request's
          # run saves nothing.
          cache_args=()
          cache_mount=()
          if [ "${BUILD_CACHE:-}" = "true" ] && [ -f "$RUNNER_TEMP/qare-buildx-builder" ]; then
            cache_args=(--build-cache-from "$RUNNER_TEMP/qare-build-cache")
            cache_mount=(-v "$RUNNER_TEMP/qare-build-cache:$RUNNER_TEMP/qare-build-cache")
          fi
          mapfile -t docker_access < "$RUNNER_TEMP/qare-docker-access"
          safety_mount=()
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
            safety_mount=(-e QARE_RUNNER_SAFETY_FILE=/tmp/qare-runner-safety.json -v "$RUNNER_TEMP/qare-runner-safety.json:/tmp/qare-runner-safety.json:ro")
          fi
          code=0
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            "${safety_mount[@]}" \
            -e QARE_IMAGE_REF="$IMAGE_REF" \
            -e QARE_IMAGE_TAG="$IMAGE_TAG_REF" \
            -e QARE_IMAGE_DIGEST="$IMAGE_DIGEST" \
            -e QARE_RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:-}" \
            -e QARE_REPOSITORY_VISIBILITY="${QARE_REPOSITORY_VISIBILITY:-}" \
            -e QARE_SELF_HOSTED="${QARE_SELF_HOSTED:-}" \
            -e QARE_EPHEMERAL_RUNNERS="${QARE_EPHEMERAL_RUNNERS:-}" \
            -v "$PWD:$PWD" -w "$PWD" \
            "${base_mount[@]}" \
            "${quarantine_mount[@]}" \
            "${cache_mount[@]}" \
            "${docker_access[@]}" \
            "$IMAGE_REF" qare run --plan plan.json \
            --id "pr-${PR_NUMBER}" \
            --repo "$PWD" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --profile "$PROFILE" \
            "${base_args[@]}" \
            --flake-attempts "$FLAKE_ATTEMPTS" \
            "${quarantine_args[@]}" \
            "${cache_args[@]}" \
            --evidence evidence || code=$?
          # The store the run wrote goes up with the evidence, for a person
          # to commit where the quarantine input points.
          if [ -n "${quarantine_args[*]}" ] && [ -d evidence ] && [ -f "$quarantine_dir/quarantine.json" ]; then
            cp "$quarantine_dir/quarantine.json" evidence/quarantine.json
          fi
          # 3 is refused: this repository has no profile or no stubs, or the
          # run landed where it cannot execute (#76: a host without what the
          # profile requires, or a self-hosted runner a public repository did
          # not opt in to), so qare will not pretend to have checked it. That
          # is an outcome about the repository or its runners rather than a
          # fault in the change, judge still reports it, and stub issues are
          # filed when a stub is what is missing.
          if [ "$code" -eq 3 ]; then
            # A refusal writes result.json like any other run; without it,
            # exit 3 means something else went wrong and judge has nothing.
            if [ ! -f evidence/result.json ]; then
              echo "exit 3 but no evidence/result.json: not a refusal qare recorded" >&2
              exit 1
            fi
            reason="$(jq -r '[.criteria[] | select(.outcome == "unverified") | .reason][0] // empty' evidence/result.json 2>/dev/null || true)"
            echo "qare refused this run: ${reason:-it recorded no reason}; judge will report it, and file stub issues when a stub is what is missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 2 is blocked: nothing was disproven, but something was left
          # unverified. When every unverified criterion is one the planner
          # could not plan, whose planned command cannot run without a
          # shell, or whose check could not start at all (the planner named
          # an executable the runner does not have), the gap is in the
          # planning vocabulary rather than in the change (#64): judge
          # reports each criterion by name, and the pipeline stays green. Any
          # other blocked run — a check that could not reach the app, an
          # environment that would not boot — is a fault and stays red.
          if [ "$code" -eq 2 ] && [ -f evidence/result.json ] && jq -e '
            .verdict == "blocked" and
            ([.criteria[] | select(.outcome == "unverified")] | length) > 0 and
            ([.criteria[] | select(.outcome == "unverified")
              | (.reason // "")
              | startswith("the planner could not plan it")
                or startswith("the planned command cannot run")
                or startswith("check could not start")] | all)
          ' evidence/result.json > /dev/null; then
            echo "verdict blocked: every criterion left unverified is planner-unplannable, names a command that cannot run without a shell, or names a check that could not start; judge reports them, and nothing was disproven" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      # A failed or blocked verdict exits non-zero and leaves this job red,
      # and judge still publishes it, so the pull request is told which
      # criteria failed rather than shown a red job that reads the same as
      # qare failing (#203). Read whatever the plan step exited with.
      - name: Read the recorded verdict
        id: recorded
        if: always()
        shell: bash
        # No readable verdict fails this step (rule 6): judge is skipped, so a
        # run that recorded nothing must not leave the pipeline green with
        # nothing posted. The report job names the failure instead.
        run: |
          set -euo pipefail
          if ! verdict="$(jq -ser 'select(length == 1) | .[0].verdict | select(type == "string" and IN("passed", "failed", "blocked", "refused", "waived"))' evidence/result.json)"; then
            echo "::error::evidence/result.json has no readable supported verdict, so no verdict output is written" >&2
            exit 1
          fi
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
      # The run leaves the head's stack up, because teardown is its caller's
      # job (#53), and this pipeline is the caller: the compose projects the
      # run named in its evidence are taken down, volumes and all. The run
      # names one per boot: isolation.json, isolation-<app>.json for a plan
      # over several apps, isolation-<criterion>.json for a criterion that
      # boots an app of its own. On a
      # runner that outlives the job, a stack left behind would hold its
      # memory and its port until someone noticed. The verdict is already
      # recorded, so a teardown that fails is said and does not change it.
      - name: Tear down what the run booted
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ ! -d evidence ] || [ ! -f "$RUNNER_TEMP/qare-docker-access" ]; then
            echo "no run evidence: nothing was booted, so there is nothing to tear down"
            exit 0
          fi
          mapfile -t projects < <(find evidence -name 'isolation*.json' -exec jq -r '.project // empty' {} + | sort -u)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "the run booted no compose project"
            exit 0
          fi
          mapfile -t docker_access < "$RUNNER_TEMP/qare-docker-access"
          if ! docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:$PWD" -w "$PWD" \
              "${docker_access[@]}" \
              "$IMAGE_REF" qare reap "${projects[@]}"; then
            echo "::warning::qare reap failed: a compose project this run booted may still be running on the runner (${projects[*]}); the verdict is unaffected"
          fi
      # The builder goes with the job that made it (#381).
      - name: Remove the build cache's builder
        if: always() && inputs.build-cache == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/qare-buildx-builder" ] || exit 0
          BUILDX_CONFIG="$RUNNER_TEMP/qare-buildx" docker buildx rm "$(cat "$RUNNER_TEMP/qare-buildx-builder")" > /dev/null 2>&1 \
            || echo "::warning::the build cache's builder could not be removed"
          rm -f "$RUNNER_TEMP/qare-buildx-builder"
      # Evidence is published, so it is redacted before it leaves this
      # machine, and a redaction that fails uploads nothing (#52). The run
      # already redacts what it writes; this also covers files a crashed run
      # left behind and anything else that landed in the directory.
      - name: Redact the evidence
        id: redact
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [ ! -d evidence ]; then
            echo "no evidence directory: nothing to redact or upload"
            exit 0
          fi
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:$PWD" -w "$PWD" \
            "$IMAGE_REF" qare redact --evidence evidence --profile "$PROFILE"
      - name: Upload evidence (raw results + result.json)
        id: evidence
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: execute-evidence
          path: evidence/
          if-no-files-found: ignore
      # The profile is pull-request data (rule 7): execute reads it as YAML,
      # and judge reads it from this artifact rather than from a checkout of
      # the pull request's tree. A run refused for want of a profile has none
      # to upload, and judge skips the verifier for it anyway.
      - name: Upload the profile the run used
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-profile
          path: ${{ inputs.profile }}
          # .qa, the usual profile, is a hidden directory, and
          # upload-artifact@v4 matches no hidden path unless it is told to:
          # without this flag the upload silently uploads nothing and judge
          # has no profile to read.
          include-hidden-files: true
          if-no-files-found: ignore

  # label: judge (model key only)
  judge:
    name: judge (model key only)
    needs: [collect, plan, execute]
    if: always() && needs.execute.outputs.verdict != ''
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.recorded.outputs.ready }}
      verdict: ${{ steps.recorded.outputs.verdict }}
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Create a fresh judge output directory
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/qare-judge.XXXXXX")"
          printf 'path=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Pull the core image
        id: image
        shell: bash
        env:
          QARE_VERSION: ${{ needs.collect.outputs.qare-version }}
        run: |
          set -euo pipefail
          ref="ghcr.io/vividynamics/qare-core:$QARE_VERSION"
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::qare image inspection needs Docker buildx with imagetools: install the buildx plugin alongside this runner's Docker client"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"; then
            echo "::error::qare could not resolve the published image $ref to its registry digest; nothing was pulled"
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::qare registry inspection returned no valid SHA-256 digest for $ref; nothing was pulled"
            exit 1
          fi
          immutable="${ref%:*}@$digest"
          if ! docker pull "$immutable"; then
            echo "no published qare-core image for version $QARE_VERSION ($ref): the image family publishes when a release is tagged, so tag a release and the images job in qare's .github/workflows/release.yml publishes it; until then this pipeline stays red rather than building qare from source (#88)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$immutable" >> "$GITHUB_OUTPUT"
      - name: Download the QA inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-inputs
          path: qa-inputs
      - name: Download plan.json
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan.json
          path: qa-plan
      - name: Download execute evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: execute-evidence
          path: evidence
      - name: Read the executed verdict
        id: executed
        shell: bash
        run: |
          set -euo pipefail
          if ! verdict="$(jq -ser 'select(length == 1) | .[0].verdict | select(type == "string" and IN("passed", "failed", "blocked", "refused", "waived"))' evidence/result.json)"; then
            echo "::error::evidence/result.json has no readable supported verdict, so no verdict output is written" >&2
            exit 1
          fi
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
      - name: Download the profile the run used
        if: steps.executed.outputs.verdict != 'refused'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-profile
          path: profile
      - name: Judge the result
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          JUDGE_OUTPUT: ${{ steps.workspace.outputs.path }}
          # The planner's key and model: the verifier's prompt is planning
          # size, so it asks the model the planner asked (nare#27).
          MODEL_KEY: ${{ secrets.model-key }}
          MODEL_KEY_ENV: ${{ inputs.model-key-env }}
          NARE_PROVIDER: ${{ inputs.nare-provider }}
          NARE_BASE_URL: ${{ inputs.nare-base-url }}
          NARE_MODEL: ${{ inputs.nare-model }}
          NARE_CONTEXT_WINDOW: ${{ inputs.nare-context-window }}
          NARE_STREAM: ${{ inputs.nare-stream }}
          QARE_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
          QARE_VERIFY_BATCH_SIZE: ${{ inputs.verify-batch-size }}
          QARE_VERIFIER_IMAGE_INPUT: ${{ inputs.nare-image-input }}
        run: |
          set -euo pipefail
          # Fail closed (rule 6), as the plan step does: no key, no verifier.
          if [ -z "$MODEL_KEY" ]; then
            echo "no model key: the calling workflow must pass the model-key secret (secrets: model-key), and the secret it names must be set in the repository" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          if [[ ! "$MODEL_KEY_ENV" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "model-key-env must be the name of an environment variable (got '$MODEL_KEY_ENV')" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          # The window nare measures each turn against (#391), checked before
          # any model call: nare would refuse it only once its container ran.
          if [ -n "$NARE_CONTEXT_WINDOW" ] && [[ ! "$NARE_CONTEXT_WINDOW" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "nare-context-window must be a whole number of tokens above zero, at most nine digits (got '$NARE_CONTEXT_WINDOW')" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          # In a file, never in this shell: see the plan step.
          key_file="$(mktemp "$RUNNER_TEMP/model-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s=%s\n' "$MODEL_KEY_ENV" "$MODEL_KEY" > "$key_file"
          model_env=(--env-file "$key_file" -e NARE_PROVIDER -e NARE_MODEL)
          if [ -n "$NARE_STREAM" ]; then
            model_env+=(-e NARE_STREAM)
          fi
          if [ -n "$NARE_CONTEXT_WINDOW" ]; then
            model_env+=(-e NARE_CONTEXT_WINDOW)
          fi
          if [ -n "$QARE_MAX_OUTPUT_TOKENS" ]; then
            model_env+=(-e QARE_MAX_OUTPUT_TOKENS)
          fi
          if [ -n "$QARE_VERIFY_BATCH_SIZE" ]; then
            model_env+=(-e QARE_VERIFY_BATCH_SIZE)
          fi
          # Whether the verifier's model takes images (#439), checked before
          # any model call, and handed over only when it is set.
          if [ -n "$QARE_VERIFIER_IMAGE_INPUT" ]; then
            if [ "$QARE_VERIFIER_IMAGE_INPUT" != true ] && [ "$QARE_VERIFIER_IMAGE_INPUT" != false ]; then
              echo "nare-image-input is true or false (got '$QARE_VERIFIER_IMAGE_INPUT')" | tee -a "$GITHUB_STEP_SUMMARY" >&2
              exit 1
            fi
            model_env+=(-e QARE_VERIFIER_IMAGE_INPUT)
          fi
          if [ -n "$NARE_BASE_URL" ]; then
            model_env+=(-e NARE_BASE_URL)
          fi
          # The same flow action kinds the plan job handed the planner (#64):
          # the judge loads the plan with the base revision's loader, which
          # needs them to accept checks written in the change's vocabulary.
          kinds=$(grep '^+.*FLOW_ACTION_KINDS' qa-inputs/change.diff | grep -oE "'[A-Za-z][A-Za-z0-9]{0,30}'" | tr -d "'" | sort -u | head -12 | paste -sd, - || true)
          flow_actions=()
          if [ -n "$kinds" ]; then
            flow_actions=(--flow-actions "$kinds")
          fi
          # The findings people dismissed on this pull request (#150), as
          # collect read them: the advisory reviewer is told, so it
          # does not raise them again. They are data for the reviewer alone;
          # nothing in the verdict reads them.
          dismissed=()
          if [ -f qa-inputs/advisory-dismissed.json ]; then
            dismissed=(--dismissed qa-inputs/advisory-dismissed.json)
          fi
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            "${model_env[@]}" \
            -v "$PWD:$PWD" -v "$JUDGE_OUTPUT:$JUDGE_OUTPUT" -w "$PWD" \
            "$IMAGE_REF" qare judge \
            --result evidence/result.json --outDir "$JUDGE_OUTPUT" \
            --plan qa-plan/plan.json --diff qa-inputs/change-planner.diff \
            --nare /usr/local/bin/nare --profile profile "${flow_actions[@]}" "${dismissed[@]}"
      - name: Read the judged verdict
        id: recorded
        if: always()
        shell: bash
        env:
          JUDGE_OUTPUT: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$JUDGE_OUTPUT" ]; then
            echo "::error::judge output directory missing; no readable supported verdict"
            exit 1
          fi
          if ! verdict="$(jq -ser 'select(length == 1) | .[0].verdict | select(type == "string" and IN("passed", "failed", "blocked", "refused", "waived"))' "$JUDGE_OUTPUT/judged-result.json")"; then
            echo "::error::judged-result.json has no readable supported verdict; publishing is not authorized" >&2
            exit 1
          fi
          printf 'verdict=%s\nready=true\n' "$verdict" >> "$GITHUB_OUTPUT"
      - name: Record the run's metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$JUDGE_OUTPUT" ] || [ ! -f "$JUDGE_OUTPUT/judged-result.json" ]; then
            echo "judged-result.json missing: judge did not produce an artifact, no metrics to record"
            exit 0
          fi
          args=()
          if [ -f qa-plan/plan.json ]; then
            args+=(--plan qa-plan/plan.json)
          fi
          if [ -n "${PR_NUMBER:-}" ]; then
            args+=(--pr "$PR_NUMBER")
          fi
          # A metrics failure is reported, never gating: the verdict is decided
          # and the evidence posted whether or not the numbers were recorded,
          # and the numbers are not worth a red run by themselves (#51). The
          # image's qare records them: this job builds nothing, and a
          # caller's repository carries no qare to run.
          if ! docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:$PWD" -v "$JUDGE_OUTPUT:$JUDGE_OUTPUT" -w "$PWD" \
              "$IMAGE_REF" qare metrics record \
              --result "$JUDGE_OUTPUT/judged-result.json" "${args[@]}" \
              --store qa-metrics --out "$JUDGE_OUTPUT/metrics.json"; then
            echo "::warning::qare metrics record failed: this run's numbers are not recorded, the verdict is unaffected"
          fi
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          JUDGE_OUTPUT: ${{ steps.workspace.outputs.path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Upload judge artifacts (comment.md, checkrun.json, judged-result.json, metrics.json)
        if: always() && steps.workspace.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: judge-artifacts
          path: |
            ${{ steps.workspace.outputs.path }}/comment.md
            ${{ steps.workspace.outputs.path }}/checkrun.json
            ${{ steps.workspace.outputs.path }}/judged-result.json
            ${{ steps.workspace.outputs.path }}/metrics.json
          if-no-files-found: ignore

  publish:
    name: publish (GitHub token only)
    needs: [collect, plan, execute, judge]
    if: always() && needs.judge.outputs.ready == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # actions: read is for this run's own jobs (#381), read with the run's
    # own token and never asked of the App.
    permissions:
      actions: read
      contents: write
      issues: write
      checks: write
      pull-requests: write
    outputs:
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Check out the pinned qare's scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ViviDynamics/qare
          ref: ${{ inputs.qare-ref }}
          path: .qare-pipeline
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .qare-pipeline/.nvmrc
      - name: Mint the App token for this job
        id: app
        shell: bash
        env:
          QARE_APP_ID: ${{ secrets.app-id }}
          QARE_APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
          QARE_APP_PERMISSIONS: '{"contents":"write","checks":"write","issues":"write","pull_requests":"write"}'
        run: |
          set -euo pipefail
          script=.qare-pipeline/scripts/mint-app-token.mjs
          if [ ! -f "$script" ]; then
            if [ -z "$QARE_APP_ID" ] && [ -z "$QARE_APP_PRIVATE_KEY" ]; then
              echo "the qare this pipeline pinned is older than the minting step and carries no script for it; no GitHub App was passed, so there is nothing to mint"
              exit 0
            fi
            echo "::error::the qare this pipeline pinned is older than the minting step and carries no script for it, so it cannot post as the GitHub App that was passed: run a qare that carries the script, or pass no App"
            exit 1
          fi
          node "$script"
      - name: Pull the core image
        id: image
        shell: bash
        env:
          IMAGE_REF: ${{ needs.judge.outputs.image-digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/vividynamics/qare-core@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::judge recorded no valid immutable qare-core image; nothing is published"
            exit 1
          fi
          docker pull "$IMAGE_REF"
          printf 'digest=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Check that the image reads the minted token
        if: steps.app.outputs.token != ''
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # grep's own answer: 0 found, 1 not found. Anything else is a
          # docker or an image that could not be asked, and is said as that.
          status=0
          docker run --rm --network none --entrypoint grep "$IMAGE_REF" \
            -q QARE_APP_TOKEN /opt/qare/lib/packages/action/dist/identity.js || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::the qare image this run pulled ($IMAGE_REF) is older than the minted token and would not post as the GitHub App that was passed: run a qare whose image reads it, or pass no App"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the qare image this run pulled ($IMAGE_REF) could not be inspected (status $status), so it is not known to read the minted token: nothing is posted with it"
            exit 1
          fi
      - name: Download judge-artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: judge-artifacts
          path: judged
      - name: Download execute evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: execute-evidence
          path: evidence
      # collect's record of what the planner's diff left out (#380), which the
      # evidence comment lists.
      - name: Download the QA inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-inputs
          path: qa-inputs
      - name: Carry out the advisory replies
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.personal-access-token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -e GITHUB_TOKEN \
              -e QARE_APP_TOKEN \
              -e QARE_APP_SLUG \
              -e QARE_APP_TOKEN_EXPIRES_AT \
              -e QARE_GITHUB_TOKEN \
              -e GITHUB_REPOSITORY \
              -v "$PWD:$PWD" -w "$PWD" \
              --entrypoint node \
              "$IMAGE_REF" /opt/qare/lib/packages/action/dist/index.js advisory-replies \
              --pr "$PR_NUMBER" --out advisory-dismissed.json; then
            rm -f advisory-dismissed.json
            echo "::warning::qare-action advisory-replies failed: replies to advisory findings were not carried out and nothing is treated as dismissed; the verdict is unaffected"
          fi
      - name: File stub issues (refused runs only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.personal-access-token }}
        run: |
          if [ ! -f judged/judged-result.json ]; then
            echo "judged/judged-result.json missing: judge did not produce an artifact, no stub issues to file"
          elif jq -e '.verdict == "refused"' judged/judged-result.json > /dev/null; then
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -e GITHUB_TOKEN \
              -e QARE_APP_TOKEN \
              -e QARE_APP_SLUG \
              -e QARE_APP_TOKEN_EXPIRES_AT \
              -e QARE_GITHUB_TOKEN \
              -e GITHUB_REPOSITORY \
              -v "$PWD:$PWD" -w "$PWD" \
              --entrypoint node \
              "$IMAGE_REF" /opt/qare/lib/packages/action/dist/index.js stub-issues --result judged/judged-result.json --pr "${{ github.event.pull_request.number }}"
          else
            echo "verdict $(jq -r '.verdict' judged/judged-result.json): not refused, no stub issues to file"
          fi
      # Each job's wall clock (#381) rides the run's metrics record to
      # qa-assets, so the standing report can say what a change did to the
      # run time. The jobs are this run attempt's, as the Actions API reports
      # them with the run's own read-only token: every job that completed
      # and ran (a skipped job ran nothing, and this job and report are still
      # running), by the name its workflow gives it, without the caller's
      # prefix. node does it here rather than a flag of the image, which a
      # pull request's run would not have until the next release. The numbers
      # describe the run and never gate it: a read that fails leaves the
      # record as judge wrote it.
      - name: Add each job's wall clock to the run's metrics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          record=judged/metrics.json
          if [ ! -f "$record" ]; then
            echo "no metrics record: judge recorded none, so there is nothing to add the jobs to"
            exit 0
          fi
          jobs_file="$(mktemp "$RUNNER_TEMP/qare-jobs.XXXXXX")"
          timed="$(mktemp "$RUNNER_TEMP/qare-metrics.XXXXXX")"
          trap 'rm -f "$jobs_file" "$timed"' EXIT
          # The token on curl's standard input, never its command line.
          if ! curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" -H @- \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
              > "$jobs_file" <<< "Authorization: Bearer $GH_TOKEN"; then
            echo "::warning::the run's jobs could not be read, so its metrics record carries no job wall clock; the verdict is unaffected"
            exit 0
          fi
          # node, which this job set up for the minting step, merges them.
          if ! node - "$jobs_file" "$record" "$timed" <<'MERGE'; then
          const fs = require('node:fs')
          const [jobsFile, recordFile, outFile] = process.argv.slice(2)
          const api = JSON.parse(fs.readFileSync(jobsFile, 'utf8'))
          if (!Array.isArray(api?.jobs)) throw new Error('the answer carries no jobs')
          const time = (value) => {
            const ms = typeof value === 'string' ? Date.parse(value) : Number.NaN
            if (Number.isNaN(ms)) throw new Error(`not a time: ${value}`)
            return ms
          }
          const jobs = api.jobs
            .filter((job) => job.status === 'completed' && job.conclusion !== 'skipped')
            .map((job) => ({
              name: String(job.name).split(' / ').pop(),
              startedAt: job.started_at,
              completedAt: job.completed_at,
              wallMs: Math.max(0, time(job.completed_at) - time(job.started_at)),
            }))
          const record = JSON.parse(fs.readFileSync(recordFile, 'utf8'))
          fs.writeFileSync(outFile, `${JSON.stringify({ ...record, jobs }, null, 2)}\n`)
          MERGE
            echo "::warning::the run's jobs were not in the shape the Actions API promises, so its metrics record carries no job wall clock; the verdict is unaffected"
            exit 0
          fi
          cp "$timed" "$record"
      - name: Post the evidence on the pull request
        id: posted
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.personal-access-token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_URL: ${{ needs.execute.outputs.evidence-url }}
          BLOCKED_CHECK: ${{ inputs.blocked-check }}
        run: |
          set -euo pipefail
          dismissed=()
          if [ -f advisory-dismissed.json ]; then
            dismissed=(--dismissed advisory-dismissed.json)
          fi
          excluded=()
          if [ -f qa-inputs/planner-diff-excluded.json ]; then
            excluded=(--planner-diff-excluded qa-inputs/planner-diff-excluded.json)
          fi
          # How a blocked verdict's check run reads (#380). Neutral is the
          # default and passes nothing. An image too old to know the flag
          # would ignore it and post neutral, so the opt-in checks first and
          # fails closed.
          blocked=()
          case "$BLOCKED_CHECK" in
            neutral|'') ;;
            failure)
              if ! docker run --rm --network none --entrypoint grep "$IMAGE_REF" \
                  -q blocked-conclusion /opt/qare/lib/packages/action/dist/index.js; then
                echo "::error::the qare image this run pulled ($IMAGE_REF) does not know blocked-check: failure and would post a blocked verdict as neutral: run a qare whose image knows it, or leave blocked-check neutral"
                exit 1
              fi
              blocked=(--blocked-conclusion failure)
              ;;
            *) echo "::error::blocked-check is neutral or failure, not '$BLOCKED_CHECK'"; exit 1 ;;
          esac
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GITHUB_TOKEN \
            -e QARE_APP_TOKEN \
            -e QARE_APP_SLUG \
            -e QARE_APP_TOKEN_EXPIRES_AT \
            -e QARE_GITHUB_TOKEN \
            -e GITHUB_REPOSITORY \
            -v "$PWD:$PWD" -w "$PWD" \
            --entrypoint node \
            "$IMAGE_REF" /opt/qare/lib/packages/action/dist/index.js post-evidence \
            --result judged/judged-result.json \
            --pr "$PR_NUMBER" --sha "$HEAD_SHA" --artifact-url "$EVIDENCE_URL" \
            --evidence evidence --metrics judged/metrics.json "${dismissed[@]}" "${excluded[@]}" "${blocked[@]}"
          # The verdict is on the pull request: the report job must not
          # replace it, whatever fails after this (#203).
          echo "posted=true" >> "$GITHUB_OUTPUT"
      - name: Revoke the App token this job minted
        if: always() && steps.app.outputs.token != ''
        shell: bash
        env:
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # On curl's standard input, never its command line.
          curl --fail --silent --show-error -X DELETE \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/installation/token" \
            -H @- <<< "Authorization: Bearer $QARE_APP_TOKEN" || echo "::warning::the App token this job minted could not be revoked; it expires within the hour"

  # label: report (GitHub token only)
  # A pipeline that failed without publishing a verdict evaluated no
  # criterion: a tool that would not install, an image that would not pull, a
  # planner that would not answer, or publishing failing to post. On the pull
  # request that is only a red job, which reads like the project failing
  # (#203). This job names the job and step that failed, and posts the
  # sticky comment and a failing check run saying no criterion was evaluated
  # and the failure is qare's side or the runner's, not the project's.

  report:
    name: report (GitHub token only)
    needs: [collect, plan, execute, judge, publish]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.publish.outputs.posted != 'true' &&
      contains(needs.*.result, 'failure')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      # actions: read is for listing this run's jobs and steps.
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The pinned qare, like every job holding the token (rule 7): the qare
      # it builds and runs is a revision the pull request cannot change. This
      # job reads the run through the API and needs nothing of the caller's
      # tree, so qare is the whole workspace.
      - name: Check out qare at the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ViviDynamics/qare
          ref: ${{ inputs.qare-ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The App's private key is used here and nowhere else in this job (#305):
      # a script of the pinned qare that imports node's own modules alone,
      # run on the runner before any dependency is installed, any artifact
      # downloaded or any container run. It mints a token for this
      # repository alone, with the permissions this job declares, that
      # expires within the hour, and the steps that post are handed that
      # token. With no App passed it mints nothing and they post with the
      # personal access token or the Actions token; with half an App it
      # stops by name. A pinned qare that predates the script predates the
      # image that reads the token too, so with an App passed it stops here
      # and never posts as something weaker.
      - name: Mint the App token for this job
        id: app
        shell: bash
        env:
          QARE_APP_ID: ${{ secrets.app-id }}
          QARE_APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
          QARE_APP_PERMISSIONS: '{"checks":"write","contents":"read","issues":"write","pull_requests":"write"}'
        run: |
          set -euo pipefail
          script=scripts/mint-app-token.mjs
          if [ ! -f "$script" ]; then
            if [ -z "$QARE_APP_ID" ] && [ -z "$QARE_APP_PRIVATE_KEY" ]; then
              echo "the qare this pipeline pinned is older than the minting step and carries no script for it; no GitHub App was passed, so there is nothing to mint"
              exit 0
            fi
            echo "::error::the qare this pipeline pinned is older than the minting step and carries no script for it, so it cannot post as the GitHub App that was passed: run a qare that carries the script, or pass no App"
            exit 1
          fi
          node "$script"
      # No dependency cache (#305): this job holds the identity, so what it
      # installs comes from the registry by the lockfile of the pinned qare,
      # never from a cache another job could have written.
      - name: Enable the pnpm package.json names
        shell: bash
        run: |
          set -euo pipefail
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/qare-corepack.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          wanted="$(jq -r '.packageManager // empty' package.json)"
          wanted="${wanted%%+*}"
          found="pnpm@$(pnpm --version)"
          if [ "$found" != "$wanted" ]; then
            echo "::error::corepack resolved $found, and package.json names ${wanted:-no package manager}"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Report the failure on the pull request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.personal-access-token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Prefer the judged verdict; otherwise report the recorded execution
          # as unpublished, without treating it as verified.
          RECORDED_VERDICT: ${{ needs.judge.outputs.verdict || needs.execute.outputs.verdict }}
        run: |
          set -euo pipefail
          node packages/action/dist/index.js report-failure \
            --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" \
            --pr "$PR_NUMBER" --sha "$HEAD_SHA" --run-url "$RUN_URL" \
            --recorded-verdict "$RECORDED_VERDICT" \
            --pipeline collect,plan,execute,judge,publish --reporter report \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # The job tries to give the token back when it ends, however it ends,
      # so it does not outlive the work it was minted for. It expires within
      # the hour regardless, so a revocation that fails is a warning.
      - name: Revoke the App token this job minted
        if: always() && steps.app.outputs.token != ''
        shell: bash
        env:
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # On curl's standard input, never its command line.
          curl --fail --silent --show-error -X DELETE \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/installation/token" \
            -H @- <<< "Authorization: Bearer $QARE_APP_TOKEN" || echo "::warning::the App token this job minted could not be revoked; it expires within the hour"

  # label: advisory (GitHub token only)
  # A reply to an advisory finding (#150), acted on the moment it is made:
  # `/qa-dismiss <id>` records that the finding is not to be raised again on
  # the pull request, `/qa-promote <id>` files it as an issue. It runs only
  # when the caller's workflow listens for `issue_comment`; without that
  # trigger the same replies are carried out by publish on the pull request's
  # next run. qare files no issue unless a person asks: this job and that
  # step are the only things that can, and both act on a reply alone.
  #
  # A comment is untrusted text. It selects this job through the expression
  # below and goes nowhere else: no step is handed it, and qare reads the
  # pull request's comments through the API, taking findings only from its
  # own comment and replies only from an owner, a member or a collaborator.
  advisory:
    name: advisory (GitHub token only)
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/qa-dismiss') ||
      startsWith(github.event.comment.body, '/qa-promote'))
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # One at a time for a pull request: the sweep learns what was already
    # answered by reading what was written, so two at once could answer the
    # same reply twice. A run waits; none is cancelled.
    concurrency:
      group: qare-advisory-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The pinned qare, like every job holding the token (rule 7), and the
      # whole workspace: nothing of the pull request is checked out or run.
      - name: Check out qare at the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ViviDynamics/qare
          ref: ${{ inputs.qare-ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The App's private key is used here and nowhere else in this job (#305):
      # a script of the pinned qare that imports node's own modules alone,
      # run on the runner before any dependency is installed, any artifact
      # downloaded or any container run. It mints a token for this
      # repository alone, with the permissions this job declares, that
      # expires within the hour, and the steps that post are handed that
      # token. With no App passed it mints nothing and they post with the
      # personal access token or the Actions token; with half an App it
      # stops by name. A pinned qare that predates the script predates the
      # image that reads the token too, so with an App passed it stops here
      # and never posts as something weaker.
      - name: Mint the App token for this job
        id: app
        shell: bash
        env:
          QARE_APP_ID: ${{ secrets.app-id }}
          QARE_APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
          QARE_APP_PERMISSIONS: '{"contents":"read","issues":"write","pull_requests":"write"}'
        run: |
          set -euo pipefail
          script=scripts/mint-app-token.mjs
          if [ ! -f "$script" ]; then
            if [ -z "$QARE_APP_ID" ] && [ -z "$QARE_APP_PRIVATE_KEY" ]; then
              echo "the qare this pipeline pinned is older than the minting step and carries no script for it; no GitHub App was passed, so there is nothing to mint"
              exit 0
            fi
            echo "::error::the qare this pipeline pinned is older than the minting step and carries no script for it, so it cannot post as the GitHub App that was passed: run a qare that carries the script, or pass no App"
            exit 1
          fi
          node "$script"
      # No dependency cache, as in report (#305).
      - name: Enable the pnpm package.json names
        shell: bash
        run: |
          set -euo pipefail
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/qare-corepack.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          wanted="$(jq -r '.packageManager // empty' package.json)"
          wanted="${wanted%%+*}"
          found="pnpm@$(pnpm --version)"
          if [ "$found" != "$wanted" ]; then
            echo "::error::corepack resolved $found, and package.json names ${wanted:-no package manager}"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Carry out the advisory replies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.personal-access-token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          node packages/action/dist/index.js advisory-replies --pr "$PR_NUMBER" | tee -a "$GITHUB_STEP_SUMMARY"
      # The job tries to give the token back when it ends, however it ends,
      # so it does not outlive the work it was minted for. It expires within
      # the hour regardless, so a revocation that fails is a warning.
      - name: Revoke the App token this job minted
        if: always() && steps.app.outputs.token != ''
        shell: bash
        env:
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # On curl's standard input, never its command line.
          curl --fail --silent --show-error -X DELETE \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/installation/token" \
            -H @- <<< "Authorization: Bearer $QARE_APP_TOKEN" || echo "::warning::the App token this job minted could not be revoked; it expires within the hour"

  # label: requeue (GitHub token only)
  requeue:
    name: requeue (GitHub token only)
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      # contents: read is for the checkout, which a private repository
      # cannot do without it.
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The pinned qare, beside the pushed tree whose stub diff it reads.
      - name: Check out qare at the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ViviDynamics/qare
          ref: ${{ inputs.qare-ref }}
          path: .qare-pipeline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .qare-pipeline/.nvmrc
      # The App's private key is used here and nowhere else in this job (#305):
      # a script of the pinned qare that imports node's own modules alone,
      # run on the runner before any dependency is installed, any artifact
      # downloaded or any container run. It mints a token for this
      # repository alone, with the permissions this job declares, that
      # expires within the hour, and the steps that post are handed that
      # token. With no App passed it mints nothing and they post with the
      # personal access token or the Actions token; with half an App it
      # stops by name. A pinned qare that predates the script predates the
      # image that reads the token too, so with an App passed it stops here
      # and never posts as something weaker.
      - name: Mint the App token for this job
        id: app
        shell: bash
        env:
          QARE_APP_ID: ${{ secrets.app-id }}
          QARE_APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
          QARE_APP_PERMISSIONS: '{"contents":"read","issues":"write","pull_requests":"write"}'
        run: |
          set -euo pipefail
          script=.qare-pipeline/scripts/mint-app-token.mjs
          if [ ! -f "$script" ]; then
            if [ -z "$QARE_APP_ID" ] && [ -z "$QARE_APP_PRIVATE_KEY" ]; then
              echo "the qare this pipeline pinned is older than the minting step and carries no script for it; no GitHub App was passed, so there is nothing to mint"
              exit 0
            fi
            echo "::error::the qare this pipeline pinned is older than the minting step and carries no script for it, so it cannot post as the GitHub App that was passed: run a qare that carries the script, or pass no App"
            exit 1
          fi
          node "$script"
      # No dependency cache, as in report (#305).
      - name: Enable the pnpm package.json names
        shell: bash
        working-directory: .qare-pipeline
        run: |
          set -euo pipefail
          COREPACK_HOME="$(mktemp -d "$RUNNER_TEMP/qare-corepack.XXXXXX")"
          export COREPACK_HOME
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          corepack enable
          wanted="$(jq -r '.packageManager // empty' package.json)"
          wanted="${wanted%%+*}"
          found="pnpm@$(pnpm --version)"
          if [ "$found" != "$wanted" ]; then
            echo "::error::corepack resolved $found, and package.json names ${wanted:-no package manager}"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
        working-directory: .qare-pipeline
      - run: pnpm build
        working-directory: .qare-pipeline
      - name: Re-queue refused PRs unblocked by the merged stubs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.personal-access-token }}
          BEFORE: ${{ github.event.before }}
          PUSHED: ${{ github.sha }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          before="$BEFORE"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git hash-object -t tree /dev/null)"
            echo "first push to main: diffing from the empty tree"
          fi
          node .qare-pipeline/packages/action/dist/index.js requeue --keys-from-diff "$before...$PUSHED" --profile "$PROFILE"
      # The job tries to give the token back when it ends, however it ends,
      # so it does not outlive the work it was minted for. It expires within
      # the hour regardless, so a revocation that fails is a warning.
      - name: Revoke the App token this job minted
        if: always() && steps.app.outputs.token != ''
        shell: bash
        env:
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # On curl's standard input, never its command line.
          curl --fail --silent --show-error -X DELETE \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/installation/token" \
            -H @- <<< "Authorization: Bearer $QARE_APP_TOKEN" || echo "::warning::the App token this job minted could not be revoked; it expires within the hour"

  # The main lane (#294): a run against the default branch, so that findings
  # on main have a judged result to be filed from (#154). It is the pull
  # request lane's shape with the pull request taken out:
  #
  #   main_collect -> main_execute -> main_judge -> main_publish
  #
  # There is no main_plan, and no model plans anything here. The ledger
  # already records which suite proves each active criterion, so
  # main_collect reads the plan out of the ledger with code (`qare ledger
  # plan`). A criterion whose ledger checks name no suite is carried
  # unplannable and reported unverified with that reason; it is never guessed
  # at. The verifier still reads the evidence in main_judge, as it does for a
  # pull request, told that no change is under review.
  #
  # Secret-hygiene map (rule 7), the same as above:
  #   - main_collect: holds the GitHub token only (the checkout; no model key)
  #   - main_execute: holds no secrets at all     (it runs the repository's code)
  #   - main_judge: holds the model key only (the verifier reads evidence)
  #   - main_publish: holds a fresh GitHub identity token (files findings)
  #
  # Off unless the caller passes `main-lane: 'true'`, and then only on a push,
  # a schedule or a manual run whose ref is the default branch: a pull
  # request, a comment, a tag or another branch starts none of it. A dry run
  # unless the caller also passes `main-lane-dry-run: 'false'`: it reads,
  # prints the issues it would open and whom it would mention, and writes
  # nothing.
  #
  # The ledger is read and never written (rule 5): a run on main changes no
  # criterion. What a run proved is a fact about the run, not a change to a
  # criterion, and when the caller asks (main-lane-record-passes) main_publish
  # records it beside the ledger, on the orphan qa-assets branch, where the
  # run's metrics already go (#295). That record is what makes a later
  # failure a regression. main_execute cannot write it: it holds no token.

  # label: main_collect (GitHub token only)
  main_collect:
    name: main collect (GitHub token only)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    if: >-
      inputs.main-lane == 'true' &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    outputs:
      criteria: ${{ steps.inputs.outputs.criteria }}
      # The version of the qare this run uses, read from the revision the
      # caller pinned. main_execute and main_judge pull the images it names.
      qare-version: ${{ steps.qare.outputs.version }}
    steps:
      # The placement guard (#76), as in collect: before any checkout.
      - name: Keep a public repository's run off a self-hosted runner
        shell: bash
        env:
          QARE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          QARE_SELF_HOSTED: ${{ inputs.self-hosted }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ "${QARE_REPOSITORY_VISIBILITY:-}" = "public" ] && [ "${QARE_SELF_HOSTED:-}" != "allow" ]; then
            reason="this repository is public and the run landed on a self-hosted runner: a public repository keeps its runs on GitHub-hosted runners, because a runner that outlives its job keeps whatever a pull request left on it; to use your own capacity anyway, opt in with the pipeline input self-hosted: allow"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi
      # The revision the run was started for. Its tree supplies the ledger
      # and nothing here runs it. No token is left in .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The pinned qare, like every job that holds the token (rule 7): its
      # version names the image the lane runs.
      - name: Check out qare at the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ViviDynamics/qare
          ref: ${{ inputs.qare-ref }}
          path: .qare-pipeline
          persist-credentials: false
      - name: Read the version of the pinned qare
        id: qare
        shell: bash
        env:
          QARE_REF: ${{ inputs.qare-ref }}
          # The job's own read-only token, which its checkout already holds:
          # it reads qare's public releases, nothing of the repository.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A release tag names its own images (#242): a release the
          # automation computed carries the last stamped version in its
          # package.json, and reading that ran an older release's images.
          # Any other revision runs the images of the newest published
          # release it contains (#360): the automation tags releases without
          # committing their version back, so main's package.json keeps the
          # last version a person stamped. A release is published only after
          # its images are pushed, so a published release always has them.
          calver='^20[0-9]{2}\.[0-9]+\.[0-9]+$'
          # Read from the API with curl and jq, which every runner has (#238).
          qare_api() {
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/ViviDynamics/qare/$1"
          }
          newest_first() { grep -E "$calver" | sort -t. -k1,1nr -k2,2nr -k3,3nr || true; }
          if published="$(qare_api 'releases?per_page=100' | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name')"; then
            published="$(printf '%s\n' "$published" | newest_first)"
          else
            published=""
            echo "::warning::could not read the published releases of qare, so whether these images are the latest is not known"
            echo "qare could not read the published releases, so whether these images are the latest is not known" >> "$GITHUB_STEP_SUMMARY"
          fi
          latest="$(printf '%s\n' "$published" | head -n 1)"
          version=""
          if [[ "$QARE_REF" =~ $calver ]]; then
            version="$QARE_REF"
          else
            pinned="$(git -C .qare-pipeline rev-parse HEAD)"
            # At most the 20 newest: a revision that contains none of them is
            # far behind, and its manifest names it as before.
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              status="$(qare_api "compare/$tag...$pinned" | jq -r .status)" || break
              if [ "$status" = ahead ] || [ "$status" = identical ]; then
                version="$tag"
                break
              fi
            done < <(printf '%s\n' "$published" | head -n 20)
            if [ -z "$version" ]; then
              if ! version="$(jq -ser 'select(length == 1) | .[0].version | select(type == "string" and test("^20[0-9]{2}\\.[0-9]+\\.[0-9]+\\z"))' .qare-pipeline/package.json)"; then
                echo "::error::the pinned qare manifest has no readable CalVer version, so no version output or image is named" >&2
                exit 1
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$latest" ] && [ "$version" != "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | newest_first | head -n 1)" = "$latest" ]; then
            echo "::warning::this run uses the images of qare $version, older than the latest release $latest"
            echo "This run uses the images of qare $version, older than the latest release $latest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This run uses the images of qare $version." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The qare that reads the ledger is the core image of that version
      # (#381), as in collect: pulled by its digest, never built here.
      - name: Pull the core image
        id: image
        shell: bash
        env:
          QARE_VERSION: ${{ steps.qare.outputs.version }}
        run: |
          set -euo pipefail
          ref="ghcr.io/vividynamics/qare-core:$QARE_VERSION"
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::qare image inspection needs Docker buildx with imagetools: install the buildx plugin alongside this runner's Docker client"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"; then
            echo "::error::qare could not resolve the published image $ref to its registry digest; nothing was pulled"
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::qare registry inspection returned no valid SHA-256 digest for $ref; nothing was pulled"
            exit 1
          fi
          immutable="${ref%:*}@$digest"
          if ! docker pull "$immutable"; then
            echo "no published qare-core image for version $QARE_VERSION ($ref): the image family publishes when a release is tagged, so tag a release and the images job in qare's .github/workflows/release.yml publishes it; until then this pipeline stays red rather than building qare from source (#88)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "digest=$immutable" >> "$GITHUB_OUTPUT"
      # The plan, read out of the ledger by code: every active criterion,
      # checked by the suites its ledger checks name. The ledger sits in the
      # profile directory (`<profile>/ledger.json`). A ledger that holds no
      # active criterion has nothing to run: this says so, every later job
      # skips, and the run stays green, as collect does for a change that
      # states no criteria. A ledger that cannot be read fails here (rule 6).
      - name: Plan from the checks the ledger records
        id: inputs
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          rm -f plan.json
          # The image's qare reads the ledger in this workspace, with no
          # token and no network.
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp --network none \
            -v "$PWD:$PWD" -w "$PWD" "$IMAGE_REF" \
            qare ledger plan --ledger "$PROFILE" --out plan.json | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -f plan.json ]; then
            echo "criteria=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "criteria=present" >> "$GITHUB_OUTPUT"
      - name: Upload the plan
        if: steps.inputs.outputs.criteria == 'present'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-inputs
          path: plan.json
          if-no-files-found: error

  # label: main_execute (no secrets)
  main_execute:
    name: main execute (no secrets)
    needs: main_collect
    if: needs.main_collect.outputs.criteria == 'present'
    # Its own runners when the caller names them, as execute: this is the job
    # that runs the repository's code.
    runs-on: ${{ fromJSON(inputs.execute-runs-on || inputs.runs-on) }}
    env:
      QARE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      QARE_SELF_HOSTED: ${{ inputs.self-hosted }}
      QARE_EPHEMERAL_RUNNERS: ${{ inputs.ephemeral-runners }}
    outputs:
      # Where the evidence was uploaded, the one place an issue may link to
      # (rule 4). Empty when nothing was uploaded.
      evidence-url: ${{ steps.evidence.outputs.artifact-url }}
      # The verdict the run recorded. Empty when the run wrote no
      # result.json: then nothing was evaluated and main_judge is skipped.
      verdict: ${{ steps.recorded.outputs.verdict }}
    steps:
      # The placement guard (#76), as in execute.
      - name: Keep a public repository's run off a self-hosted runner
        shell: bash
        env:
          QARE_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          QARE_SELF_HOSTED: ${{ inputs.self-hosted }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] && [ "${QARE_REPOSITORY_VISIBILITY:-}" = "public" ] && [ "${QARE_SELF_HOSTED:-}" != "allow" ]; then
            reason="this repository is public and the run landed on a self-hosted runner: a public repository keeps its runs on GitHub-hosted runners, because a runner that outlives its job keeps whatever a pull request left on it; to use your own capacity anyway, opt in with the pipeline input self-hosted: allow"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi
      # The revision the run was started for, with no token left in
      # .git/config (rule 7): the run's container is handed this workspace
      # and executes the repository's code.
      # Require machine isolation before repository code reaches this host (#308).
      - name: Require a separate execute pool or ephemeral runners
        shell: bash
        env:
          QARE_RUNS_ON: ${{ inputs.runs-on }}
          QARE_EXECUTE_RUNS_ON: ${{ inputs.execute-runs-on }}
          QARE_EPHEMERAL_RUNNERS: ${{ inputs.ephemeral-runners }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ] || [ "${QARE_EPHEMERAL_RUNNERS:-}" = "true" ]; then
            exit 0
          fi
          # Labels are case-insensitive sets, not JSON text: reordering or
          # spelling one label as an array cannot declare a different pool.
          selector() {
            jq -ce 'if type == "string" then [.] else . end
              | if type == "array" and length > 0 and all(.[]; type == "string" and length > 0)
                then map(ascii_downcase) | unique
                else error("expected a runner label or a non-empty array of labels") end' <<< "$1"
          }
          reason="self-hosted execution requires execute-runs-on to name a pool different from runs-on, or ephemeral-runners: 'true' to declare a fresh machine and docker daemon for every job, with no shared volume or cache"
          if [ -z "${QARE_EXECUTE_RUNS_ON:-}" ] ||
             ! general=$(selector "${QARE_RUNS_ON:-}") ||
             ! execution=$(selector "$QARE_EXECUTE_RUNS_ON") ||
             [ "$general" = "$execution" ]; then
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$reason"
            exit 1
          fi
      - name: Inspect self-hosted runner checklist
        shell: bash
        run: |
          set -euo pipefail
          [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ] || exit 0
          # Inspect the runner before checkout, not the container that hides it.
          # Only variable names, known file labels and booleans are forwarded.
          variables='[]'
          files='[]'
          credential_name='^(AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN)|AZURE_(CLIENT_SECRET|CLIENT_CERTIFICATE_PASSWORD)|GOOGLE_(APPLICATION_CREDENTIALS|CREDENTIALS)|CLOUDSDK_AUTH_ACCESS_TOKEN|KUBE(CONFIG|_TOKEN)|(DOCKER|REGISTRY|GHCR|GITHUB|GH|OPENAI|ANTHROPIC)_(AUTH_CONFIG|PASSWORD|TOKEN|KEY|API_KEY))$'
          shopt -s nocasematch
          while read -r name; do
            if [[ "$name" =~ $credential_name ]] && [ -n "${!name:-}" ]; then
              variables="$(jq -c --arg name "$name" '. + [$name]' <<< "$variables")"
            fi
          done < <(compgen -e | sort -u)
          if [ -r /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
            files="$(jq -c '. + ["service-account-token"]' <<< "$files")"
          fi
          for name in AWS_WEB_IDENTITY_TOKEN_FILE GOOGLE_APPLICATION_CREDENTIALS KUBECONFIG; do
            if [ -n "${!name:-}" ] && [ -r "${!name}" ]; then
              files="$(jq -c --arg name "$name" '. + [$name]' <<< "$files")"
            fi
          done
          for path in .docker/config.json .aws/credentials .kube/config .config/gcloud/application_default_credentials.json; do
            if [ -n "${HOME:-}" ] && [ -r "$HOME/$path" ]; then
              files="$(jq -c --arg name "HOME/$path" '. + [$name]' <<< "$files")"
            fi
          done
          cluster=false
          port="${KUBERNETES_SERVICE_PORT:-443}"
          host="${KUBERNETES_SERVICE_HOST:-}"
          if [[ "$host" =~ ^[[:alnum:].:-]+$ ]] && [[ "$port" =~ ^[0-9]{1,5}$ ]] && [ "$port" -gt 0 ] && [ "$port" -le 65535 ]; then
            case "$host" in *:*) host="[$host]" ;; esac
            # No authentication, redirects, proxy or response body. Even 403
            # proves the internal cluster API was reachable from this job.
            if curl --disable --noproxy '*' --connect-timeout 1 --max-time 2 --insecure --silent --output /dev/null "https://$host:$port/"; then cluster=true; fi
          fi
          remote=false
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2>/dev/null || true)"
          case "${DOCKER_HOST:-$endpoint}" in
            tcp://*|http://*|https://*)
              if timeout 2 docker info --format '{{.ID}}' >/dev/null 2>&1; then remote=true; fi ;;
          esac
          jq -n --argjson variables "$variables" --argjson files "$files" --argjson cluster "$cluster" --argjson remote "$remote" \
            '{schemaVersion: "1", credentialVariables: $variables, credentialFiles: $files, clusterReachable: $cluster, remoteDocker: $remote}' > "$RUNNER_TEMP/qare-runner-safety.json"
          {
            echo '### Self-hosted runner checklist'
            echo 'From this job qare cannot observe one-job destruction, exclusive daemon ownership, runner pool membership, sandbox enforcement, the complete network boundary, all credentials, or the runner image pull. Verify the checklist in docs/pipeline.md.'
            jq -r '.credentialVariables[] | "- finding credentials: environment variable " + .' "$RUNNER_TEMP/qare-runner-safety.json"
            jq -r '.credentialFiles[] | "- finding credentials: readable " + .' "$RUNNER_TEMP/qare-runner-safety.json"
            if [ "$cluster" = true ]; then echo '- finding network: the cluster API is reachable'; fi
            if [ "$remote" = true ]; then echo '- finding docker: a remote daemon is reachable; verify exclusive ownership'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read the profile's flavour
        id: flavour
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [ ! -f "$PROFILE/config.yml" ]; then
            echo "flavour=core" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          flavour="$(awk -F'[: ]+' '$1=="flavour"{print $2; exit}' "$PROFILE/config.yml")"
          echo "flavour=${flavour:-core}" >> "$GITHUB_OUTPUT"
      - name: Pull the flavour image
        id: image
        shell: bash
        env:
          QARE_VERSION: ${{ needs.main_collect.outputs.qare-version }}
          FLAVOUR: ${{ steps.flavour.outputs.flavour }}
        run: |
          set -euo pipefail
          # The runtime is pipeline infrastructure, resolved exactly as plan
          # and judge resolve theirs (#88, rule 7): from the qare revision
          # the caller pinned, which collect read, and never from the pull
          # request's tree. For qare itself that revision is the base commit,
          # so a version-bumping pull request ships green before its release
          # exists, and the release lands after the merge, from the default
          # branch's history (#194).
          ref="ghcr.io/vividynamics/qare-$FLAVOUR:$QARE_VERSION"
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::qare image inspection needs Docker buildx with imagetools: install the buildx plugin alongside this runner's Docker client"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"; then
            echo "::error::qare could not resolve the published image $ref to its registry digest; nothing was pulled"
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::qare registry inspection returned no valid SHA-256 digest for $ref; nothing was pulled"
            exit 1
          fi
          immutable="${ref%:*}@$digest"
          if ! docker pull "$immutable"; then
            echo "no published qare-$FLAVOUR image for version $QARE_VERSION ($ref): the image family publishes when a release is tagged, so tag a release and the images job in qare's .github/workflows/release.yml publishes it; until then this pipeline stays red rather than building qare from source (#88)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$immutable" >> "$GITHUB_OUTPUT"
      - name: Download the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-inputs
          path: .
      # The opt-in build cache (#381), restored before anything of the run
      # starts. main_execute runs on the default branch alone,
      # so it restores, and saves below, in that branch's scope, which every
      # pull request may read and none may write.
      - name: Restore the build cache
        if: inputs.build-cache == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/qare-build-cache
          key: qare-build-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: qare-build-cache-${{ runner.os }}-
      # The runner's docker, found exactly as execute finds it (#209, #256).
      - name: Find the runner's docker
        shell: bash
        run: |
          set -euo pipefail
          # The client and its plugins are copied under RUNNER_TEMP and
          # mounted from there (#256). A mount is resolved by the daemon, and
          # a runner in a pod has a daemon that does not see the runner's
          # /usr/bin: mounted by its installed path the client arrives as an
          # empty directory. RUNNER_TEMP is somewhere the daemon must already
          # see, or no workspace would mount either.
          stage="$RUNNER_TEMP/qare-docker-client"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -L "$(command -v docker)" "$stage/docker"
          docker_access=(--network host -v "$stage/docker:/usr/bin/docker:ro")
          # The plugins are named by the CLI that will run them, so they are
          # found wherever this runner keeps them. buildx travels with
          # compose because a compose file that builds its image builds
          # through it.
          plugins=""
          while read -r plugin path; do
            case "$plugin" in compose | buildx) ;; *) continue ;; esac
            [ -f "$path" ] || continue
            cp -L "$path" "$stage/docker-$plugin"
            docker_access+=(-v "$stage/docker-$plugin:/usr/local/lib/docker/cli-plugins/docker-$plugin:ro")
            plugins="$plugins $plugin"
          done < <(docker info --format '{{range .ClientInfo.Plugins}}{{println .Name .Path}}{{end}}' 2>/dev/null || true)
          case "$plugins" in
            *compose*) ;;
            *) echo "this runner's docker has no compose plugin, so a profile that boots its app with compose cannot boot it here: install docker compose v2 on the runner" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          # The daemon is the one this runner's docker talks to: its socket,
          # opened as the group that owns it, or the endpoint it is reached
          # at when that is not a socket.
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2>/dev/null || true)"
          case "$endpoint" in
            unix://*)
              socket="${endpoint#unix://}"
              docker_access+=(-v "$socket:/var/run/docker.sock" --group-add "$(stat -L -c %g "$socket")")
              ;;
            ?*) docker_access+=(-e "DOCKER_HOST=$endpoint") ;;
            *) echo "this runner's docker names no daemon endpoint, so a profile that boots its app cannot reach one" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          # One argument a line, for the steps that start the run's container.
          printf '%s\n' "${docker_access[@]}" > "$RUNNER_TEMP/qare-docker-access"
      # The opt-in build cache (#381): the images a boot builds read their
      # layers from the cache restored above. The runner's default docker
      # driver cannot use a local cache, so the builds run on a
      # docker-container builder this job makes for itself, handed to the
      # run's container with the docker access found above. A builder that
      # will not start leaves the images to build with no cache: the cache
      # only saves time, and never gates a run.
      - name: Make the build cache's builder
        if: inputs.build-cache == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/qare-buildx-builder"
          config="$RUNNER_TEMP/qare-buildx"
          builder="qare-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$config"
          mkdir -p "$config" "$RUNNER_TEMP/qare-build-cache" "$RUNNER_TEMP/qare-build-cache-new"
          if ! BUILDX_CONFIG="$config" docker buildx create --name "$builder" --driver docker-container --bootstrap > /dev/null; then
            echo "::warning::the build cache's builder could not be made, so the images build with no cache; the run is unaffected"
            exit 0
          fi
          printf '%s\n' "$builder" > "$RUNNER_TEMP/qare-buildx-builder"
          printf '%s\n' -e "BUILDX_CONFIG=$config" -e "BUILDX_BUILDER=$builder" -v "$config:$config" >> "$RUNNER_TEMP/qare-docker-access"
      - name: Run the plan on main
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          IMAGE_TAG_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PROFILE: ${{ inputs.profile }}
          FLAKE_ATTEMPTS: ${{ inputs.flake-attempts }}
          QUARANTINE: ${{ inputs.quarantine }}
          BUILD_CACHE: ${{ inputs.build-cache }}
        run: |
          set -uo pipefail
          # One revision, so one side: the base and the head are the same
          # commit, the run says there is nothing to compare, and whether a
          # failure is a regression is the ledger's record to say, not a
          # second boot's. The run is named for the workflow run, so two
          # runs on one runner never share a compose project.
          # The flake policy (#380): how many attempts a failing check gets,
          # and the quarantine store a check that failed and then passed is
          # recorded in. A retry never turns a failure into a pass: such a
          # check is quarantined and its criterion reported unverified.
          if ! [[ "${FLAKE_ATTEMPTS:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::flake-attempts takes a whole number of attempts, one or more, not '${FLAKE_ATTEMPTS:-}'"
            exit 1
          fi
          quarantine_args=()
          quarantine_mount=()
          quarantine_dir="$RUNNER_TEMP/qare-quarantine"
          if [ -n "${QUARANTINE:-}" ]; then
            case "$QUARANTINE" in
              /*|..|../*|*/..|*/../*)
                echo "::error::quarantine names a directory inside the repository, not '$QUARANTINE'"
                exit 1
                ;;
            esac
            # Fresh every run: a store an earlier job left on a runner that
            # outlived it is never read.
            rm -rf "$quarantine_dir"
            mkdir -p "$quarantine_dir"
            # The default branch is reviewed, so its own copy is the store.
            if [ -f "$PWD/$QUARANTINE/quarantine.json" ]; then
              cp "$PWD/$QUARANTINE/quarantine.json" "$quarantine_dir/quarantine.json"
            fi
            quarantine_args=(--quarantine "$quarantine_dir")
            quarantine_mount=(-v "$quarantine_dir:$quarantine_dir")
          fi
          # The build cache (#381): read from what was restored, and the
          # layers of this run's build exported for the step that saves them.
          cache_args=()
          cache_mount=()
          if [ "${BUILD_CACHE:-}" = "true" ] && [ -f "$RUNNER_TEMP/qare-buildx-builder" ]; then
            cache_args=(--build-cache-from "$RUNNER_TEMP/qare-build-cache" --build-cache-to "$RUNNER_TEMP/qare-build-cache-new")
            cache_mount=(-v "$RUNNER_TEMP/qare-build-cache:$RUNNER_TEMP/qare-build-cache" -v "$RUNNER_TEMP/qare-build-cache-new:$RUNNER_TEMP/qare-build-cache-new")
          fi
          mapfile -t docker_access < "$RUNNER_TEMP/qare-docker-access"
          safety_mount=()
          if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
            safety_mount=(-e QARE_RUNNER_SAFETY_FILE=/tmp/qare-runner-safety.json -v "$RUNNER_TEMP/qare-runner-safety.json:/tmp/qare-runner-safety.json:ro")
          fi
          code=0
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            "${safety_mount[@]}" \
            -e QARE_IMAGE_REF="$IMAGE_REF" \
            -e QARE_IMAGE_TAG="$IMAGE_TAG_REF" \
            -e QARE_IMAGE_DIGEST="$IMAGE_DIGEST" \
            -e QARE_RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:-}" \
            -e QARE_REPOSITORY_VISIBILITY="${QARE_REPOSITORY_VISIBILITY:-}" \
            -e QARE_SELF_HOSTED="${QARE_SELF_HOSTED:-}" \
            -e QARE_EPHEMERAL_RUNNERS="${QARE_EPHEMERAL_RUNNERS:-}" \
            -v "$PWD:$PWD" -w "$PWD" \
            "${quarantine_mount[@]}" \
            "${cache_mount[@]}" \
            "${docker_access[@]}" \
            "$IMAGE_REF" qare run --plan plan.json \
            --id "main-${RUN_ID}-${RUN_ATTEMPT}" \
            --repo "$PWD" \
            --base "$HEAD_SHA" \
            --head "$HEAD_SHA" \
            --profile "$PROFILE" \
            --flake-attempts "$FLAKE_ATTEMPTS" \
            "${quarantine_args[@]}" \
            "${cache_args[@]}" \
            --evidence evidence || code=$?
          # The store the run wrote goes up with the evidence, for a person
          # to commit where the quarantine input points.
          if [ -n "${quarantine_args[*]}" ] && [ -d evidence ] && [ -f "$quarantine_dir/quarantine.json" ]; then
            cp "$quarantine_dir/quarantine.json" evidence/quarantine.json
          fi
          # 3 is refused, as in execute: the run wrote result.json and
          # main_judge reports it. Without one, exit 3 is something else.
          if [ "$code" -eq 3 ]; then
            if [ ! -f evidence/result.json ]; then
              echo "exit 3 but no evidence/result.json: not a refusal qare recorded" >&2
              exit 1
            fi
            reason="$(jq -r '[.criteria[] | select(.outcome == "unverified") | .reason][0] // empty' evidence/result.json 2>/dev/null || true)"
            echo "qare refused this run: ${reason:-it recorded no reason}; main_judge will report it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 2 is blocked. When every unverified criterion is one the ledger
          # records no suite for, nothing was disproven and nothing is wrong
          # with the revision: the gap is in the ledger. Any other blocked
          # run, an environment that would not boot, is a fault and stays red.
          if [ "$code" -eq 2 ] && [ -f evidence/result.json ] && jq -e '
            .verdict == "blocked" and
            ([.criteria[] | select(.outcome == "unverified")] | length) > 0 and
            ([.criteria[] | select(.outcome == "unverified")
              | (.reason // "")
              | startswith("the planner could not plan it")] | all)
          ' evidence/result.json > /dev/null; then
            echo "verdict blocked: every criterion left unverified is one the ledger records no suite for; main_judge reports them, and nothing was disproven" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      # A failed or blocked verdict leaves this job red, and main_judge still
      # files it. Read whatever the run step exited with.
      - name: Read the recorded verdict
        id: recorded
        if: always()
        shell: bash
        # No readable verdict fails this step (rule 6): judge is skipped, so a
        # run that recorded nothing must not leave the pipeline green with
        # nothing posted. The report job names the failure instead.
        run: |
          set -euo pipefail
          if ! verdict="$(jq -ser 'select(length == 1) | .[0].verdict | select(type == "string" and IN("passed", "failed", "blocked", "refused", "waived"))' evidence/result.json)"; then
            echo "::error::evidence/result.json has no readable supported verdict, so no verdict output is written" >&2
            exit 1
          fi
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
      # Teardown is the caller's job (#53), and this pipeline is the caller.
      - name: Tear down what the run booted
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ ! -d evidence ] || [ ! -f "$RUNNER_TEMP/qare-docker-access" ]; then
            echo "no run evidence: nothing was booted, so there is nothing to tear down"
            exit 0
          fi
          mapfile -t projects < <(find evidence -name 'isolation*.json' -exec jq -r '.project // empty' {} + | sort -u)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "the run booted no compose project"
            exit 0
          fi
          mapfile -t docker_access < "$RUNNER_TEMP/qare-docker-access"
          if ! docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:$PWD" -w "$PWD" \
              "${docker_access[@]}" \
              "$IMAGE_REF" qare reap "${projects[@]}"; then
            echo "::warning::qare reap failed: a compose project this run booted may still be running on the runner (${projects[*]}); the verdict is unaffected"
          fi
      # The builder goes with the job that made it (#381).
      - name: Remove the build cache's builder
        if: always() && inputs.build-cache == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/qare-buildx-builder" ] || exit 0
          BUILDX_CONFIG="$RUNNER_TEMP/qare-buildx" docker buildx rm "$(cat "$RUNNER_TEMP/qare-buildx-builder")" > /dev/null 2>&1 \
            || echo "::warning::the build cache's builder could not be removed"
          rm -f "$RUNNER_TEMP/qare-buildx-builder"
      # Evidence is published, so it is redacted before it leaves this
      # machine, and a redaction that fails uploads nothing (#52).
      - name: Redact the evidence
        id: redact
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [ ! -d evidence ]; then
            echo "no evidence directory: nothing to redact or upload"
            exit 0
          fi
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:$PWD" -w "$PWD" \
            "$IMAGE_REF" qare redact --evidence evidence --profile "$PROFILE"
      - name: Upload evidence (raw results + result.json)
        id: evidence
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-evidence
          path: evidence/
          if-no-files-found: ignore
      # The cache the build just wrote (#381), saved in the default branch's
      # scope for the next run on main and for every pull request to read.
      # Only this job saves it, and only on the default branch: a pull
      # request's run never writes a cache another run reads.
      - name: Save the build cache
        if: >-
          always() && inputs.build-cache == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          hashFiles(format('{0}/qare-build-cache-new/**', runner.temp)) != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/qare-build-cache-new
          key: qare-build-cache-${{ runner.os }}-${{ github.run_id }}

  # label: main_judge (model key only)
  main_judge:
    name: main judge (model key only)
    needs: [main_collect, main_execute]
    if: always() && needs.main_execute.outputs.verdict != ''
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.recorded.outputs.ready }}
      verdict: ${{ steps.recorded.outputs.verdict }}
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Create a fresh judge output directory
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/qare-judge.XXXXXX")"
          printf 'path=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Pull the core image
        id: image
        shell: bash
        env:
          QARE_VERSION: ${{ needs.main_collect.outputs.qare-version }}
        run: |
          set -euo pipefail
          ref="ghcr.io/vividynamics/qare-core:$QARE_VERSION"
          if ! docker buildx version > /dev/null 2>&1; then
            echo "::error::qare image inspection needs Docker buildx with imagetools: install the buildx plugin alongside this runner's Docker client"
            exit 1
          fi
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"; then
            echo "::error::qare could not resolve the published image $ref to its registry digest; nothing was pulled"
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::qare registry inspection returned no valid SHA-256 digest for $ref; nothing was pulled"
            exit 1
          fi
          immutable="${ref%:*}@$digest"
          if ! docker pull "$immutable"; then
            echo "no published qare-core image for version $QARE_VERSION ($ref): the image family publishes when a release is tagged, so tag a release and the images job in qare's .github/workflows/release.yml publishes it; until then this pipeline stays red rather than building qare from source (#88)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$immutable" >> "$GITHUB_OUTPUT"
      - name: Download the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-inputs
          path: qa-inputs
      - name: Download the evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-evidence
          path: evidence
      - name: Read the executed verdict
        id: executed
        shell: bash
        run: |
          set -euo pipefail
          if ! verdict="$(jq -ser 'select(length == 1) | .[0].verdict | select(type == "string" and IN("passed", "failed", "blocked", "refused", "waived"))' evidence/result.json)"; then
            echo "::error::evidence/result.json has no readable supported verdict, so no verdict output is written" >&2
            exit 1
          fi
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
      - name: Judge the result on main
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          JUDGE_OUTPUT: ${{ steps.workspace.outputs.path }}
          MODEL_KEY: ${{ secrets.model-key }}
          MODEL_KEY_ENV: ${{ inputs.model-key-env }}
          NARE_PROVIDER: ${{ inputs.nare-provider }}
          NARE_BASE_URL: ${{ inputs.nare-base-url }}
          NARE_MODEL: ${{ inputs.nare-model }}
          NARE_CONTEXT_WINDOW: ${{ inputs.nare-context-window }}
          NARE_STREAM: ${{ inputs.nare-stream }}
          QARE_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
          QARE_VERIFY_BATCH_SIZE: ${{ inputs.verify-batch-size }}
          QARE_VERIFIER_IMAGE_INPUT: ${{ inputs.nare-image-input }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          # Fail closed (rule 6), as the judge step does: no key, no verifier.
          if [ -z "$MODEL_KEY" ]; then
            echo "no model key: the calling workflow must pass the model-key secret (secrets: model-key), and the secret it names must be set in the repository" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          if [[ ! "$MODEL_KEY_ENV" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "model-key-env must be the name of an environment variable (got '$MODEL_KEY_ENV')" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          # The window nare measures each turn against (#391), checked before
          # any model call: nare would refuse it only once its container ran.
          if [ -n "$NARE_CONTEXT_WINDOW" ] && [[ ! "$NARE_CONTEXT_WINDOW" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "nare-context-window must be a whole number of tokens above zero, at most nine digits (got '$NARE_CONTEXT_WINDOW')" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          # In a file, never in this shell: see the plan step.
          key_file="$(mktemp "$RUNNER_TEMP/model-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s=%s\n' "$MODEL_KEY_ENV" "$MODEL_KEY" > "$key_file"
          model_env=(--env-file "$key_file" -e NARE_PROVIDER -e NARE_MODEL)
          if [ -n "$NARE_STREAM" ]; then
            model_env+=(-e NARE_STREAM)
          fi
          if [ -n "$NARE_CONTEXT_WINDOW" ]; then
            model_env+=(-e NARE_CONTEXT_WINDOW)
          fi
          if [ -n "$QARE_MAX_OUTPUT_TOKENS" ]; then
            model_env+=(-e QARE_MAX_OUTPUT_TOKENS)
          fi
          if [ -n "$QARE_VERIFY_BATCH_SIZE" ]; then
            model_env+=(-e QARE_VERIFY_BATCH_SIZE)
          fi
          # Whether the verifier's model takes images (#439), checked before
          # any model call, and handed over only when it is set.
          if [ -n "$QARE_VERIFIER_IMAGE_INPUT" ]; then
            if [ "$QARE_VERIFIER_IMAGE_INPUT" != true ] && [ "$QARE_VERIFIER_IMAGE_INPUT" != false ]; then
              echo "nare-image-input is true or false (got '$QARE_VERIFIER_IMAGE_INPUT')" | tee -a "$GITHUB_STEP_SUMMARY" >&2
              exit 1
            fi
            model_env+=(-e QARE_VERIFIER_IMAGE_INPUT)
          fi
          if [ -n "$NARE_BASE_URL" ]; then
            model_env+=(-e NARE_BASE_URL)
          fi
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            "${model_env[@]}" \
            -v "$PWD:$PWD" -v "$JUDGE_OUTPUT:$JUDGE_OUTPUT" -w "$PWD" \
            "$IMAGE_REF" qare judge \
            --result evidence/result.json --outDir "$JUDGE_OUTPUT" \
            --plan qa-inputs/plan.json --no-diff --no-advisory \
            --nare /usr/local/bin/nare --profile "$PROFILE"
      - name: Read the judged verdict
        id: recorded
        if: always()
        shell: bash
        env:
          JUDGE_OUTPUT: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$JUDGE_OUTPUT" ]; then
            echo "::error::judge output directory missing; no readable supported verdict"
            exit 1
          fi
          if ! verdict="$(jq -ser 'select(length == 1) | .[0].verdict | select(type == "string" and IN("passed", "failed", "blocked", "refused", "waived"))' "$JUDGE_OUTPUT/judged-result.json")"; then
            echo "::error::judged-result.json has no readable supported verdict; publishing is not authorized" >&2
            exit 1
          fi
          printf 'verdict=%s\nready=true\n' "$verdict" >> "$GITHUB_OUTPUT"
      - name: Upload main judged result (judged-result.json)
        if: always() && steps.workspace.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-judge-artifacts
          path: |
            ${{ steps.workspace.outputs.path }}/judged-result.json
          if-no-files-found: ignore

  main_publish:
    name: main publish (GitHub token only)
    needs: [main_collect, main_execute, main_judge]
    if: always() && needs.main_judge.outputs.ready == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out the pinned qare's scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ViviDynamics/qare
          ref: ${{ inputs.qare-ref }}
          path: .qare-pipeline
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .qare-pipeline/.nvmrc
      - name: Mint the App token for this job
        id: app
        shell: bash
        env:
          QARE_APP_ID: ${{ secrets.app-id }}
          QARE_APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
          QARE_APP_PERMISSIONS: '{"contents":"write","issues":"write","pull_requests":"read"}'
        run: |
          set -euo pipefail
          script=.qare-pipeline/scripts/mint-app-token.mjs
          if [ ! -f "$script" ]; then
            if [ -z "$QARE_APP_ID" ] && [ -z "$QARE_APP_PRIVATE_KEY" ]; then
              echo "the qare this pipeline pinned is older than the minting step and carries no script for it; no GitHub App was passed, so there is nothing to mint"
              exit 0
            fi
            echo "::error::the qare this pipeline pinned is older than the minting step and carries no script for it, so it cannot post as the GitHub App that was passed: run a qare that carries the script, or pass no App"
            exit 1
          fi
          node "$script"
      - name: Pull the core image
        id: image
        shell: bash
        env:
          IMAGE_REF: ${{ needs.main_judge.outputs.image-digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/vividynamics/qare-core@sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::judge recorded no valid immutable qare-core image; nothing is published"
            exit 1
          fi
          docker pull "$IMAGE_REF"
          printf 'digest=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Check that the image reads the minted token
        if: steps.app.outputs.token != ''
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # grep's own answer: 0 found, 1 not found. Anything else is a
          # docker or an image that could not be asked, and is said as that.
          status=0
          docker run --rm --network none --entrypoint grep "$IMAGE_REF" \
            -q QARE_APP_TOKEN /opt/qare/lib/packages/action/dist/identity.js || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::the qare image this run pulled ($IMAGE_REF) is older than the minted token and would not post as the GitHub App that was passed: run a qare whose image reads it, or pass no App"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::the qare image this run pulled ($IMAGE_REF) could not be inspected (status $status), so it is not known to read the minted token: nothing is posted with it"
            exit 1
          fi
      - name: Download main-judge-artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-judge-artifacts
          path: judged
      - name: File what the run on main found
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
          QARE_APP_SLUG: ${{ steps.app.outputs.slug }}
          QARE_APP_TOKEN_EXPIRES_AT: ${{ steps.app.outputs.expires-at }}
          QARE_GITHUB_TOKEN: ${{ secrets.personal-access-token }}
          MAIN_LANE_DRY_RUN: ${{ inputs.main-lane-dry-run }}
          MAIN_LANE_RECORD_PASSES: ${{ inputs.main-lane-record-passes }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          EVIDENCE_URL: ${{ needs.main_execute.outputs.evidence-url }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          dry=true
          if [ "${MAIN_LANE_DRY_RUN:-}" = "false" ]; then
            dry=false
          fi
          # Recording what the run proved (#295) is asked for in one exact
          # word too. The command decides what a pass is, from the judged
          # result and the ledger, and on a dry run only says what it would
          # record.
          record=false
          if [ "${MAIN_LANE_RECORD_PASSES:-}" = "true" ]; then
            record=true
          fi
          # What the run amounted to is said first, with every criterion it
          # left unverified and why: "nothing to file" must never read as
          # "everything passed" when a criterion was not checked at all. A
          # reason can be a model's words, so its line breaks are folded.
          jq -r '
            "the run on main: verdict \(.verdict); \([.criteria[] | select(.outcome == "proven")] | length) proven, \([.criteria[] | select(.outcome == "failed")] | length) failed, \([.criteria[] | select(.outcome == "unverified")] | length) unverified",
            (.criteria[] | select(.outcome == "unverified") | "  unverified \(.id): \((.reason // "no reason recorded") | gsub("[\r\n]+"; " "))")
          ' judged/judged-result.json > main-findings.txt
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GITHUB_TOKEN \
            -e QARE_APP_TOKEN \
            -e QARE_APP_SLUG \
            -e QARE_APP_TOKEN_EXPIRES_AT \
            -e QARE_GITHUB_TOKEN \
            -e GITHUB_REPOSITORY \
            -v "$PWD:$PWD" -w "$PWD" \
            --entrypoint node \
            "$IMAGE_REF" /opt/qare/lib/packages/action/dist/index.js main-findings \
            --result judged/judged-result.json --ledger "$PROFILE" --profile "$PROFILE" \
            --sha "$HEAD_SHA" --run-url "$RUN_URL" --artifact-url "$EVIDENCE_URL" \
            --dry-run "$dry" --record-passes "$record" --passes-profile "$PROFILE" >> main-findings.txt
          # The text quotes the run, the ledger and a model, so nothing in it
          # may be read as an instruction. In the log it sits between a
          # stop-commands marker and its one-time token, so no line of it is a
          # workflow command. In the summary it is an indented block, which no
          # line of the text can close, so nothing in it renders or mentions.
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$token"
          cat main-findings.txt
          echo "::$token::"
          {
            if [ "$dry" = "true" ]; then
              echo "### Findings on main: dry run"
              echo
              echo "Nothing was filed and nobody was mentioned. This is what a real run would have done; pass \`main-lane-dry-run: 'false'\` to file."
            else
              echo "### Findings on main"
            fi
            echo
            sed 's/^/    /' main-findings.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload main publishing report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-publish-artifacts
          path: main-findings.txt
          if-no-files-found: ignore
      - name: Revoke the App token this job minted
        if: always() && steps.app.outputs.token != ''
        shell: bash
        env:
          QARE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # On curl's standard input, never its command line.
          curl --fail --silent --show-error -X DELETE \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/installation/token" \
            -H @- <<< "Authorization: Bearer $QARE_APP_TOKEN" || echo "::warning::the App token this job minted could not be revoked; it expires within the hour"
