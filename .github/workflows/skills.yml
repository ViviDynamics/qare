name: Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wiring:
    name: skills wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the repo is wired for its skills
        run: |
          cp repo.env.example repo.env
          .agents/skills/ci-safety/scripts/check-wiring
      - name: Check every skill carries identical scripts
        run: |
          for dir in .agents/skills/*/scripts; do
            diff -r .agents/skills/ci-safety/scripts "$dir"
          done
      - name: Check the scripts parse
        run: |
          for f in .agents/skills/ci-safety/scripts/*; do
            case "$f" in *.json) continue;; esac
            bash -n "$f"
          done

  quality-guard:
    name: quality guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Block weakened quality gates unless the PR justifies them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp repo.env.example repo.env
          .agents/skills/merge-pr/scripts/quality-guard --pr ${{ github.event.pull_request.number }}
